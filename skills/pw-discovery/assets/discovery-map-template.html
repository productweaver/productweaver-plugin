/* ---------- Next interviews: the plan for the next round ---------- */
/* The open gaps of the core job on screen, ranked as kb_tool's open_gaps ranks them (main-finding gaps first, then
   thin steps, needs heard from one person and kinds of people nobody has yet; fewest people first). The plan comes
   from the overview's next.learn, which the assistant writes and kb_tool checks. */
const nextview=document.getElementById("nextview"), NX_KINDS=["step","need","who"];
function nxLearn(){ const n=M.over && M.over.next; return n && n.learn && typeof n.learn==="object" ? n.learn : {}; }
function nxLive(ref){
  const all=(M.raw.desired_outcomes||{}).outcomes||[], seen=new Set(); let r=String(ref);
  for(;;){ const o=all.find(x=>String(x.id)===r); if(!o || !o.merged_into || seen.has(r)) return r; seen.add(r); r=String(o.merged_into); }
}
const nxValues = learn => (learn.traits||[]).flatMap(tr=>(tr.values||[]).map(v=>({...v, id:String(v.id), name:tr.name||""})));
function nxGaps(){
  const learn=nxLearn(), live=new Set(M.outs.map(o=>o.oid));
  const main=new Set((learn.rests_on||[]).map(nxLive).filter(r=>live.has(r)));
  const mainSteps=new Set(M.outs.filter(o=>main.has(o.oid)).map(o=>o.step));
  return [...M.steps.filter(s=>s.allPeople.length<3).map(s=>({ref:s.key, node:s.id, kind:"step", main:mainSteps.has(s.key), people:s.allPeople, text:s.text})),
    ...M.outs.filter(o=>o.people.length<=1 || (main.has(o.oid) && o.people.length<3)).map(o=>({ref:o.oid, node:o.id, kind:"need", main:main.has(o.oid), people:o.people, text:o.plain})),
    ...nxValues(learn).filter(v=>!(v.interviews||[]).length).map(v=>({ref:v.id, node:"", kind:"who", main:false, people:[], text:`${v.name}: ${v.label||""}`}))]
    .sort((a,b)=>(a.main?0:1)-(b.main?0:1) || NX_KINDS.indexOf(a.kind)-NX_KINDS.indexOf(b.kind) || a.people.length-b.people.length || a.ref.localeCompare(b.ref,undefined,{numeric:true}));
}
/* How the last round went: its targets that are no longer open. A kind of person whose label changed is not counted. */
function nxLast(learn, gaps){
  const prev=learn.previous; if(!prev || typeof prev!=="object") return null;
  const labels=Object.fromEntries(nxValues(learn).map(v=>[v.id, v.label])), open=new Set(gaps.map(g=>g.ref));
  const known=new Set([...M.steps.map(s=>s.key), ...M.outs.map(o=>o.oid)]); // a moved outcome's old ID is gone, not closed
  const targets=(prev.targets||[]).filter(x=>x.label ? labels[String(x.ref)]===x.label : known.has(nxLive(x.ref)))
    .map(x=>x.label ? String(x.ref) : nxLive(x.ref)), still=targets.filter(r=>open.has(r));
  return {closed:targets.length-still.length, targeted:targets.length, open:still};
}
/* The way to the next level of "How sure is this?": a count of conversations, or keep going. */
function nxToNext(sure, n){
  const more=sure.level===1 ? 3-n : sure.level===2 ? Math.max(8-n,0) : 0;
  return more ? t("map.nx.to_next",{n:more, level:t(OV_SURE[sure.level])}) : sure.level===2 ? t("map.nx.keep_going") : "";
}
/* The open gaps the round's entries back up, in the order of the gaps. */
function nxAimed(round, gaps){ const aimed=new Set((round||[]).flatMap(e=>(e && e.gaps)||[])); return gaps.filter(g=>aimed.has(g.ref)); }
/* The interview kit exists only when the round backs up at least one open gap: else its sheets ask about settled things. */
const nxKitOk = (round, gaps) => nxAimed(round, gaps).length > 0;
/* One item per call: an entry for 2 people gives 2 calls, numbered across the round. */
const nxCalls = round => (round||[]).flatMap(e=>Array.from({length:Math.max(1, +e.count||1)}, ()=>e)).map((entry,i)=>({entry, n:i+1}));
/* An entry that asks someone in the study again (kind follow_up) names one person: no count, who or traits. It is
   one call, and the owner's words for it are "Ask Dana Reyes". */
const nxAgain = e => !!e && e.kind==="follow_up";
const nxName = e => ivName(String(e.interview||""));
const nxWho = e => nxAgain(e) ? t("map.nx.ask", {name:nxName(e)}) : e.who||"";
/* pw-rules asks `listen` for "what to write down: what it shows"; a line with no colon is all "write down". */
function nxSplitListen(s){
  const text=String(s||"").trim(), at=text.search(/[:：]/);
  return at<0 ? {write:text, why:""} : {write:text.slice(0,at).trim(), why:text.slice(at+1).trim()};
}
/* The day the plan was written, else today, as the guide writes it: 2026-11-15. */
function nxKitDate(){
  const w=M.over && M.over.written; if(typeof w==="string" && /^\d{4}-\d{2}-\d{2}$/.test(w)) return w;
  const d=new Date(), two=x=>String(x).padStart(2,"0");
  return `${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`;
}
/* The title promises only the gaps the round's cards back up, not every open gap. It counts new people, and the
   people in the study the plan asks again. */
function nxTitle(round, gaps){
  const n=nxAimed(round, gaps).length, known=round.filter(nxAgain).length, fresh=round.filter(e=>!nxAgain(e));
  const people=t("map.nx.people",{n:fresh.reduce((a,e)=>a+(+e.count||1),0)});
  return !gaps.length ? t("map.nx.enough") : !round.length || !n ? t("map.nx.title_none",{n:gaps.length})
    : !known ? t("map.nx.title",{people, gaps:t("map.nx.gaps",{n})})
    : t(fresh.length ? "map.nx.title_ask" : "map.nx.title_ask_only", {people, known:t("map.nx.known",{n:known}), gaps:t("map.nx.gaps",{n})});
}
const nxStep = (n,ask,answer,body) => `<section class="ov-blk ov-step" id="nx-s${n}"><p class="ov-ask"><b>${n}</b>${ask}</p><h2 class="ov-ans">${esc(fullStop(answer))}</h2>${body}</section>`;
function renderNxView(){
  const learn=nxLearn(), gaps=nxGaps(), round=Array.isArray(learn.round)?learn.round:[], values=nxValues(learn);
  const traits=(learn.traits||[]).filter(tr=>Array.isArray(tr.values)), scope=overScope(), sure=overSure(scope), n=scope.length;
  const byRef=Object.fromEntries([...M.steps.map(s=>[s.key,s.text]), ...M.outs.map(o=>[o.oid,o.plain]), ...values.map(v=>[v.id,v.label||""])]);
  const cards=ref=>round.map((e,i)=>(e.gaps||[]).includes(ref)?i+1:0).filter(Boolean);
  const toCard=ref=>{ const c=cards(ref); return c.length ? th("map.nx.to_card",{list:esc(joinList(c.map(String)))}) : ""; };
  const guide=M.made && M.made.guides && M.made.guides[M.job], last=nxLast(learn,gaps);
  const lead=`<section class="ov-blk ov-lead" id="nx-s0"><p class="ov-note">${esc(sentences(t("map.nx.kicker"), many()?t("map.next.shown_for",{job:jobName(M.job)}):""))}</p>
    <h2 class="ov-bl">${esc(nxTitle(round, gaps))}</h2>
    ${!gaps.length?`<button type="button" class="ov-lk" data-nx-view="over">${th("map.nx.see_next")}</button>`:!round.length?`<div class="ov-todo">${th("map.nx.ask_assistant")}</div>`:M.overStale?`<div class="flag">${th("map.ov.lead.stale")}</div>`:""}
    <div class="nx-actions">${guide&&round.length?`<button type="button" class="nx-btn" data-nx-copy>${th("map.nx.copy")}</button>`:""}${nxKitOk(round, gaps)?`<button type="button" class="nx-btn nx-ghost" data-nx-print>${th("map.nx.print_kit")}</button>`:""}</div>${nxDecide()}</section>`;
  const s1=nxStep(1, th("map.nx.q.sure"), sentences(fullStop(t(OV_SURE[sure.level-1])), nxToNext(sure, n)),
    `<div class="ov-sure"><ol class="ov-gauge lv${sure.level}" aria-label="${esc(t("map.ov.sure.aria",{name:t(OV_SURE[sure.level-1]), level:sure.level}))}">${OV_SURE.map((l,i)=>`<li class="${i+1<sure.level?"done":i+1===sure.level?"now":""}">${th(l)}</li>`).join("")}</ol><p class="ov-note">${esc(sure.text)}</p></div>
    ${last?`<div class="nx-last${last.closed?" nx-won":""}">${last.closed?'<svg class="ap-ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#ap-check"/></svg>':""}<b>${th("map.nx.last",{closed:last.closed, targeted:last.targeted})}</b> ${last.open.length?th("map.nx.still_open",{list:esc(joinList(last.open.map(r=>noStop(byRef[r]||r))))}):""}</div>`:""}`);
  const chip=ref=>{ const g=gaps.find(x=>x.ref===ref), text=esc(g?g.text:byRef[ref]||ref), main=g&&g.main?`<i class="nx-main">${th("map.nx.main")}</i>`:"";
    return g&&g.node ? `<button type="button" class="nx-chip" data-nx-go="${esc(g.node)}">${text}${main}</button>` : `<span class="nx-chip${g?"":" nx-done"}">${text}${main}</span>`; };
  const ini=id=>{ const i=M.ivById[id], name=i?i.name:id; return `<span class="nx-ini" title="${esc(name)}">${esc(initials(name))}</span>`; };
  /* under a card's title: how many people and of what kind; for someone asked again, the kinds of people they are
     and when you last heard from them */
  const note=e=>{ if(!nxAgain(e)) return [t("map.nx.count",{n:+e.count||1}), ...(e.traits||[]).map(id=>values.find(v=>v.id===String(id))).filter(Boolean).map(v=>`${v.name}: ${v.label}`)];
    const id=String(e.interview||""), last=ixLast(M.ivById[id]);
    return [...values.filter(v=>(v.interviews||[]).map(String).includes(id)).map(v=>`${v.name}: ${v.label}`), ...last?[t("map.nx.last_heard",{date:fmtDate(last)})]:[]]; };
  const card=(e,i)=>`<article class="nx-card" id="nx-c${i+1}"><div class="nx-head"><b class="nx-num">${i+1}</b><div><h3>${esc(nxWho(e))}</h3><p class="ov-note">${esc(note(e).join(" · "))}</p></div>${nxAgain(e)?ini(String(e.interview||"")):""}<button type="button" class="nx-btn nx-ghost" data-nx-copy="${i}">${th("map.nx.copy_one")}</button></div>
    <div class="nx-fills"><span class="ov-note">${th("map.nx.backs_up")}</span>${(e.gaps||[]).map(chip).join("")}</div>
    <ol class="nx-qs">${(e.questions||[]).map(q=>`<li><q>${esc(q.ask||"")}</q><p><span>${th("map.nx.listen")}</span> ${esc(q.listen||"")}</p></li>`).join("")}</ol></article>`;
  const known=round.filter(nxAgain).length, kinds=round.length-known; // people asked again are not to be found
  const who=!known ? t("map.nx.a.who",{n:round.length}) : kinds ? sentences(t("map.nx.a.who",{n:kinds}), t("map.nx.a.who_again",{n:known}))
    : t("map.nx.a.who_again_only",{n:known});
  const s2=round.length?nxStep(2, th("map.nx.q.who"), who, round.map(card).join("")+(learn.tip?`<p class="nx-tip"><b>${th("map.nx.tip")}</b> ${esc(learn.tip)}</p>`:"")):"";
  const missing=values.filter(v=>!(v.interviews||[]).length);
  let grid="";
  if(traits.length>=2){
    const [rows, cols, third]=traits.slice(0,3).sort((a,b)=>b.values.length-a.values.length); // the two biggest make the grid
    const gone=v=>!(v.interviews||[]).length;
    const cell=(r,c)=>{ const ids=(r.interviews||[]).filter(x=>(c.interviews||[]).includes(x)), miss=[r,c].find(gone);
      return ids.length ? `<td>${ids.map(ini).join(" ")}</td>` : miss ? `<td class="nx-miss"><b>${th("map.nx.nobody")}</b> <span class="ov-note">${toCard(String(miss.id))}</span></td>` : `<td class="nx-dot">·</td>`; };
    grid=`<div class="nx-gridwrap"><table class="nx-grid"><thead><tr><th></th>${cols.values.map(c=>`<th scope="col"${gone(c)?' class="nx-miss"':""}>${esc(c.label)}</th>`).join("")}</tr></thead>
      <tbody>${rows.values.map(r=>`<tr><th scope="row"${gone(r)?' class="nx-miss"':""}>${esc(r.label)}</th>${cols.values.map(c=>cell(r,c)).join("")}</tr>`).join("")}</tbody></table></div>
      ${third?`<div class="nx-fills"><span class="ov-note">${esc(third.name)}</span>${third.values.map(v=>`<span class="nx-chip${gone(v)?"":" nx-done"}">${esc(v.label)} ${(v.interviews||[]).map(ini).join(" ")||th("map.nx.nobody")}</span>`).join("")}</div>`:""}
      <p class="ov-note">${th("map.nx.grid_note",{rows:esc(rows.name), cols:esc(cols.name)})}</p>`;
  }
  const s3=traits.length?nxStep(3, th("map.nx.q.heard"), missing.length?t("map.nx.a.missing",{list:joinList(missing.map(v=>v.label))}):t("map.nx.a.covered"), grid):"";
  const kindOf=id=>joinList(values.filter(v=>(v.interviews||[]).includes(id)).map(v=>v.label));
  const said=g=>g.kind==="who" ? t("map.nx.nobody") : joinList(g.people.map(id=>{ const i=M.ivById[id], k=kindOf(id); return (i?i.name:id)+(k?` (${k})`:""); }));
  const item=g=>{ const to=toCard(g.ref), inner=`<span>${esc(g.text)}</span><small>${esc(said(g))}</small><em class="${to?"":"nx-out"}">${to||th("map.nx.not_in_round")}</em>`;
    return `<li>${g.node?`<button type="button" class="nx-gap" data-nx-go="${esc(g.node)}">${inner}</button>`:`<div class="nx-gap">${inner}</div>`}</li>`; };
  const restsOk=[...new Set((learn.rests_on||[]).map(nxLive))].filter(r=>M.outs.some(o=>o.oid===r) && !gaps.some(g=>g.ref===r)).length;
  const groups=[["main","map.nx.g.main"],["step","map.nx.g.step"],["need","map.nx.g.need"],["who","map.nx.g.who"]].map(([kind,key])=>{
    const list=gaps.filter(g=>kind==="main"?g.main:!g.main&&g.kind===kind);
    const body=list.length?`<ul>${list.slice(0,5).map(item).join("")}</ul>${list.length>5?`<ul class="nx-fold" hidden>${list.slice(5).map(item).join("")}</ul><button type="button" class="nx-more" data-nx-more>${th("map.nx.more",{n:list.length-5})}</button>`:""}`:"";
    const extra=kind==="main"&&restsOk?`<p class="nx-ok">${th("map.nx.main_ok",{n:restsOk, thin:3})}</p>`:kind==="step"&&!list.length?`<p class="ov-note">${th("map.next.thin_none")}</p>`:"";
    return body||extra?`<div class="nx-group" data-kind="${kind}"><h3>${th(key,{thin:3})}</h3>${body}${extra}</div>`:""; }).join("");
  const s4=nxStep(4, th("map.nx.q.thin"), gaps.length?t("map.nx.a.thin",{n:gaps.length}):t("map.nx.a.none"), groups);
  const rail=[[1,"map.nx.rail.sure"],[2,"map.nx.rail.who"],[3,"map.nx.rail.heard"],[4,"map.nx.rail.thin"]].filter(([k])=>(k!==2||round.length)&&(k!==3||traits.length));
  nextview.innerHTML=`<div class="ov-page"><nav class="ov-rail" aria-label="${esc(t("map.nx.rail.aria"))}"><ol>${rail.map(([k,l])=>`<li><button type="button" data-nx-to="nx-s${k}"><b>${k}</b><span>${th(l)}</span></button></li>`).join("")}</ol></nav>
    <article class="ov-sheet">${lead}${s1}${s2}${s3}${s4}</article></div>`;
}
/* The interview kit that Print gives in Next interviews: a plan for the round, then one sheet per call to run it from
   and write on (spec: docs/superpowers/specs/2026-11-15-interview-kit-design.md). Empty when the round backs up no
   open gap. Note lines per question, by how many questions the call has: a call with 1 or 2 questions fits one page
   on A4 and Letter; one with 3 or 4 takes two pages, so it gets room to write, and its end stays with its questions. */
const KIT_LINES = [0, 8, 3, 4, 4];
function renderNxKit(){
  const learn=nxLearn(), round=Array.isArray(learn.round)?learn.round:[], gaps=nxGaps();
  if(!nxKitOk(round, gaps)) return "";
  const values=nxValues(learn), calls=nxCalls(round), total=calls.length, aimed=nxAimed(round, gaps);
  const fresh=calls.filter(c=>!nxAgain(c.entry)).length; // calls with new people: asking someone again needs no invites
  const scope=overScope(), sure=overSure(scope), date=nxKitDate(), job=M.jobById[M.job], toNext=nxToNext(sure, scope.length);
  const quoted=key=>esc(t("map.text.quote",{q:t(key)}));
  const head=`<div class="kit-rh"><span><b>${esc(M.project)}</b> · ${th("map.nx.kit.head")}</span><span>${esc(t("map.nx.kit.plan_date",{date}))}</span></div>`;
  const lines=n=>`<div class="kit-lines">${"<i></i>".repeat(n)}</div>`, box='<span class="kit-box"></span>';
  const fitOf=e=>joinList((e.traits||[]).map(id=>values.find(v=>v.id===String(id))).filter(Boolean).map(v=>`${v.name}: ${v.label||""}`));
  const lead=sentences(t("map.nx.kit.lead",{aimed:aimed.length, all:gaps.length}),
    aimed.some(g=>g.main) ? t("map.nx.kit.lead_main") : "", t("map.nx.kit.stop"));
  const plan=`<section class="kit-plan">${head}
    ${M.overStale?`<p class="kit-stale">${th("map.nx.kit.stale")}</p>`:""}
    ${job?`<p class="kit-kick">${esc(job.statement)}</p>`:""}
    <h2>${th("map.nx.kit.title",{n:total})}</h2>
    <p class="kit-lead">${esc(lead)}</p>
    <div class="kit-top"><div class="kit-sec"><h3><span>${th("map.nx.kit.sure")}</span><small>${th("map.nx.kit.so_far",{n:scope.reduce((a,i)=>a+i.ix.length,0)})}</small></h3>
      <div class="kit-bar lv${sure.level}" aria-hidden="true">${OV_SURE.map((l,i)=>`<i class="${i<sure.level?"on":""}"></i>`).join("")}</div>
      <div class="kit-levels">${OV_SURE.map((l,i)=>i+1===sure.level?`<b>${th(l)}</b>`:`<span>${th(l)}</span>`).join("")}</div>
      ${toNext?`<p class="kit-small">${esc(toNext)}</p>`:""}</div>
    ${M.over && M.over.bottom_line?`<div class="kit-finding"><p class="kit-small">${th("map.nx.kit.finding")}</p><p>${esc(fullStop(M.over.bottom_line))}</p></div>`:""}</div>
    <div class="kit-sec"><h3><span>${th("map.nx.kit.calls")}</span><small>${th("map.nx.kit.tick")}</small></h3>
      <table class="kit-calls"><thead><tr><th></th><th>${th("map.nx.kit.col.who")}</th><th>${th("map.nx.kit.col.fit")}</th>
        <th class="c">${th("map.nx.kit.col.booked")}</th><th class="c">${th("map.nx.kit.col.done")}</th><th class="c">${th("map.nx.kit.col.sent")}</th></tr></thead>
      <tbody>${calls.map(({entry, n})=>`<tr><td class="kit-num">${n}</td><td>${esc(nxWho(entry))}</td><td>${esc(nxAgain(entry)?"":fitOf(entry))}</td>
        <td class="c">${box}</td><td class="c">${box}</td><td class="c">${box}</td></tr>`).join("")}</tbody></table></div>
    <div class="kit-plan-end">${fresh?`<div class="kit-sec"><h3><span>${th("map.nx.kit.ask_h")}</span><small>${th("map.nx.kit.write_to",{n:fresh, invites:3*fresh})}</small></h3>
      <p class="kit-say kit-quote">${quoted("map.nx.kit.say.invite")}</p><p class="kit-small" style="margin-top:2mm">${th("map.nx.kit.where")}</p></div>`:""}
    <div class="kit-sec"><h3><span>${th("map.nx.kit.rules")}</span></h3>
      <ol class="kit-rules"><li>${learn.tip?esc(learn.tip):th("map.nx.kit.rule.last")}</li><li>${th("map.nx.kit.rule.show")}</li><li>${th("map.nx.kit.rule.write")}</li></ol></div>
    ${M.proposals.length?`<p class="kit-decide">${th("map.nx.kit.decide",{n:M.proposals.length})}</p>`:""}</div></section>`;
  /* A sheet for asking someone again has no check before booking and no warm-up: it opens with thanks for last time,
     and, on a call, asks to record before the questions, in a first call's words. Its side column ends with how else
     to ask (a chat, an email) and how to hand the answer back. */
  const sheet=({entry:e, n})=>{
    const qs=Array.isArray(e.questions)?e.questions:[], room=KIT_LINES[Math.min(qs.length,4)]||3, again=nxAgain(e), fit=again?"":fitOf(e);
    const learns=(e.gaps||[]).map(ref=>gaps.find(g=>g.ref===ref)).filter(Boolean), warm=again?0:1;
    return `<section class="kit-call" data-call="${n}">${head}
      <p class="kit-kick">${th("map.nx.kit.call",{i:n, total})}</p>
      <h2>${esc(nxWho(e))}</h2>
      <div class="kit-fields"><span class="kit-field">${th("map.nx.kit.name")} <i></i></span><span class="kit-field">${th("map.nx.kit.date")} <i></i></span>
        <span class="kit-check">${box} ${th("map.nx.kit.rec_on")}</span><span class="kit-check">${box} ${th("map.nx.kit.notes_only")}</span></div>
      ${fit?`<p class="kit-fit"><b>${th("map.nx.kit.fit")}</b> ${esc(fit)}</p>`:""}
      <div class="kit-body"><aside class="kit-side">
        <div><h3>${th("map.nx.kit.short_h")}</h3><p class="kit-say">${esc(t("map.nx.kit.say.probes"))}</p><p>${th("map.nx.kit.short_wait")}</p></div>
        <div><h3>${th("map.nx.kit.never_h")}</h3><p>${th("map.nx.kit.never")}</p></div>
        <div><h3>${th("map.nx.kit.idea_h")}</h3><p class="kit-say">${quoted("map.nx.kit.say.idea")}</p></div>
        <div><h3>${th("map.nx.kit.norec_h")}</h3><p>${th("map.nx.kit.norec")}</p></div>
        ${learns.length?`<div><h3>${th("map.nx.kit.learns")}</h3><ul>${learns.map(g=>`<li>${esc(g.text)}${g.main?` <span class="kit-mark">${th("map.nx.main")}</span>`:""}</li>`).join("")}</ul></div>`:""}${again?`<div><p>${esc(t("map.nx.kit.again_how",{name:nxName(e)}))}</p></div>`:""}
      </aside><div class="kit-main">
        <div class="kit-step"><h3><b>1</b>${th("map.nx.kit.step.start")}</h3><p class="kit-say">${again?esc(t("map.text.quote",{q:t("map.nx.kit.say.again",{n:qs.length})})):quoted("map.nx.kit.say.open")}</p>${again?`<p class="kit-record">${th("map.nx.kit.again_record")}</p>`:""}</div>
        ${warm?`<div class="kit-step"><h3><b>2</b>${th("map.nx.kit.step.warm")}</h3><p class="kit-say">${quoted("map.nx.kit.say.warm")}</p>${lines(2)}</div>`:""}
        <div class="kit-step"><h3><b>${2+warm}</b>${th("map.nx.kit.step.ask")}</h3>${qs.map((q,k)=>{ const l=nxSplitListen(q && q.listen);
          return `<div class="kit-q"><p class="kit-ask">${k+1}. ${esc(t("map.text.quote",{q:(q && q.ask)||""}))}</p>
            <p class="kit-write"><b>${th("map.nx.kit.write")}</b> ${esc(l.write)}</p>${l.why?`<p class="kit-why">${th("map.nx.kit.why")} ${esc(l.why)}</p>`:""}${lines(room)}</div>`; }).join("")}</div>
        <div class="kit-step"><h3><b>${3+warm}</b>${th("map.nx.kit.step.end")}</h3><p class="kit-say">${quoted("map.nx.kit.say.close_1")} ${quoted("map.nx.kit.say.close_2")}</p>${lines(2)}
          <p class="kit-then">${th("map.nx.kit.end_then")}</p></div>
      </div></div>
      <p class="kit-foot"><b>${th("map.nx.kit.after")}</b> <span class="kit-say">${quoted("map.nx.kit.say.after")}</span></p></section>`;
  };
  return plan + calls.map(sheet).join("");
}
/* The decisions waiting, here too, next to the plan they change. */
function nxDecide(){ return M.proposals.length ? `<div class="nx-decide">${decideHTML("h3")}</div>` : ""; }
function nxQuestions(i){
  const e=nxLearn().round[i]; return [nxWho(e), ...(e.questions||[]).map((q,k)=>`${k+1}. ${q.ask}\n   ${t("map.nx.listen")}: ${q.listen}`)].join("\n");
}
function nxCopy(text, btn){
  const done=()=>{ const was=btn.innerHTML; btn.innerHTML=th("map.nx.copied"); setTimeout(()=>{ btn.innerHTML=was; },1500); };
  const fallback=()=>{ const a=document.createElement("textarea"); a.value=text; document.body.appendChild(a); a.select(); try{ document.execCommand("copy"); done(); }catch(_){ /* nothing to copy with */ } a.remove(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
nextview.addEventListener("click",e=>{
  const at=sel=>e.target.closest(sel); let b;
  if((b=at("[data-nx-go]"))){ setView("map"); focusNode(b.dataset.nxGo); drawer.scrollIntoView({block:"nearest"}); }
  else if((b=at("[data-nx-to]"))){ const el=document.getElementById(b.dataset.nxTo); if(el) el.scrollIntoView({block:"start"}); }
  else if((b=at("[data-nx-more]"))){ b.previousElementSibling.hidden=false; b.remove(); }
  else if((b=at("[data-nx-view]"))) setView(b.dataset.nxView);
  else if(at("[data-nx-print]")){ if(nxKitPrep()) window.print(); }
  else if((b=at("[data-nx-copy]"))) nxCopy(b.dataset.nxCopy==="" ? M.made.guides[M.job] : nxQuestions(+b.dataset.nxCopy), b);
});
/* Print fills the kit, and names the page so "Save as PDF" suggests "<study> interview kit <date>"; after printing,
   or when the print window is closed, the page is as it was. Command-P in Next interviews does the same. */
let kitTitle = null;
function nxKitPrep(){
  const learn=nxLearn(), round=Array.isArray(learn.round)?learn.round:[];
  if(!nxKitOk(round, nxGaps())) return false;
  document.getElementById("nxkit").innerHTML = renderNxKit();
  document.body.classList.add("nx-print");
  if(kitTitle===null) kitTitle = document.title;
  document.title = t("map.nx.kit.file", {project:M.project, date:nxKitDate()});
  return true;
}
function nxKitDone(){
  document.body.classList.remove("nx-print"); document.getElementById("nxkit").innerHTML = "";
  if(kitTitle!==null){ document.title = kitTitle; kitTitle = null; }
}
addEventListener("beforeprint",()=>{ if(viewNow()==="next" && !document.body.classList.contains("nx-print")) nxKitPrep(); });
addEventListener("afterprint", nxKitDone);

/* ---------- the live map ---------- */
/* A map that kb_tool wrote into the study's pw-output folder follows the study. kb_tool also writes
   .map-live/status.js beside it: the map's build, when it was made, and what the assistant is doing. The map loads that
   file again every few seconds: a page opened from disk may load a script beside it, but not fetch a file, and the
   query makes Safari read it again. When it names a newer build, the map reloads itself and keeps the reader's place;
   it waits while a window is open, the kit is printing, text is selected or the map is being moved. The title bar says
   when the map last changed, that the study is being updated, or that this copy does not update by itself. A notice
   says what changed, and New badges mark what this browser has not seen yet. */
const LV = {own:"", at:"", user:false, state:"wait", everOk:false, errs:0, seq:0, busy:false, timer:0, workRaw:null,
  ready:null, open:null, newest:0, base:0, from:null, pending:false, asked:false, noteTimer:0, seenTimer:0, titleMark:null, ss:null, ls:null, keep:0, st:null,
  test:!!window.PW_LIVE_TEST, fresh:{iv:new Set(), out:new Set(), sol:new Set(), group:new Set()},
  reload:()=>location.reload()};
const lvKey = k => "pw-map:"+location.pathname+":"+k;
function lvStore(kind){ try{ const s=window[kind], k=lvKey("probe"); s.setItem(k,"1"); s.removeItem(k); return s; }catch(_){ return null; } }
function lvGet(s, k){ try{ const v=s && s.getItem(lvKey(k)); return v ? JSON.parse(v) : null; }catch(_){ return null; } }
function lvSet(s, k, v){ try{ if(s){ if(v==null) s.removeItem(lvKey(k)); else s.setItem(lvKey(k), JSON.stringify(v)); } }catch(_){} }
const lvList = v => Array.isArray(v) ? v : [];
const lvTime = c => Date.parse(c && (c.ts || c.date)) || 0;
const lvNewest = log => Math.max(0, ...lvList(log).map(lvTime));
const lvFile = () => { try{ return decodeURIComponent(location.pathname.split("/").pop() || ""); }catch(_){ return ""; } };
const lvPanel = () => ["overview","solview","themeview","nextview"].map(id=>document.getElementById(id)).find(p=>!p.hidden) || null;
/* what is new: the people, measures of success, solutions and groups that merges added after the reader's baseline */
function lvFresh(log, base){
  const f={iv:new Set(), out:new Set(), sol:new Set(), group:new Set()};
  lvList(log).forEach(c=>{ if(!c || c.action!=="merge" || lvTime(c)<=base) return;
    lvList(c.added_interviews).forEach(x=>f.iv.add(String(x))); lvList(c.new_outcomes).forEach(x=>f.out.add(String(x)));
    lvList(c.new_solutions).forEach(x=>f.sol.add(String(x))); lvList(c.new_solution_groups).forEach(x=>f.group.add(String(x)));
    lvList(c.added_interactions).forEach(x=>{ if(x && x.interview!=null) f.iv.add(String(x.interview)); }); }); // talked to again
  return f;
}
const newTag = (kind, id) => LV.fresh[kind].has(String(id)) ? `<span class="lv-new" title="${esc(t("map.live.new_tip"))}">${th("map.live.new")}</span>` : "";
/* on the map: true for a new box, or how many new measures of success a closed step holds */
function nodeNew(n){
  if(n.type==="out") return LV.fresh.out.has(String(n.ref.oid));
  if(n.type==="sol") return LV.fresh.sol.has(String(n.ref.sol.id));
  if(n.type==="step" && !expanded.has(n.id)) return n.ref.outs.filter(o=>LV.fresh.out.has(String(o.oid))).length;
  return false;
}
function lvAgo(at){
  const d=Date.parse(at); if(isNaN(d)) return "";
  const m=Math.floor((Date.now()-d)/60000);
  if(m<1) return t("map.live.now");
  if(m<60) return t("map.live.min", {n:m});
  const h=Math.floor(m/60); if(h<24) return t("map.live.hour", {n:h});
  const days=Math.floor(h/24); if(days<7) return t("map.live.day", {n:days});
  return t("map.live.on", {date:new Date(d).toLocaleDateString(locale(), {month:"short", day:"numeric", year:"numeric"})});
}
const lvWhen = at => { const d=new Date(at); return isNaN(d) ? "" : d.toLocaleString(locale(), {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); };
/* what the assistant is doing; a run past twice its estimate plus 5 minutes has stopped, and the map stops saying so */
function lvWork(w){
  if(!w || typeof w!=="object") return null;
  const since=Date.parse(w.since), expect=(+w.expect_s||0)*1000;
  if(isNaN(since) || !(expect>0) || Date.now()>since+2*expect+300000) return null;
  return {phase:w.phase, n:+w.n||0, since, expect};
}
/* the title bar says the time left; what the assistant is doing goes in its tip and in the notice a click shows */
function lvWorkText(w){
  const left = Math.ceil((w.since+w.expect-Date.now())/60000);
  return t("map.live.busy", {left:left>0 ? t("map.live.left", {n:left}) : t("map.live.late")});
}
const lvDoing = w => w.phase==="summary" ? t("map.live.writing") : t("map.live.reading", {n:w.n});
const lvWorkTip = w => sentences(lvDoing(w), t("map.live.busy_tip"));
const lvWorkSay = w => sentences(lvWorkText(w)+t("map.text.full_stop"), lvWorkTip(w));
function lvStamp(){
  const el=document.getElementById("lvStamp");
  if(!M || !M.made || LV.user || !LV.own || /(^|\.)productweaver\.com$/.test(location.hostname)){
    el.hidden=true; document.getElementById("lvNote").hidden=true; el.setAttribute("aria-expanded", "false"); return; }
  const w = LV.state==="ok" ? lvWork(LV.workRaw) : null;
  let cls="lv-wait", text=lvAgo(M.made.at), tip=t("map.live.tip");
  if(LV.ready){ cls="lv-ready"; text=t("map.live.ready"); tip=t("map.live.ready_tip"); }
  else if(w){ cls="lv-busy"; text=lvWorkText(w); tip=lvWorkTip(w); }
  else if(LV.state==="dead"){ cls="lv-dead"; text=t("map.live.static", {when:lvWhen(M.made.at)}); tip=t("map.live.static_tip"); }
  else if(LV.state==="ok") cls="lv-ok";
  el.className = "lv-stamp "+cls+(el.classList.contains("lv-fresh") ? " lv-fresh" : "");
  const box=document.getElementById("lvNote");
  document.getElementById("lvStampText").textContent=text; el.title = box.hidden ? tip : ""; el.hidden=false;
  if(!box.hidden){ if(LV.asked && !LV.ready) lvFill(...lvCard()); lvPlace(); }
}
/* the card under the stamp: what changed (a green check), or what the stamp means (blue). It opens where the reader is
   looking: at the stamp they clicked, which then keeps it open until they close it, or at the stamp that has just
   flashed after an update, which closes it 8 seconds after the reader is back in this window. */
function lvSay(text){ const say=document.getElementById("lvSay"); say.textContent=""; setTimeout(()=>{ say.textContent=text; }, 400); }
function lvFill(text, more, update){
  const box=document.getElementById("lvNote"), m=document.getElementById("lvMore");
  document.getElementById("lvText").textContent=text; m.textContent=more||""; m.hidden=!more;
  box.classList.toggle("lv-info", !update);
  box.querySelector("use").setAttribute("href", update ? "#ap-check" : "#ap-info");
}
/* what a click on the stamp shows: its state in full, as [text, more, update] */
function lvCard(){
  const w = LV.state==="ok" ? lvWork(LV.workRaw) : null;
  if(w) return [sentences(lvWorkText(w)+t("map.text.full_stop"), lvDoing(w)), t("map.live.busy_tip"), false];
  if(LV.state==="dead") return [t("map.live.static_tip"), "", false];
  return [LV.from!==null ? lvChanges(LV.from) : t("map.live.notice_plain", {when:lvAgo(M.made.at)}), t("map.live.tip"), true];
}
function lvNotice(text, update, more, asked){
  const box=document.getElementById("lvNote"), st=document.getElementById("lvStamp");
  if(st.hidden) return;
  lvFill(text, more, update); LV.asked=!!asked; box.hidden=false;
  st.setAttribute("aria-expanded", "true"); st.title=""; lvPlace(); lvSay(sentences(text, more));
  clearTimeout(LV.noteTimer); if(!asked) lvNoteLater();
}
function lvNoteLater(){
  clearTimeout(LV.noteTimer);
  LV.noteTimer=setTimeout(()=>{ const box=document.getElementById("lvNote");
    // it stays while pointed at, and until the reader is back in this window (they may be reading the chat)
    if(box.matches(":hover") || box.contains(document.activeElement) || !document.hasFocus()) lvNoteLater(); else lvHide(); }, 8000);
}
function lvHide(){
  const box=document.getElementById("lvNote"), st=document.getElementById("lvStamp");
  clearTimeout(LV.noteTimer); LV.asked=false;
  if(box.hidden) return;
  const inside=box.contains(document.activeElement);
  box.hidden=true; st.setAttribute("aria-expanded", "false"); lvStamp();
  if(inside) st.focus({preventScroll:true});
}
/* under the stamp, its caret on the stamp's middle. It ends where the stamp ends, so it leaves the help buttons and
   the drawer's close button to its right in view, and it stays inside the window. In page coordinates, so on a narrow
   screen it scrolls with the title bar. */
function lvPlace(){
  const box=document.getElementById("lvNote"), st=document.getElementById("lvStamp");
  if(box.hidden || st.hidden) return;
  const r=st.getBoundingClientRect(), w=box.offsetWidth, vw=document.documentElement.clientWidth, mid=r.left+r.width/2;
  const left=Math.max(12, Math.min(vw-12-w, r.right-w));
  box.style.left=Math.round(left+window.scrollX)+"px"; box.style.top=Math.round(r.bottom+10+window.scrollY)+"px";
  box.style.setProperty("--lv-caret", Math.round(Math.max(18, Math.min(w-18, mid-left)))+"px");
}
function lvChanges(from, busy){
  const iv=new Set(), out=new Set(), sol=new Set(), grp=new Set(), ix=new Map(); let asked=0, decided=0, over=false, themes=false;
  lvList(M.changelog).forEach(c=>{ if(!c || lvTime(c)<=from) return;
    if(c.action==="merge"){ lvList(c.added_interviews).forEach(x=>iv.add(String(x))); lvList(c.new_outcomes).forEach(x=>out.add(String(x)));
      lvList(c.new_solutions).forEach(x=>sol.add(String(x))); lvList(c.new_solution_groups).forEach(x=>grp.add(String(x)));
      lvList(c.added_interactions).forEach(x=>{ if(x && x.interview!=null) ix.set(String(x.interview)+"#"+x.n, String(x.interview)); });
      asked+=lvList(c.proposals).length; }
    else if(c.action==="decide") decided++;
    else if(c.action==="rebuild"){ if(c.layer==="overview") over=true; if(c.layer==="value_themes") themes=true; } });
  // a later conversation counts apart, unless the person is new too: then the reader does not know them yet
  const again=[...ix.values()].filter(id=>!iv.has(id)).length, firstToo=ix.size-again;
  const parts=[];
  if(iv.size) parts.push(t("map.live.convs", {n:iv.size+firstToo}));
  if(again) parts.push(t("map.live.again", {n:again}));
  if(out.size) parts.push(t("map.count.new_outcomes", {n:out.size}));
  if(sol.size) parts.push(t("map.live.sols", {n:sol.size}));
  if(grp.size) parts.push(t("map.live.groups", {n:grp.size}));
  if(asked) parts.push(t("map.live.asked", {n:asked}));
  if(decided) parts.push(t("map.live.decided", {n:decided}));
  if(over) parts.push(t("map.live.overview"));
  if(themes) parts.push(t("map.live.themes"));
  if(busy) return parts.length ? t("map.live.so_far", {changes:joinList(parts)}) : "";
  const when=lvAgo(M.made.at);
  return parts.length ? t("map.live.notice", {when, changes:joinList(parts)}) : t("map.live.notice_plain", {when});
}
/* polling: only for a map opened from disk (or a local preview); never on productweaver.com or for a KB the reader opened */
function lvOn(){
  if(LV.user || LV.copy || !LV.own || LV.test) return false;
  const p=location.protocol, h=location.hostname;
  if(/(^|\.)productweaver\.com$/.test(h)) return false;
  if(p==="file:") return true;
  return /^https?:$/.test(p) ? /^(localhost|127\.0\.0\.1|\[::1\])$/.test(h) : !/^(blob|data|about|javascript):$/.test(p);
}
function lvProbe(){
  clearTimeout(LV.timer);
  if(!lvOn() || LV.busy) return;
  LV.busy=true;
  const s=document.createElement("script");
  s.src=".map-live/status.js?r="+(++LV.seq)+"-"+Date.now();
  const done=ok=>{ s.remove(); LV.busy=false;
    if(!ok && ++LV.errs>=2 && LV.state!=="dead"){ LV.state="dead"; LV.ready=null; lvStamp(); }
    lvNext(); };
  s.onload=()=>done(true); s.onerror=()=>done(false);
  document.head.appendChild(s);
}
function lvNext(){
  clearTimeout(LV.timer);
  if(!lvOn() || (LV.state==="dead" && !LV.everOk)) return; // a copy with no status: ask again when the tab comes back
  LV.timer=setTimeout(lvProbe, document.hidden || LV.state==="dead" ? 15000 : 3000);
}
window.pwMapStatus = s => {
  if(!s || typeof s!=="object" || LV.user || LV.copy || !LV.own) return;
  // the status speaks for discovery-map.html: a copy saved beside it (another name) does not follow it
  if(typeof s.file==="string" && s.file!==lvFile()){ LV.copy=true; LV.state="dead"; LV.ready=null; clearTimeout(LV.timer); lvStamp(); return; }
  const busy=!!lvWork(LV.workRaw);
  LV.state="ok"; LV.everOk=true; LV.errs=0; LV.workRaw=s.work||null;
  const build=typeof s.build==="string" ? s.build : "";
  if(build && build!==LV.own && !(Date.parse(s.at)<Date.parse(LV.at))) lvUpdate(build); // an older status is behind the map
  else LV.ready=null;
  const w=lvWork(LV.workRaw);
  if(w && !busy) lvSay(lvWorkSay(w));
  lvStamp();
};
/* a newer map: reload now, or wait while the reader is in the middle of something. Without sessionStorage the map
   cannot keep the reader's place nor count its tries, so it asks. After 3 tries for one build the file on disk is not
   that build (a sync or a git pull put another one there): it stops, as a button would only reload the same file. */
function lvBlocked(){
  const sel=window.getSelection ? getSelection() : null;
  return !modal.hidden || document.body.classList.contains("nx-print") || !!(drag||pinch||gesture)
    || !document.getElementById("drop").hidden || !!(sel && !sel.isCollapsed && String(sel).trim());
}
function lvUpdate(build){
  const now=Date.now(), rec=lvGet(LV.ss, "try"), r = rec && rec.build===build ? rec : {build, n:0, last:0};
  if(LV.ss && r.n>=3){ LV.ready=null; return; }
  if(!LV.ss || now-r.last<20000 || (!document.hidden && lvBlocked())){ LV.ready=build; return; }
  r.n++; r.last=now; lvSet(LV.ss, "try", r);
  lvGo();
}
function lvGo(){ lvSave(); LV.reload(); }
function lvSave(){
  const panel=lvPanel(), tab=document.querySelector(".tab[aria-selected='true']"), seen=lvGet(LV.ls, "seen");
  // badges start from what the reader has seen: what this page showed, if they looked at it
  lvSet(LV.ss, "base", seen && seen.ts>=LV.newest ? LV.newest : LV.base);
  lvSet(LV.ss, "state", {at:Date.now(), from:LV.newest, job:M.job, x:view.x, y:view.y, k:view.k, exp:[...expanded],
    sols:showSols, person:personHL, q:document.getElementById("q").value, sol:solHL, tab:tab ? tab.dataset.tab : "",
    next:nextOpen, open:LV.open, work:LV.state==="ok" ? LV.workRaw : null, focus:(document.activeElement && document.activeElement.id) || "",
    scroll:{panel:panel ? panel.scrollTop : 0, people:document.getElementById("pane-people").scrollTop,
      progress:document.getElementById("pane-progress").scrollTop, drawer:document.getElementById("dBody").scrollTop, page:window.scrollY}});
}
function lvRestore(st){
  if(st.job && st.job!==M.job && M.jobById[st.job]) setJob(st.job, true);
  (Array.isArray(st.exp) ? st.exp : []).forEach(id=>{ if(M.steps.some(s=>s.id===id)) expanded.add(id); });
  if(st.sols && M.hasSols){ showSols=true; syncSolControls(); }
  if(st.person && M.ivById[st.person]){ personHL=st.person;
    document.querySelectorAll(".person").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.iv===personHL))); }
  const q=String(st.q||""); if(q.trim()){ document.getElementById("q").value=q; const v=q.trim().toLowerCase(); searchHL=v.length>=2 ? v : null; }
  if(st.sol && st.sol.id && (st.sol.kind==="group" ? M.groupById : M.solById)[st.sol.id]) solHL={kind:st.sol.kind, id:st.sol.id};
  updatePill(); render();
  if(solMode) renderSolView();
  if(st.tab) showTab(st.tab);
  if(overMode && typeof st.next==="boolean") setNextOpen(st.next);
  const o=st.open;
  if(o && o.k==="node"){ const n=flat.find(f=>f.id===o.id); if(n) openDetails(n); }
  else if(o && o.k==="person") openPerson(o.id);
  else if(o && o.k==="sol") openSolution(o.id);
  else if(o && o.k==="group") openGroup(o.id);
  // all at once, before the first paint: the automatic fits skip their turn (LV.keep), so nothing jumps
  if(viewNow()==="map" && +st.k>0){ view.x=+st.x||0; view.y=+st.y||0; view.k=+st.k; applyView(); }
  const sc=st.scroll||{}, panel=lvPanel();
  if(panel) panel.scrollTop=+sc.panel||0;
  document.getElementById("pane-people").scrollTop=+sc.people||0;
  document.getElementById("pane-progress").scrollTop=+sc.progress||0;
  document.getElementById("dBody").scrollTop=+sc.drawer||0;
  if(+sc.page) window.scrollTo(0, +sc.page);
  const f=st.focus && document.getElementById(st.focus); if(f) f.focus({preventScroll:true});
}
/* the reader can see the page: show what changed, and after a moment count it as seen */
function lvShown(){
  if(document.hidden) return;
  if(LV.titleMark!==null){ document.title=LV.titleMark; LV.titleMark=null; }
  if(LV.pending){ LV.pending=false;
    const w = LV.state==="ok" ? lvWork(LV.workRaw) : null; // a reload in the middle of a batch: one message, not two
    if(w) lvNotice(lvChanges(LV.from, true) || lvWorkText(w)+t("map.text.full_stop"), false, lvDoing(w));
    else lvNotice(lvChanges(LV.from), true); }
  clearTimeout(LV.seenTimer);
  LV.seenTimer=setTimeout(()=>{ if(!document.hidden && LV.own && !LV.user) lvSet(LV.ls, "seen", {ts:LV.newest}); }, 1500);
}
function liveStop(){
  LV.user=true; LV.ready=null; LV.pending=false; LV.from=null; clearTimeout(LV.timer);
  LV.fresh={iv:new Set(), out:new Set(), sol:new Set(), group:new Set()};
  lvHide(); lvStamp();
}
function liveInit(){
  const g = SAMPLE && SAMPLE.generated && typeof SAMPLE.generated==="object" ? SAMPLE.generated : {};
  LV.own = typeof g.build==="string" ? g.build : ""; LV.at = typeof g.at==="string" ? g.at : "";
  LV.ss=lvStore("sessionStorage"); LV.ls=lvStore("localStorage");
  LV.newest=lvNewest(SAMPLE.changelog);
  const tried=lvGet(LV.ss, "try"); if(tried && tried.build===LV.own) lvSet(LV.ss, "try", null); // the reload worked
  const st=lvGet(LV.ss, "state"); lvSet(LV.ss, "state", null);
  if(st && LV.own && Date.now()-(+st.at||0)<120000){ LV.st=st; LV.keep=Date.now()+1500;
    if(lvWork(st.work)){ LV.workRaw=st.work; LV.state="ok"; } } // the stamp says "Updating" from the first paint
  const seen=lvGet(LV.ls, "seen"), base=lvGet(LV.ss, "base");
  LV.base = typeof base==="number" ? base : seen && typeof seen.ts==="number" ? seen.ts : LV.newest; // first visit: nothing is new
  lvSet(LV.ss, "base", LV.base);
  if(LV.own) LV.fresh=lvFresh(SAMPLE.changelog, LV.base);
}
function liveBoot(){
  const st=LV.st, again=!!st;
  if(again) lvRestore(st);
  const seen=lvGet(LV.ls, "seen");
  const from = again ? +st.from||0 : seen && typeof seen.ts==="number" && seen.ts<LV.newest ? seen.ts : null;
  if(from!==null && LV.own && M.made){ LV.from=from; LV.pending=true; } // the words are made when shown: "just now" ages
  const stamp=document.getElementById("lvStamp");
  if(again){ stamp.classList.add("lv-fresh"); setTimeout(()=>stamp.classList.remove("lv-fresh"), 2700); }
  if(LV.pending && document.hidden){ LV.titleMark=document.title; document.title="● "+document.title; }
  const note=document.getElementById("lvNote");
  stamp.addEventListener("click", ()=>{
    if(LV.ready){ lvGo(); return; }
    if(!note.hidden){ lvHide(); return; } // the stamp opens and closes its card
    const [text, more, update]=lvCard(); lvNotice(text, update, more, true);
  });
  document.getElementById("lvX").addEventListener("click", lvHide);
  // Escape and a click anywhere else close the card; Escape closes only the card, not the drawer under it
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !note.hidden && modal.hidden){ e.stopPropagation(); lvHide(); } }, true);
  document.addEventListener("pointerdown", e=>{ if(!note.hidden && !note.contains(e.target) && !stamp.contains(e.target)) lvHide(); }, true);
  addEventListener("resize", lvPlace);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ lvShown(); lvProbe(); } });
  addEventListener("focus", ()=>lvProbe());
  addEventListener("pageshow", e=>{ if(e.persisted) lvProbe(); });
  if(!LV.test){ setInterval(lvStamp, 30000); if(!lvOn()) LV.state="dead"; }
  lvStamp(); lvShown(); lvProbe();
}

/* A KB dropped onto the map brings its own language; a file that does not load leaves the map as it was. */
function load(raw, own){
  if(!raw || typeof raw!=="object") throw new Error(t("map.file.not_kb"));
  const was={...UI}, wasCache=labelCache;
  setLanguage(raw);
  try{ M=build(raw); }catch(err){ Object.assign(UI, was); labelCache=wasCache; applyLabels(); throw err; }
  if(own) liveStop();
  chooseJob(null); expanded=new Set(); selected=null; personHL=null; searchHL=null; solHL=null; showSols=false; closeDrawer();
  nextOpen=true; syncSolControls(); setView(M.hasOver?"over":"map", true); if(overMode) renderOverView();
  renderHeader(); renderJobs(); renderPeople(); renderProgress(); updatePill();
  render(); requestAnimationFrame(()=>{ if(Date.now()>LV.keep) fit(true); });
}
addEventListener("resize",()=>{ clearTimeout(window._rt); window._rt=setTimeout(()=>fit(true),150); });
addEventListener("hashchange",()=>viewFromHash(location.hash.slice(1)));
const START_VIEW = location.hash.slice(1);
try{ liveInit(); }catch(_){ LV.own=""; LV.fresh={iv:new Set(), out:new Set(), sol:new Set(), group:new Set()}; } // never breaks the map
load(SAMPLE);
viewFromHash(START_VIEW);
try{ liveBoot(); }catch(_){ LV.own=""; clearTimeout(LV.timer); lvStamp(); }</script>
