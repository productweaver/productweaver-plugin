<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Weaver</title>
<style>
/* Layout: header with a trust strip, then a three-pane workspace: a people and progress sidebar, a pan-and-zoom mind map, and a detail drawer. Ink-blue neutrals with a field-notes green for evidence and amber for "needs more conversations". */
:root{
  --bg:#f4f5f7;
  --surface:#ffffff;
  --ink:#1c2230;
  --muted:#5c6577;
  --line:#dde1e8;
  --accent:#2f5bd3;
  --accent-soft:#e7edfc;
  --ev1:#d6eedf; --ev2:#9fd3b4; --ev3:#4fa97a; --ev4:#1f7a4f;
  --amber:#a86400; --amber-soft:#fdf1dc;
  /* what people use today, by kind: kept apart from the green evidence ramp and from amber */
  --sol-product:#6a4bd4; --sol-tool:#1f8fc2; --sol-people:#a52f7c; --sol-own:#d44a2e;
  /* map boxes: a step is a bordered card, a measure of success a green-tinted box */
  --step-line:#a9b1c1; --out-fill:#f0f8f3; --out-line:#c6e4d2; --out-ink:#2b8558;
  --quote:#f7f8fa;
  --shadow:0 6px 24px rgba(20,30,60,.12);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-read:"Source Serif 4",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141b; --surface:#1a1f2a; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2b3242;
    --accent:#7da0ff; --accent-soft:#1f2a47;
    --ev1:#1d3a2b; --ev2:#2b6447; --ev3:#3f9a6c; --ev4:#78d3a3;
    --amber:#f0b45a; --amber-soft:#3a2c17; --quote:#151a23; --shadow:0 6px 24px rgba(0,0,0,.45);
    --sol-product:#7d5fe6; --sol-tool:#2fa0d4; --sol-people:#c04d98; --sol-own:#e85f3f;
    --step-line:#4f5a75; --out-fill:#15241b; --out-line:#26452f; --out-ink:#6cc596;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#1a1f2a; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2b3242;
  --accent:#7da0ff; --accent-soft:#1f2a47;
  --ev1:#1d3a2b; --ev2:#2b6447; --ev3:#3f9a6c; --ev4:#78d3a3;
  --amber:#f0b45a; --amber-soft:#3a2c17; --quote:#151a23; --shadow:0 6px 24px rgba(0,0,0,.45);
  --sol-product:#7d5fe6; --sol-tool:#2fa0d4; --sol-people:#c04d98; --sol-own:#e85f3f;
  --step-line:#4f5a75; --out-fill:#15241b; --out-line:#26452f; --out-ink:#6cc596;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{padding:14px 20px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line);background:var(--surface)}
.top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.titles{flex:1;min-width:260px;display:grid;gap:2px}
.kicker{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}
h1{margin:0;font-size:1.35rem;line-height:1.25;font-weight:700;text-wrap:balance}
h1 .goal{color:var(--accent)}
.sub{color:var(--muted);font-size:.86rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:.85rem;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}

.strip{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.chip{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:help}
.chip b{font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1}
.chip span{font-size:.8rem;color:var(--muted);line-height:1.2}
.flow{align-self:center;color:var(--muted);font-size:1.1rem}
.chip.check{border-color:transparent;background:var(--ev1)}
.chip.check span{color:var(--ink)}
button.chip{color:var(--ink);text-align:left;cursor:pointer}
button.chip:hover{border-color:var(--accent)}
button.chip:hover span{color:var(--accent)}
.jobs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.jobs[hidden]{display:none}
.jobs .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);margin-right:4px}
.jobbtn{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 14px 4px 5px;font-size:.86rem;text-align:left;max-width:360px}
.jobbtn:hover{border-color:var(--accent)}
.jobbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.jobbtn span{line-height:1.25}
.jobbtn small{display:block;color:var(--muted);font-size:.76rem;font-variant-numeric:tabular-nums}
.jl{display:inline-grid;place-items:center;flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:.74rem;font-weight:800}
.jl.also{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.jl.none{background:transparent;color:var(--muted);border:1px dashed var(--muted);font-weight:600}
.person .jobsline{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:.74rem;color:var(--muted)}

main{flex:1;display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0;position:relative}
@media (max-width:860px){main{grid-template-columns:1fr;grid-template-rows:auto 70vh}}
/* on phones the page scrolls: the sidebar gets its own height instead of being squeezed out by the 70vh map */
@media (max-width:860px){html,body{height:auto} main{flex:none} aside.side{height:60vh;border-right:0;border-bottom:1px solid var(--line)}}
/* the Solutions view takes the full width: the sidebar steps aside */
main.wide{grid-template-columns:minmax(0,1fr)}
main.wide aside.side{display:none}
@media (max-width:860px){main.wide{grid-template-rows:minmax(70vh,1fr)}}

aside.side{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:none;padding:10px 6px;font-size:.84rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.pane{overflow:auto;padding:12px;display:grid;gap:10px;align-content:start;min-height:0;flex:1}
.hint{font-size:.82rem;color:var(--muted)}
.person{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface);text-align:left;display:grid;gap:2px;color:var(--ink)}
.person:hover{border-color:var(--accent)}
.person[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.person .nm{font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;gap:8px}
.person .nm small{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.person .role{font-size:.8rem;color:var(--muted);line-height:1.35}
.gap{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;padding:8px 10px;background:var(--surface);text-align:left;color:var(--ink);font-size:.86rem;display:grid;gap:2px}
.gap:hover{border-color:var(--amber)}
.gap small{color:var(--muted)}
.sect{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin-top:6px}
.callout{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.86rem}
.callout b{color:var(--accent)}

.stage{position:relative;overflow:hidden;background:
  radial-gradient(circle, var(--line) 1px, transparent 1.2px) 0 0/22px 22px, var(--bg);min-height:0;touch-action:none}
.stage svg{width:100%;height:100%;display:block;cursor:grab;user-select:none;direction:ltr}
.stage svg.dragging{cursor:grabbing}
.toolbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none;z-index:6}
.toolbar > *{pointer-events:auto}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px;box-shadow:var(--shadow)}
.search input{border:0;background:transparent;color:var(--ink);width:210px;outline:none;font-size:.88rem}
.tgroup{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.tgroup button{border:0;background:none;color:var(--ink);padding:6px 11px;font-size:.82rem;font-weight:600;border-right:1px solid var(--line)}
.tgroup button:last-child{border-right:0}
.tgroup button:hover{background:var(--accent-soft);color:var(--accent)}
.tgroup button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.viewsw{display:flex;gap:2px;padding:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.viewsw button{border:0;background:none;color:var(--muted);padding:5px 12px;font-size:.82rem;font-weight:700;border-radius:8px}
.viewsw button:hover{color:var(--accent)}
.viewsw button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.stage.solmode .toolbar > :not(.viewsw){display:none}
.stage.solmode svg,.stage.solmode .legend,.stage.solmode .madewith{visibility:hidden}
.filterpill{background:var(--accent);color:#fff;border-radius:10px;padding:6px 12px;font-size:.82rem;font-weight:600;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.filterpill button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:0 6px}
.legend{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);font-size:.76rem;color:var(--muted);display:grid;gap:5px;max-width:330px}
.legend .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}

/* map nodes. Each kind has its own shape, so a reader can tell them apart before reading:
   a step is a bordered card with its number, a measure of success a green box with a target,
   a solution a pill with an icon for its kind. The green bar on the left always means how many people said it. */
.node{cursor:pointer}
.node rect.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.node.step rect.box{stroke:var(--step-line);stroke-width:1.5}
.node.out rect.box{fill:var(--out-fill);stroke:var(--out-line)}
.node.sol rect.box{fill:color-mix(in srgb,var(--k,var(--muted)) 9%,var(--surface));stroke:color-mix(in srgb,var(--k,var(--muted)) 45%,var(--surface))}
.mk-k-product{--k:var(--sol-product)} .mk-k-everyday_tool{--k:var(--sol-tool)} .mk-k-people{--k:var(--sol-people)} .mk-k-own_method{--k:var(--sol-own)}
.node .mk-num{font-size:12px;font-weight:700;fill:var(--accent)}
.node .mk-div{stroke:var(--line);stroke-width:1}
.node .mk-oico,.mk-cap.out use{color:var(--out-ink)}
.node .mk-disc{fill:var(--k,var(--muted))}
.node .mk-glyph{color:#fff}
.node.sol.gone .mk-disc{fill:var(--muted)}
.mk-cap text{font-family:var(--font);font-size:11.5px;font-weight:700;fill:var(--muted)}
.mk-cap.sol use{color:var(--muted)}
.node:hover rect.box{stroke:var(--accent)}
.node.sel rect.box{stroke:var(--accent);stroke-width:2.4}
.node.root rect.box{fill:var(--accent);stroke:var(--accent)}
.node.root text{fill:#fff}
.node.stage rect.box{fill:var(--accent-soft);stroke:transparent}
.node text{fill:var(--ink);font-family:var(--font)}
.node .t1{font-size:13.5px;font-weight:600}
.node .t2{font-size:11px;fill:var(--muted)}
.node.root .t2{fill:#dfe6ff}
.node.stage .t1{font-size:14px;font-weight:700;fill:var(--accent)}
.node.dim{opacity:.18}
.node.hit rect.box{stroke:var(--accent);stroke-width:2.4}
.edge{fill:none;stroke:var(--line);stroke-width:1.6}
.edge.mk-e-out{stroke:var(--ev2)}
.edge.dim{opacity:.2}
.tog circle{fill:var(--surface);stroke:var(--accent);stroke-width:1.4}
.tog text{fill:var(--accent);font-size:11px;font-weight:700}
.thinflag{fill:var(--amber)}
.node.sol .t1{font-size:13px}
.node.sol.gone rect.box{fill:var(--surface);stroke:var(--muted);stroke-dasharray:5 4}
.node.sol.gone:hover rect.box,.node.sol.gone.sel rect.box,.node.sol.gone.hit rect.box{stroke:var(--accent)}
.sw.dash{background:transparent;border:1.5px dashed var(--muted)}
.legend.wide{max-width:min(400px,calc(100% - 24px))}
/* the key at the top of the legend draws each kind of box the way the map does */
.mk-key{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mk-key > span{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;font-weight:600;color:var(--ink);white-space:nowrap}
.mk-key > .mk-kstep{background:var(--surface);border:1.5px solid var(--step-line);border-radius:5px;box-shadow:inset 4px 0 0 var(--ev3);padding-left:0}
.mk-kstep b{color:var(--accent);font-size:.72rem;line-height:14px;padding:0 7px 0 11px;border-right:1px solid var(--line)}
.mk-key > .mk-kout{background:var(--out-fill);border:1px solid var(--out-line);border-radius:5px;box-shadow:inset 4px 0 0 var(--ev3);padding-left:11px}
.mk-key > .mk-ksol{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding-left:3px}
svg.mk-ic.mk-c-out{color:var(--out-ink)}
.mk-dot{width:17px;height:17px;border-radius:50%;background:var(--k,var(--muted));display:inline-grid;place-items:center;color:#fff;flex:none;vertical-align:-4px}
.legend .mk-dot{margin-right:4px}
/* icons in HTML: sized after the .stage svg rule, which would stretch them to full width */
svg.mk-ic{width:14px;height:14px;display:inline-block;flex:none;cursor:inherit;vertical-align:-2px}
.mk-dot svg.mk-ic{width:11px;height:11px;vertical-align:0}
.stage.solmode .drawer svg.mk-ic{visibility:visible}
.mk-numh{display:inline-block;border:1.5px solid var(--step-line);border-radius:4px;padding:0 5px;color:var(--accent);font-weight:800;letter-spacing:0;line-height:1.35}

/* Solutions view: a full-width table over the map, inside the stage */
/* --soltop is the toolbar's height, set from script; content fades out as it scrolls under the floating view switch */
.solview{position:absolute;inset:0;overflow:auto;z-index:5;background:var(--bg);padding:var(--soltop,64px) 20px 32px;
  -webkit-mask-image:linear-gradient(to bottom,transparent calc(var(--soltop,64px) - 14px),#000 calc(var(--soltop,64px) - 2px));
  mask-image:linear-gradient(to bottom,transparent calc(var(--soltop,64px) - 14px),#000 calc(var(--soltop,64px) - 2px))}
.stage.solmode{background:var(--bg)}
@media (min-width:861px){.stage.has-drawer .solview{padding-right:calc(min(420px,100%) + 20px)}}
.solin{max-width:1180px;display:grid;gap:12px}
.solin h2{margin:0;font-size:1.15rem;line-height:1.3;text-wrap:balance}
.solin h3{margin:14px 0 0;font-size:.95rem}
.twrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.soltable{width:100%;border-collapse:collapse;font-size:.86rem}
.soltable thead th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);text-align:left;padding:8px 12px;white-space:nowrap}
.soltable td,.soltable tbody th{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top;text-align:left;font-weight:400}
.soltable tr[data-row]{cursor:pointer}
.soltable tr[data-row]:hover{background:var(--bg)}
.soltable tr.on{background:var(--accent-soft)}
.soltable tr.ghead th{padding:0}
.gbtn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;width:100%;border:0;background:var(--quote);color:var(--ink);text-align:left;padding:10px 12px;font-size:.84rem}
.gbtn .gname{font-weight:700;font-size:.92rem}
.gbtn .gnum{grid-column:2;grid-row:1;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.gbtn .gwhy{grid-column:1 / -1;color:var(--muted)}
.gbtn:hover .gname,.gbtn[aria-pressed="true"] .gname{color:var(--accent)}
.gbtn[aria-pressed="true"]{background:var(--accent-soft)}
.solname{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-align:left;font-size:.9rem}
.solname:hover{text-decoration:underline}
.sline{display:block}
.sline + .sline{margin-top:3px}
.mcell{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.mbar{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ev3)}
.why{font-family:var(--font-read);font-size:.92rem}
.why small{display:block;font-family:var(--font);color:var(--muted);font-size:.74rem;margin-top:2px}
.ktag{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;color:var(--ink)}
.ktag i{width:8px;height:8px;border-radius:2px;flex:none}
.oitem .meta{display:flex;gap:8px;align-items:center;flex:none;color:var(--muted);font-size:.78rem;white-space:nowrap}
.linkbtn{border:0;background:none;padding:0;color:inherit;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.linkbtn:hover{color:var(--accent)}
/* Value themes view: one card per theme, in the same kind of overlay as the Solutions view */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:14px;align-items:start}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:12px;min-width:0}
.solin .tcard h3{margin:0;font-size:1.08rem;line-height:1.3;text-wrap:balance}
.tneed{margin:3px 0 0;font-family:var(--font-read);font-size:1rem;line-height:1.4}
.tsig{display:grid;gap:5px;font-size:.84rem}
.tsig small{color:var(--muted);font-size:.74rem}
.twhy{margin:0;font-size:.86rem;color:var(--muted)}
.tcard .sect{margin-top:0}
.tcard .oitem{width:100%;flex-wrap:wrap}
.tcard .oitem > span:first-child{flex:1 1 10em;min-width:0}
.oitem small{display:block;color:var(--muted);font-size:.74rem;margin-top:2px}
.hlk{display:grid;gap:6px}
.hlk + .hlk{margin-top:8px}
.hlk .tag{justify-self:start;font-weight:700}
@media (max-width:860px){
  .solview{padding-left:12px;padding-right:12px}
  .soltable thead{display:none}
  .soltable,.soltable tbody,.soltable tr,.soltable td,.soltable tbody th{display:block}
  .soltable tr[data-row]{padding:10px 12px;border-top:1px solid var(--line)}
  .soltable tr[data-row] > *{border:0;padding:2px 0}
  .soltable td{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px}
  .soltable td::before{content:attr(data-l);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted);padding-top:2px}
  .soltable tr.ghead th{border-top:1px solid var(--line)}
}

/* Overview view: the study as a short story, for someone new to the method. One sheet, a rail that shows how the
   findings build on each other, a small question and a large answer per step. Four type sizes. Sans is our words;
   serif is the customers' words only. */
.ov-page{max-width:1010px;margin:0 auto;display:grid;grid-template-columns:190px minmax(0,1fr);gap:0 34px;align-items:start}
.ov-rail{position:sticky;top:var(--soltop,64px);padding-top:30px;font-size:.84rem}
.ov-rail p{margin:0 0 12px;color:var(--muted)}
.ov-rail ol{list-style:none;margin:0;padding:0;display:grid}
.ov-rail li{position:relative;padding-bottom:16px}
.ov-rail li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.ov-rail li:last-child{padding-bottom:0}
.ov-rail li:last-child::before{display:none}
.ov-rail li button{border:0;background:none;padding:0;width:100%;text-align:left;display:grid;grid-template-columns:24px 1fr;gap:10px;color:var(--muted);align-items:start}
.ov-rail li b{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:.72rem;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.ov-rail li span{display:grid;line-height:1.3;padding-top:3px;font-weight:700}
.ov-rail li small{font-weight:400;font-size:.76rem}
.ov-rail li button:hover,.ov-rail li button.on{color:var(--ink)}
.ov-rail li button.on b{border-color:var(--ev3);background:var(--ev3);color:#fff}
.ov-railnext{margin-top:18px;border:1px solid var(--accent);background:none;color:var(--accent);font-weight:700;font-size:.84rem;border-radius:8px;padding:6px 10px;width:100%;text-align:left}
.ov-railnext:hover{background:var(--accent-soft)}

.ov-sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.ov-blk{padding:30px 38px}
.ov-blk + .ov-blk{border-top:1px solid var(--line)}
.ov-sheet p,.ov-sheet h2,.ov-sheet h3{margin:0}
.ov-note{font-size:.84rem;color:var(--muted);max-width:66ch}
.ov-body{font-size:1rem;line-height:1.55;max-width:64ch}
.ov-lk{border:0;background:none;padding:0;color:var(--accent);font-size:.84rem;font-weight:700;text-align:left}
.ov-lk:hover{text-decoration:underline;text-underline-offset:3px}
.ov-todo{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:.9rem;color:var(--muted);max-width:66ch}
.ov-todo b{color:var(--ink)}
.ov-sheet blockquote{font-size:1rem;line-height:1.5;padding:10px 14px;max-width:66ch}

.ov-lead{display:grid;gap:18px}
.ov-lead .ov-bl{font-size:1.9rem;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance;max-width:26em}
.ov-sure{display:grid;gap:8px;max-width:66ch}
.ov-gauge{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:.78rem;color:var(--muted)}
.ov-gauge li{border-top:5px solid var(--line);padding-top:5px;line-height:1.25}
.ov-gauge li.done{border-top-color:var(--ev3)}
.ov-gauge li.now{border-top-color:var(--ev3);color:var(--ink);font-weight:700}
/* who the study is about: the first block, so every sentence below has a subject; the rail repeats it */
.ov-who{display:grid;gap:16px}
.ov-whohead{display:grid;grid-template-columns:72px minmax(0,1fr);gap:18px;align-items:center}
.ov-avatar{width:72px;height:72px;border-radius:50%;background:var(--ev1);color:var(--ev4);display:grid;place-items:center;flex:none}
.ov-avatar svg.ov-ric{width:38px;height:38px;display:block;cursor:inherit}
.stage.solmode .ov-avatar svg.ov-ric{visibility:visible}
.ov-whotext{display:grid;gap:6px;min-width:0}
.ov-whoname{font-size:1.5rem;line-height:1.2;font-weight:700;letter-spacing:-.005em;text-wrap:balance}
.ov-whotext .ov-body{max-width:60ch}
.ov-whotext .ov-body span{color:var(--muted)}
.ov-whofoot{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.ov-faces{display:flex;align-items:center;padding-left:6px}
.ov-faces button{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);background:var(--ev1);color:var(--ink);font-size:.74rem;font-weight:700;margin-left:-6px;padding:0;display:grid;place-items:center;position:relative}
.ov-faces button:hover,.ov-faces button:focus-visible{background:var(--ev2);z-index:1}
.ov-faces span{margin-left:6px;font-size:.78rem;color:var(--muted)}
.ov-railwho{border:0;border-bottom:1px solid var(--line);background:none;padding:0 0 14px;margin:0 0 14px;width:100%;text-align:left;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;color:var(--ink)}
.ov-railwho .ov-avatar{width:40px;height:40px}
.ov-railwho .ov-avatar svg.ov-ric{width:22px;height:22px}
.ov-railwho > span:last-child{display:grid;line-height:1.25;font-size:.9rem}
.ov-railwho small{font-size:.76rem;color:var(--muted)}
.ov-railwho b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ov-railwho:hover b{color:var(--accent)}

.ov-blk.ov-next{padding:0}
.ov-nexttog{border:0;background:none;color:var(--ink);text-align:left;width:100%;padding:20px 38px;display:flex;gap:12px 24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ov-ntitle{display:grid;gap:6px;min-width:0}
.ov-ntitle > b{font-size:1.15rem;line-height:1.25}
.ov-nsum{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.ov-nsum > span{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.ov-pill{font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;color:var(--ink)}
.ov-pill.go{background:var(--ev1)} .ov-pill.try{background:var(--accent-soft);color:var(--accent)} .ov-pill.wait{background:var(--amber-soft)}
.ov-ncta{display:inline-flex;gap:8px;align-items:center;background:var(--accent);color:var(--surface);font-weight:700;font-size:.95rem;border-radius:10px;padding:10px 16px;white-space:nowrap}
.ov-nexttog:hover .ov-ncta{filter:brightness(1.08)}
.stage.solmode .ov-ncta svg{visibility:visible;cursor:inherit}
.ov-ncta svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.ov-nexttog[aria-expanded="true"] .ov-ncta{background:var(--accent-soft);color:var(--accent)}
.ov-nexttog[aria-expanded="true"] .ov-nsum{display:none}
.ov-nexttog[aria-expanded="true"] .ov-ncta svg{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){ .ov-ncta svg{transition:none} }
.ov-nextbody{padding:4px 38px 28px;display:grid;gap:16px}
.ov-tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.ov-track{display:grid;gap:10px;align-content:start;padding:0 20px;border-left:1px solid var(--line)}
.ov-track:first-child{padding-left:0;border-left:0}
.ov-track:last-child{padding-right:0}
.ov-tname{font-size:.84rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ov-track h3{font-size:1.05rem;line-height:1.3}
.ov-track dl{margin:0;display:grid;gap:8px;font-size:.9rem}
.ov-track dt{font-size:.78rem;color:var(--muted)}
.ov-track dd{margin:0}
.ov-track q{font-family:var(--font-read);quotes:var(--pw-quotes,"“" "”")}
.ov-next > .ov-todo{margin:0 38px 24px}

.ov-step{display:grid;gap:16px;scroll-margin-top:var(--soltop,64px)}
.ov-ask{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--muted);font-weight:700}
.ov-ask b{width:24px;height:24px;border-radius:50%;background:var(--ev3);color:#fff;display:grid;place-items:center;font-size:.74rem;font-variant-numeric:tabular-nums;flex:none}
.ov-ans{font-size:1.5rem;line-height:1.25;font-weight:700;letter-spacing:-.005em;text-wrap:balance;max-width:28em}
.ov-step .ov-ask + .ov-ans{margin-top:-8px}
.ov-foot{display:flex;gap:6px 20px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}

.ov-people{display:flex;gap:6px;flex-wrap:wrap}
.ov-person{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 12px 3px 4px;font-size:.84rem;display:flex;gap:7px;align-items:center}
.ov-person:hover{border-color:var(--accent)}
.ov-person i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--ev1);display:grid;place-items:center;font-size:.7rem;font-weight:700;flex:none}
.ov-person small{color:var(--muted);font-size:.78rem}

.ov-parts{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.ov-part{display:grid;gap:5px;font-size:.8rem;min-width:0}
.ov-part i{height:10px;border-radius:3px;background:var(--line)}
.ov-part.c3 i{background:var(--ev4)} .ov-part.c2 i{background:var(--ev3)} .ov-part.c1 i{background:var(--ev2)} .ov-part.c0 i{background:var(--amber);opacity:.55}
.ov-part b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-part span{color:var(--muted);font-size:.76rem}
.ov-part.c0 span{color:var(--amber)}

.ov-tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.ov-tbl th,.ov-tbl td{text-align:left;padding:10px 14px 10px 0;border-top:1px solid var(--line);vertical-align:top}
.ov-tbl thead th{border-top:0;font-size:.78rem;font-weight:400;color:var(--muted);padding-top:0;padding-bottom:6px}
.ov-tbl tbody th{font-weight:700}
.ov-tbl tbody th .ov-lk{font-size:inherit;color:var(--ink)}
.ov-tbl tbody th .ov-lk:hover{color:var(--accent)}
.ov-tbl td:last-child,.ov-tbl th:last-child{padding-right:0}
.ov-tbl .sm{color:var(--muted);font-size:.84rem}
.ov-tbl .num{white-space:nowrap;font-variant-numeric:tabular-nums}
.ov-heard{display:flex;gap:8px;align-items:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.ov-heard i{display:block;width:72px;height:8px;border-radius:4px;background:var(--bg);border:1px solid var(--line);overflow:hidden;flex:none}
.ov-heard i::before{content:"";display:block;height:100%;width:var(--w);background:var(--ev3)}

.ov-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;font-size:.78rem;color:var(--muted);padding-bottom:6px}
.ov-fall{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 28px;padding:16px 0;border-top:1px solid var(--line);align-items:start}
.ov-fall:last-child{padding-bottom:0}
.ov-fall h3{font-size:1.05rem;line-height:1.3;margin-bottom:4px}
.ov-fall p{font-size:.92rem}
.ov-fall .ov-with{font-size:.8rem;color:var(--muted);margin-top:6px}

.ov-theme{border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left;padding:14px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 24px;align-items:center;width:100%}
.ov-theme:hover .tl{color:var(--accent)}
.ov-theme .tl{font-size:1.05rem;font-weight:700;line-height:1.3}
.ov-theme .tn{font-family:var(--font-read);font-size:1rem;line-height:1.45;grid-column:1;max-width:60ch}
.ov-theme .ov-heard{grid-column:2;grid-row:1 / span 2}
.ov-theme.first{border-top:2px solid var(--ev3)}
.ov-theme.first .tl::after{content:attr(data-first);margin-left:10px;font-size:.74rem;font-weight:700;background:var(--ev1);border-radius:999px;padding:2px 9px;vertical-align:2px;white-space:nowrap}

.ov-end{border:0;border-top:1px solid var(--line);background:none;color:var(--ink);width:100%;padding:22px 38px;display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;font-size:1rem;border-radius:0 0 14px 14px;text-align:left}
.ov-end b{color:var(--accent)}
.ov-made{grid-column:2;margin:14px 0 32px;font-size:.78rem;color:var(--muted);text-align:center}
.ov-made a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.ov-made a:hover{color:var(--accent)}
.ov-end:hover{background:var(--accent-soft)}

@media (max-width:860px){
  .ov-page{grid-template-columns:minmax(0,1fr)}
  .ov-rail{display:none}
  .ov-blk{padding:22px 18px}
  .ov-lead .ov-bl{font-size:1.5rem}
  .ov-whohead{grid-template-columns:56px minmax(0,1fr);gap:14px}
  .ov-who .ov-avatar{width:56px;height:56px} .ov-who .ov-avatar svg.ov-ric{width:30px;height:30px}
  .ov-whoname{font-size:1.3rem}
  .ov-ans{font-size:1.3rem}
  .ov-nexttog{padding:18px} .ov-ncta{width:100%;justify-content:center} .ov-nextbody{padding:0 18px 22px} .ov-next > .ov-todo{margin:0 18px 18px}
  .ov-tracks{grid-template-columns:minmax(0,1fr)}
  .ov-track{padding:16px 0 0;border-left:0;border-top:1px solid var(--line);margin-top:16px}
  .ov-track:first-child{border-top:0;padding-top:0;margin-top:0}
  .ov-gauge{font-size:.72rem}
  .ov-parts{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 3px}
  .ov-fall{grid-template-columns:minmax(0,1fr)}
  .ov-cols{display:none}
  .ov-tbl thead{display:none}
  .ov-tbl tr{display:grid;padding:10px 0;border-top:1px solid var(--line);gap:3px}
  .ov-tbl tbody tr:first-child{border-top:0;padding-top:0}
  .ov-tbl th,.ov-tbl td{border:0;padding:0}
  .ov-theme{grid-template-columns:minmax(0,1fr)}
  .ov-theme .ov-heard{grid-column:1;grid-row:auto}
  .ov-end{padding:18px}
  .ov-made{grid-column:1}
}

.tip{position:fixed;z-index:30;pointer-events:none;max-width:320px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:9px 11px;font-size:.82rem;line-height:1.4}
.tip .tk{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.tip .tt{font-weight:700;margin:2px 0 4px}
.tip .tm{color:var(--muted)}
.tip .tc{margin-top:5px;font-size:.76rem;color:var(--accent);font-weight:600}

/* drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:20;transform:translateX(100%);transition:transform .22s ease}
.drawer.open{transform:none}
.stage.has-drawer .toolbar{right:calc(min(420px,100%) + 12px)}
@media (prefers-reduced-motion: reduce){.drawer{transition:none}}
.dhead{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px;position:relative}
.dclose{position:absolute;top:10px;right:10px;border:0;background:var(--bg);color:var(--ink);border-radius:8px;width:30px;height:30px;font-size:1.1rem;line-height:1}
.dkind{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px}
.dtitle{font-size:1.15rem;font-weight:700;line-height:1.3;padding-right:34px;text-wrap:balance}
.dbody{overflow:auto;padding:14px 18px 24px;display:grid;gap:14px;align-content:start}
.explain{font-size:.88rem;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}
.formal{font-size:.82rem;color:var(--muted)}
.formal b{color:var(--ink);font-weight:600}
.meter{display:flex;gap:10px;align-items:center;font-size:.86rem}
.meter .bar{flex:1;height:8px;border-radius:4px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.meter .bar i{display:block;height:100%;background:var(--ev3)}
.flag{background:var(--amber-soft);color:var(--ink);border-left:4px solid var(--amber);border-radius:0 8px 8px 0;padding:8px 10px;font-size:.85rem}
.qgroup{display:grid;gap:6px}
.qwho{display:grid;gap:0;font-size:.82rem;font-weight:700}
.qwho button{border:0;background:none;color:var(--accent);font-weight:700;padding:0;font-size:.82rem;text-align:left}
.qwho small{font-weight:600;color:var(--muted)}
blockquote{margin:0;background:var(--quote);border-left:3px solid var(--ev3);border-radius:0 8px 8px 0;padding:8px 11px;font-family:var(--font-read);font-size:.95rem;line-height:1.45}
blockquote.para{border-left-color:var(--amber)}
.src{display:block;font-family:var(--font);font-size:.7rem;color:var(--muted);margin-top:4px;font-weight:600}
.olist{display:grid;gap:6px}
.oitem{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);color:var(--ink);text-align:left;display:flex;gap:10px;justify-content:space-between;align-items:center;font-size:.86rem}
.oitem:hover{border-color:var(--accent)}
.dots{display:inline-flex;gap:2px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ev3)}
.feel{display:grid;gap:4px;font-size:.88rem}
.feel div{background:var(--bg);border-radius:8px;padding:6px 9px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:.74rem;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted)}
button.tag{background:none;font-size:.74rem}
button.tag:hover{border-color:var(--accent);color:var(--accent)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,30,.45);display:grid;place-items:center;z-index:40;padding:16px}
.mbox{background:var(--surface);border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px;box-shadow:var(--shadow);display:grid;gap:12px;position:relative}
.mbox h2{margin:0;font-size:1.25rem}
.mbox ol,.mbox ul{margin:0;padding-left:20px;display:grid;gap:8px}
.gloss{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.88rem}
.gloss dt{font-weight:700}
.gloss dd{margin:0;color:var(--muted)}
.drop{position:fixed;inset:0;background:rgba(47,91,211,.15);border:3px dashed var(--accent);z-index:50;display:grid;place-items:center;font-size:1.3rem;font-weight:700;color:var(--accent);pointer-events:none}
.brand{display:inline-flex;align-items:center;gap:5px;color:var(--accent);text-decoration:none;font-weight:800;letter-spacing:.06em}
.brand:hover{text-decoration:underline}
.pwmark{width:16px;height:16px;flex:none}
.pwmark path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.madewith{position:absolute;right:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.76rem;color:var(--muted);text-decoration:none;box-shadow:var(--shadow)}
.madewith b{color:var(--accent)}
.madewith:hover{border-color:var(--accent);color:var(--ink)}
.cta{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:.9rem}
.cta a{color:var(--accent);font-weight:700}
.err{background:var(--amber-soft);border-left:4px solid var(--amber);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.88rem}
</style>
</head>

<script>
/* @kb-schema:2 */ /* draws KBs of schema 2, with one or more core jobs, and still reads schema 1 files */
/* @kb-data:start */
const SAMPLE = {"meta":{"project":"Open a KB file to begin"}};
/* @kb-data:end */

/* ---------- labels ---------- */
/* Every word the map shows comes from a label: English from labels-en.js, or the study's own text, which kb_tool map
   puts in the data as `labels` for a study in another language (meta.language). A label the study lacks, or holds in
   a form that does not fit, shows in English; a key with no English text shows as itself. Keys are always written out
   in full, never built, so a test can find every key in use. A label holds no markup: th() escapes it, then puts in
   the values as they are given, so the caller escapes them. */
if(typeof PW_LABELS_EN!=="object" || !PW_LABELS_EN || typeof PW_LABELS_EN.labels!=="object"){
  document.body.innerHTML = '<div class="err" style="margin:24px">This map cannot show its text: labels-en.js is missing. Keep it next to discovery-map-template.html, as the skill ships them, or open the map that kb_tool made.</div>';
  throw new Error("labels-en.js is missing");
}
const EN = PW_LABELS_EN.labels, BRAND = "Product Weaver", SITE = "productweaver.com";
const RTL = ["ar","he","fa","ur","ps","sd","ug","yi","dv","ckb"];
const PLURALS = ["zero","one","two","few","many","other"];
const UI = {lang:"en", dir:"ltr", en:true, own:{}};
const hasKey = (o,k) => !!o && Object.prototype.hasOwnProperty.call(o,k);
const PLACE = /\{([a-z_]+)\}/g;
const places = s => [...s.matchAll(PLACE)].map(m=>m[1]).sort().join();
// the study's text fits when it is text with the same {name} places as the English, one text per plural form
const fitsText = (v, en) => typeof v==="string" && (v.trim()!=="" || !/\w/.test(en)) && places(v)===places(en);
function fits(own, en){
  if(own==null || en==null) return false;
  if(typeof en==="string") return fitsText(own, en);
  return typeof own==="object" && !Array.isArray(own) && hasKey(own,"other")
    && Object.entries(own).every(([f,v])=>PLURALS.includes(f) && fitsText(v, String(en.other)));
}
let labelCache = new Map();
const pluralRules = new Map();
function labelOf(key){
  let p = labelCache.get(key);
  if(!p){ const en = hasKey(EN,key) ? EN[key] : null, own = hasKey(UI.own,key) ? UI.own[key] : null;
    p = fits(own, en) ? {v:own, lang:UI.lang} : en!=null ? {v:en, lang:"en"} : {v:key, lang:"en"}; labelCache.set(key,p); }
  return p;
}
// a plural label has one text per plural form of its language; English text follows English rules
function pluralForm(p, n){
  if(typeof p.v==="string") return p.v;
  let rules = pluralRules.get(p.lang);
  if(!rules){ try{ rules = new Intl.PluralRules(p.lang); }catch(_){ rules = new Intl.PluralRules("en"); } pluralRules.set(p.lang, rules); }
  const f = typeof n==="number" ? rules.select(n) : "other";
  return String(typeof p.v[f]==="string" ? p.v[f] : p.v.other ?? "");
}
const fillIn = (s, vars) => s.replace(PLACE, (m,k) => hasKey(vars,k) ? String(vars[k]) : m);
/* t: plain text, for textContent and attributes. th: HTML, with \n as a line break and the values put in as given. */
const t = (key, vars) => fillIn(pluralForm(labelOf(key), vars && vars.n), vars);
const th = (key, vars) => fillIn(esc(pluralForm(labelOf(key), vars && vars.n)).replace(/\n/g,"<br>"), vars);
// the words beside a big number: the label holds the number as {n}, the number is drawn apart
const chipWords = (key, n) => fillIn(esc(pluralForm(labelOf(key), n)).replace(/\n/g,"<br>"), {n:""}).trim();
const sentences = (...parts) => parts.filter(Boolean).join(t("map.text.sentence_sep"));
const joinList = items => items.join(t("map.text.list_sep"));
const quoted = q => t("map.text.quote", {q});
const locale = () => UI.lang==="en" ? undefined : UI.lang;
/* The study's language: meta.language, a BCP 47 code; English when it is missing. Right-to-left languages turn the
   page around, but the map's drawing keeps its left-to-right layout (CSS: .stage svg). */
function setLanguage(raw){
  const meta = raw && typeof raw==="object" && raw.meta && typeof raw.meta==="object" ? raw.meta : {};
  let lang = "en";
  try{ if(typeof meta.language==="string" && meta.language.trim()) lang = Intl.getCanonicalLocales(meta.language.trim().replace(/_/g,"-"))[0]; }catch(_){ lang = "en"; }
  const base = lang.split("-")[0].toLowerCase();
  UI.lang = lang; UI.en = base==="en"; UI.dir = RTL.includes(base) ? "rtl" : "ltr";
  UI.own = !UI.en && raw.labels && typeof raw.labels==="object" && !Array.isArray(raw.labels) ? raw.labels : {};
  labelCache = new Map();
  applyLabels();
}
function applyLabels(){
  const root = document.documentElement;
  root.lang = UI.lang;
  if(UI.dir==="rtl") root.dir = "rtl"; else root.removeAttribute("dir");
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-t-title]").forEach(el=>{ el.title = t(el.dataset.tTitle); });
  document.querySelectorAll("[data-t-aria]").forEach(el=>{ el.setAttribute("aria-label", t(el.dataset.tAria)); });
  document.querySelectorAll("[data-t-ph]").forEach(el=>{ el.placeholder = t(el.dataset.tPh); });
  document.getElementById("madeWith").innerHTML = th("map.made.badge", {brand:`<b>${BRAND}</b>`, site:SITE});
  // the quote marks of <q>, from the same label as every other quote
  const marks = t("map.text.quote").split("{q}");
  if(marks.length===2) root.style.setProperty("--pw-quotes", JSON.stringify(marks[0])+" "+JSON.stringify(marks[1]));
}

/* ---------- plain language ---------- */
const STAGES = [
  ["define","map.stage.define.name","map.stage.define.desc"],
  ["locate","map.stage.locate.name","map.stage.locate.desc"],
  ["prepare","map.stage.prepare.name","map.stage.prepare.desc"],
  ["confirm","map.stage.confirm.name","map.stage.confirm.desc"],
  ["execute","map.stage.execute.name","map.stage.execute.desc"],
  ["monitor","map.stage.monitor.name","map.stage.monitor.desc"],
  ["modify","map.stage.modify.name","map.stage.modify.desc"],
  ["conclude","map.stage.conclude.name","map.stage.conclude.desc"]
];
const SRC = {
  transcript:"map.src.transcript",
  quoted_in_notes:"map.src.quoted_in_notes",
  interviewer_notes:"map.src.interviewer_notes"
};
const srcLabel = s => hasKey(SRC,s) ? t(SRC[s]) : "";
/* what people use today to get a step done: [label key, color token] */
const KINDS = {
  product:["map.kind.product","--sol-product"],
  everyday_tool:["map.kind.everyday_tool","--sol-tool"],
  people:["map.kind.people","--sol-people"],
  own_method:["map.kind.own_method","--sol-own"]
};
const kindOf = k => KINDS[k] || ["map.kind.other","--muted"];
const kindLabel = k => t(kindOf(k)[0]);
/* English only: an outcome's formal start, said in plain words. Other languages show the statement as written. */
function plainOutcome(s){
  if(!UI.en) return s;
  const r = [
    [/^Minimize the time (it takes )?to /i,"Less time to "],
    [/^Minimize the likelihood (of|that) /i,(m,w)=>w.toLowerCase()==="that"?"Less risk that ":"Less risk of "],
    [/^Minimize the number of /i,"Fewer "],
    [/^Minimize the amount of /i,"Less "],
    [/^Minimize (the )?/i,"Less "],
    [/^(Maximize|Increase) (the )?/i,"More "],
    [/^Reduce (the )?/i,"Less "]
  ];
  for(const [re,rep] of r){ if(re.test(s)) return s.replace(re,rep); }
  return s;
}
const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
/* Links to productweaver.com carry fixed tags, so the site can count visits from maps opened on people's computers.
   The tags name only the link's place in the map, never anything from the study. On productweaver.com itself (the
   example study) the links stay untagged. */
const PW_SITE = "https://www.productweaver.com/";
const pwUrl = where => /(^|\.)productweaver\.com$/.test(location.hostname) ? PW_SITE
  : `${PW_SITE}?utm_source=productweaver-plugin&utm_medium=discovery-map&utm_campaign=pw-discovery&utm_content=${encodeURIComponent(where)}`;
document.querySelectorAll("a[data-pw]").forEach(a=>{ a.href=pwUrl(a.dataset.pw); });
const short = (s,n) => { s=String(s||""); if(s.length<=n) return s; const cut=s.slice(0,n-1); return cut.slice(0,Math.max(cut.lastIndexOf(" "),n-20)).replace(/[\s,;:.]+$/,"")+"…"; };
const ivName = id => M.ivById[id]?.name || t("map.common.person_fallback", {id});
const names = ids => joinList(ids.map(ivName)); // plain text: wrap in esc()
/* the same sentence from the same person counts once */
function uniqEv(list){ const seen=new Set(); return list.filter(e=>{ const k=e.interview+"\u0000"+(e.quote||""); if(seen.has(k)) return false; seen.add(k); return true; }); }
/* Solutions seen from one core job (or from all when job is null). Current users are people on a
   current use; people who stopped count only if they use it nowhere else in the same scope. */
function solScope(sols, groups, job){
  const uniq = a => [...new Set(a)];
  const items = sols.map(sol=>{
    const at = sol.at.filter(a=>!job || a.step.job===job); if(!at.length) return null;
    const cur = uniq(at.flatMap(a=>a.cur)), stop = uniq(at.flatMap(a=>a.stop)).filter(x=>!cur.includes(x));
    const curEv = uniqEv(at.flatMap(a=>a.curEv)), stopEv = uniqEv(at.flatMap(a=>a.stopEv));
    return {sol, at, cur, stop, curEv, stopEv, ment:curEv.length};
  }).filter(Boolean);
  const byUse = (a,b) => b.cur.length-a.cur.length || b.ment-a.ment || a.sol.name.localeCompare(b.sol.name);
  const gs = groups.map(g=>{
    const its = items.filter(x=>x.sol.group===g.id && x.cur.length).sort(byUse);
    return {g, items:its, ment:its.reduce((n,x)=>n+x.ment,0), people:uniq(its.flatMap(x=>x.cur))};
  }).filter(x=>x.items.length).sort((a,b)=>b.ment-a.ment || b.people.length-a.people.length);

/* One line per change of the KB. The summaries come from kb_tool, in English: the older ones are read for their numbers. */

/* ---------- pan and zoom ---------- */
const svg=document.getElementById("svg"), vp=document.getElementById("vp");

// keep part of the map on screen, so a fast scroll or a fling can never lose it
function keepInView(){
  if(!bounds) return; const r=svg.getBoundingClientRect(); if(!r.width||!r.height) return;
  const m=120, L=bounds.minX*view.k+view.x, R=bounds.maxX*view.k+view.x, T=bounds.minY*view.k+view.y, B=bounds.maxY*view.k+view.y;

  if(B<m) view.y+=m-B; else if(T>r.height-m) view.y-=T-(r.height-m);

function applyView(){ keepInView(); vp.setAttribute("transform",`translate(${view.x},${view.y}) scale(${view.k})`); }

/* Scroll moves the map; pinch, or Ctrl or ⌘ with the wheel, zooms. The zoom follows how far the fingers or the wheel

let drag=null, pinch=null, gesture=null; const touches=new Map();
function twoFingers(){ const [a,b]=[...touches.values()]; return {d:Math.hypot(a.x-b.x,a.y-b.y)||1, x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
svg.addEventListener("pointerdown",e=>{
  if(e.pointerType==="touch"){ touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    // a second finger turns the drag into a pinch, wherever the fingers land

  if(e.target.closest(".node")) return;
  drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false};
  try{ svg.setPointerCapture(e.pointerId); }catch(_){}
  svg.classList.add("dragging"); });

svg.addEventListener("pointercancel",e=>{ endPointer(e); drag=null; });
svg.addEventListener("wheel",e=>{
  e.preventDefault(); const r=svg.getBoundingClientRect();
  const unit=e.deltaMode===1?16:e.deltaMode===2?r.height:1; let dx=e.deltaX*unit, dy=e.deltaY*unit;

svg.addEventListener("gesturechange",e=>{ if(!gesture) return; e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(gesture.k*e.scale/view.k,e.clientX-r.left,e.clientY-r.top); });

document.getElementById("bOut").onclick=()=>{ const r=svg.getBoundingClientRect(); zoomAt(1/1.2,r.width/2,r.height/2); };

/* How sure: fewer than 3 conversations is a hunch; a clear pattern needs 8 or more, with the last 2 adding at most 2 new needs. */
function overSure(scope){
  const order=[...scope].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||a.id.localeCompare(b.id,undefined,{numeric:true}));
  const n=order.length, last=new Set(order.slice(-2).map(i=>i.id)), early=new Set(order.slice(0,-2).map(i=>i.id));
  const fresh=M.outs.filter(o=>o.people.some(p=>last.has(p)) && !o.people.some(p=>early.has(p))).length;
  const level = n<3 ? 1 : (n>=8 && fresh<=2) ? 3 : 2, added = fresh ? t("map.ov.sure.new_needs",{n:fresh}) : t("map.ov.sure.no_new");
  const text = level===1 ? t("map.ov.sure.text_guess",{n})

/* Key unmet needs: the needs most people raised, ahead where today's solutions at that step are weak

function overNeeds(){
  const uniq = a => [...new Set(a)];
  return M.outs.map(o=>{
    const st=M.steps.find(s=>s.key===o.step), at=st?st.sols:[], cur=at.filter(x=>x.cur.length), kinds=new Set(cur.map(x=>x.sol.kind));
    const stopped=uniq(at.flatMap(x=>x.stop)), product=cur.find(x=>x.sol.kind==="product"), hand=cur.length>0 && !product;
    const why=[];
    if(product) why.push(t("map.ov.needs.use", {name:product.sol.name}));
    else if(hand) why.push(kinds.has("own_method")||kinds.has("everyday_tool") ? t("map.ov.needs.by_hand") : t("map.ov.needs.ask_others"));
    else if(!stopped.length) why.push(t("map.ov.needs.nobody"));
    if(stopped.length) why.push(t("map.ov.needs.gave_up", {n:stopped.length}));
    return {o, why:sentences(...why), weak:(stopped.length?2:0)+(hand?1:0)};

    if(v==="people" || v==="next"){ setView("map"); showTab(v); } else setView(v); }
});

/* ---------- details drawer ---------- */
const drawer=document.getElementById("drawer");
function closeDrawer(){ drawer.classList.remove("open"); document.getElementById("stage").classList.remove("has-drawer"); selected=null; document.querySelectorAll(".node.sel").forEach(n=>n.classList.remove("sel")); }
document.getElementById("dClose").onclick=closeDrawer;
function setDrawer(kind,title,body,mark){ document.getElementById("dKind").innerHTML=(mark||"")+esc(kind); document.getElementById("dTitle").textContent=title; document.getElementById("dBody").innerHTML=body; drawer.classList.add("open"); document.getElementById("stage").classList.add("has-drawer");
  // links that point at the map leave the Solutions view first
  document.getElementById("dBody").querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{ setView(false, true); focusNode(b.dataset.go); }));
  document.getElementById("dBody").querySelectorAll("[data-person]").forEach(b=>b.addEventListener("click",()=>{ setView(false, true); jobFor(b.dataset.person); setPerson(b.dataset.person); openPerson(b.dataset.person); fitHits(); }));
  document.getElementById("dBody").querySelectorAll("[data-job]").forEach(b=>b.addEventListener("click",()=>setJob(b.dataset.job, true)));
  document.getElementById("dBody").querySelectorAll("[data-sol]").forEach(b=>b.addEventListener("click",()=>pickSol(b.dataset.sol)));
  document.getElementById("dBody").querySelectorAll("[data-group]").forEach(b=>b.addEventListener("click",()=>pickGroup(b.dataset.group)));
}
function meter(n, total){ const all=Math.max(1,total||M.ivs.length); return `<div class="meter"><span>${th("map.drawer.meter",{people:`<b>${th("map.count.people",{n})}</b>`, total:all})}</span><span class="bar"><i style="width:${Math.round(100*n/all)}%"></i></span></div>`; }
function quotesHTML(ev){
  if(!ev.length) return `<p class="hint">${th("map.drawer.no_quotes")}</p>`;
  const by={}; ev.forEach(e=>{ (by[e.interview]=by[e.interview]||[]).push(e); });
  return Object.entries(by).map(([id,es])=>{ const iv=M.ivById[id]; return `<div class="qgroup"><div class="qwho"><button type="button" data-person="${esc(id)}">${esc(iv?.name||t("map.common.person_fallback",{id}))}</button><small>${esc(iv?.who||"")}</small></div>`+
    es.map(e=>`<blockquote class="${e.source==="interviewer_notes"?"para":""}">${esc(quoted(e.quote))}<span class="src">${esc(srcLabel(e.source)||t("map.src.unknown"))}</span></blockquote>`).join("")+`</div>`; }).join("");
}
function dots(n){ let h=""; for(let i=0;i<5;i++) h+=`<i class="${i<Math.min(5,n)?"on":""}"></i>`; return `<span class="dots" aria-label="${esc(t("map.count.people",{n}))}">${h}</span>`; }
function openDetails(n){
  if(n.type==="root"){
    const job=M.jobById[M.job];
    const linked = job ? M.ivs.filter(i=>i.main===job.id || i.also.includes(job.id)) : M.ivs;
    setDrawer(many()?t("map.root.job",{id:M.job}):t("map.root.goal"),M.goal||t("map.root.not_set"),`
      <div class="explain">${th("map.drawer.root.explain")}</div>
      ${many()?`<div class="explain">${th("map.drawer.root.jobs",{n:M.jobs.length})}</div>`:""}
      ${M.executor?`<div><div class="sect">${th("map.drawer.root.who")}</div><p>${esc(M.executor)}</p></div>`:""}
      ${M.goalStatus==="proposed"?`<div class="flag">${th("map.drawer.root.proposed")}</div>`:""}
      <div><div class="sect">${th("map.drawer.root.goals")}</div><div class="feel">${linked.map(i=>`<div><b>${esc(i.name)}:</b> ${esc(i.goal)}${job&&i.main!==job.id?` <small>${th("map.drawer.root.also")}</small>`:""}</div>`).join("")||`<p class="hint">${th("map.drawer.root.none")}</p>`}</div></div>`);
    return;
  }
  if(n.type==="stage"){
    setDrawer(t("map.drawer.stage.kind"),n.name,`<div class="explain">${esc(n.desc)} ${th("map.drawer.stage.term",{term:`<b>${esc(n.key)}</b>`})}</div>
      <div class="olist">${n.kids.map(k=>`<button class="oitem" type="button" data-go="${k.id}"><span>${esc(k.ref.text)}</span>${dots(k.ref.allPeople.length)}</button>`).join("")}</div>`);
    return;
  }
  if(n.type==="step"){ const s=n.ref;
    setDrawer(t("map.node.step_kind"),s.text,`
      ${meter(s.allPeople.length)}
      ${s.allPeople.length<3?`<div class="flag">${th("map.drawer.step.thin",{n:s.allPeople.length})}</div>`:""}
      ${s.covers?`<div class="explain">${esc(s.covers)}</div>`:""}
      <div><div class="sect">${th("map.drawer.step.outs",{count:s.outs.length})}</div><div class="olist">${s.outs.slice().sort((a,b)=>b.people.length-a.people.length).map(o=>`<button class="oitem" type="button" data-go="${o.id}"><span>${esc(o.plain)}</span>${dots(o.people.length)}</button>`).join("")||`<p class="hint">${th("map.common.none_yet")}</p>`}</div></div>
      ${M.hasSols?stepSolsHTML(s):""}
      <div><div class="sect">${th("map.drawer.step.quotes")}</div>${quotesHTML(s.ev)}</div>`, mkStep(s.key));
    return;
  }
  if(n.type==="sol"){ openSolution(n.ref.sol.id); return; }
  const o=n.ref, step=M.allSteps.find(s=>s.key===o.step);
  setDrawer(t("map.node.out_kind"),o.plain,`
    ${meter(o.people.length)}
    <div class="explain">${th("map.drawer.out.explain",{step:`<b>${esc(step?.text||t("map.drawer.out.this_step"))}</b>`})}</div>
    <div class="formal"><b>${th("map.drawer.out.formal")}</b> ${esc(o.text)} <span style="opacity:.7">(#${esc(o.oid)})</span></div>
    ${o.people.length===1?`<div class="flag">${th("map.drawer.out.one")}</div>`:""}
    <div><div class="sect">${th("map.drawer.out.words",{quotes:th("map.count.quotes",{n:o.ev.length})})}</div>${quotesHTML(o.ev)}</div>`, mkOut());
}
function openPerson(id){
  const i=M.ivById[id]; if(!i) return;
  const solN=i.solsUsed.length+i.solsStopped.length;
  const jobList=(arr,label)=>arr.length?`<div><div class="sect">${label}</div><div class="feel">${arr.map(j=>`<div>${esc(j.statement)}</div>`).join("")}</div></div>`:"";
  const bold = (key, n) => `<b>${th(key,{n})}</b>`;
  const added = solN ? th("map.drawer.person.added_sols",{quotes:bold("map.count.quotes",i.quoteCount), steps:bold("map.count.steps",i.steps.length), measures:bold("map.count.measures",i.outs.length), solutions:bold("map.count.solutions",solN)})
    : th("map.drawer.person.added",{quotes:bold("map.count.quotes",i.quoteCount), steps:bold("map.count.steps",i.steps.length), measures:bold("map.count.measures",i.outs.length)});
  setDrawer(t("map.drawer.person.kind"),i.name,`
    <div class="tags">${i.date?`<span class="tag">${esc(fmtDate(i.date))}</span>`:""}${i.format?`<span class="tag">${esc(i.format)}</span>`:""}${i.tags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join("")}</div>
    <div><div class="sect">${th("map.drawer.person.who")}</div><p style="margin:0">${esc(i.who)}</p></div>
    <div><div class="sect">${th("map.drawer.person.goal")}</div><p style="margin:0"><b>${esc(i.goal)}</b></p>${i.goalEv[0]?`<blockquote style="margin-top:6px">${esc(quoted(i.goalEv[0].quote))}<span class="src">${esc(srcLabel(i.goalEv[0].source))}</span></blockquote>`:""}</div>
    ${M.jobs.length&&(many()||!i.main)?`<div><div class="sect">${th("map.jobs.label")}</div><div class="olist">${i.main?`<button class="oitem" type="button" data-job="${esc(i.main)}"><span><b>${th("map.drawer.person.main")}</b> ${esc(jobName(i.main))}</span></button>`:`<div class="flag">${esc(sentences(t("map.drawer.person.no_job"), i.whyNone))}</div>`}${i.also.map(j=>`<button class="oitem" type="button" data-job="${esc(j)}"><span><b>${th("map.drawer.person.also")}</b> ${esc(jobName(j))}</span></button>`).join("")}</div></div>`:""}
    ${i.note?`<div class="flag">${esc(i.note)}</div>`:""}
    ${jobList(i.emotional,th("map.drawer.person.feel"))}
    ${jobList(i.social,th("map.drawer.person.seen"))}
    ${jobList(i.related,th("map.drawer.person.other_jobs"))}
    ${i.solsUsed.length?`<div><div class="sect">${th("map.drawer.person.uses")}</div><div class="olist">${i.solsUsed.map(solItem).join("")}</div></div>`:""}
    ${i.solsStopped.length?`<div><div class="sect">${th("map.drawer.person.stopped")}</div><div class="olist">${i.solsStopped.map(solItem).join("")}</div></div>`:""}
    <div class="callout">${added}</div>`);
}
const solItem = s => `<button class="oitem" type="button" data-sol="${esc(s.id)}"><span>${esc(s.name)}</span><span class="meta">${ktag(s.kind)}</span></button>`;
const scopeTotal = () => many() && M.jobById[M.job] ? M.jobById[M.job].people.length : M.ivs.length;
/* step drawer: what people use for this step today, and what they dropped */
function stepSolsHTML(s){
  const now=s.sols.filter(x=>x.cur.length), gone=s.sols.filter(x=>x.stop.length);
  return `<div><div class="sect">${th("map.drawer.step.uses",{count:now.length})}</div>
    <div class="olist">${now.map(x=>`<button class="oitem" type="button" data-sol="${esc(x.sol.id)}"><span>${esc(x.sol.name)}</span><span class="meta">${ktag(x.sol.kind)}<span>${th("map.count.people",{n:x.cur.length})}</span></span></button>`).join("")||`<p class="hint">${th("map.drawer.step.uses_none")}</p>`}</div>
    ${gone.length?`<p class="hint" style="margin:6px 0 0">${th("map.drawer.step.stopped",{items:gone.map(x=>`<button type="button" class="linkbtn" data-sol="${esc(x.sol.id)}">${esc(x.sol.name)}</button> (${esc(names(x.stop))})`).join(esc(t("map.text.list_sep")))})}</p>`:""}</div>`;
}
function openSolution(id){
  const s=M.solById[id]; if(!s) return;
  const inJob=M.sols.items.find(x=>x.sol===s), sc=inJob||M.solAll.items.find(x=>x.sol===s); if(!sc) return;
  const g=s.group?M.groupById[s.group]:null, other=many()?s.jobs.filter(j=>j!==M.job):[];
  const where=a=>joinList([a.cur.length?t("map.count.people",{n:a.cur.length}):t("map.common.no_one_now"), a.stop.length?t("map.common.stopped",{n:a.stop.length}):""].filter(Boolean));
  setDrawer(sc.cur.length?t("map.drawer.sol.kind_used"):t("map.drawer.sol.kind_gone"), s.name, `
    <div class="tags"><span class="tag">${ktag(s.kind)}</span>${g?`<button type="button" class="tag" data-group="${esc(g.id)}" title="${esc(t("map.drawer.sol.group_tip"))}">${esc(t("map.drawer.sol.group",{name:g.name}))}</button>`:""}</div>
    ${g&&g.why?`<div class="explain"><b>${th("map.drawer.sol.why")}</b> ${esc(g.why)}</div>`:""}
    ${sc.cur.length?meter(sc.cur.length, inJob?scopeTotal():M.ivs.length):`<div class="flag">${th("map.drawer.sol.gone",{n:sc.stop.length})}</div>`}
    <div><div class="sect">${th("map.drawer.sol.used_for")}</div><div class="olist">${sc.at.map(a=>`<button class="oitem" type="button" data-go="${esc(a.step.id)}"><span>${esc(a.step.text)}</span><span class="meta">${esc(where(a))}</span></button>`).join("")}</div></div>
    ${sc.curEv.length?`<div><div class="sect">${th("map.drawer.sol.said",{quotes:th("map.count.quotes",{n:sc.curEv.length})})}</div>${quotesHTML(sc.curEv)}</div>`:""}
    ${sc.stopEv.length?`<div><div class="sect">${th("map.sol.col.why_stopped")}</div>${quotesHTML(sc.stopEv)}</div>`:""}
    ${other.length&&inJob?`<p class="hint" style="margin:0">${th("map.drawer.sol.also",{jobs:other.map(j=>`<button type="button" class="linkbtn" data-job="${esc(j)}">${esc(jobName(j))}</button>`).join(esc(t("map.text.list_sep"))), job:esc(jobName(M.job))})}</p>`:""}`, mkSol(s.kind));
}
function openGroup(id){
  const g=M.groupById[id]; if(!g) return;
  const its=M.sols.items.filter(x=>x.sol.group===id).sort((a,b)=>b.cur.length-a.cur.length||b.ment-a.ment);
  const ppl=[...new Set(its.flatMap(x=>x.cur))];
  setDrawer(t("map.drawer.group.kind"), g.name, `
    ${g.why?`<div class="explain"><b>${th("map.sol.why_grouped")}</b> ${esc(g.why)}</div>`:`<div class="explain">${th("map.drawer.group.unsorted")}</div>`}
    ${meter(ppl.length, scopeTotal())}
    <div><div class="sect">${th("map.drawer.group.list",{count:its.length})}</div><div class="olist">${its.map(x=>`<button class="oitem" type="button" data-sol="${esc(x.sol.id)}"><span>${esc(x.sol.name)}</span><span class="meta">${ktag(x.sol.kind)}<span>${x.cur.length?th("map.count.people",{n:x.cur.length}):th("map.drawer.group.stopped")}</span></span></button>`).join("")}</div></div>
    <div><div class="sect">${th("map.drawer.group.who")}</div>${ppl.length?`<p style="margin:0">${ppl.map(p=>`<button type="button" class="linkbtn" data-person="${esc(p)}">${esc(M.ivById[p]?.name||p)}</button>`).join(esc(t("map.text.list_sep")))}</p>`:`<p class="hint">${th("map.drawer.group.none")}</p>`}</div>
    ${many()?`<p class="hint" style="margin:0">${th("map.drawer.group.counted",{job:esc(jobName(M.job))})}</p>`:""}`);
}

/* ---------- tooltip ---------- */
const tip=document.getElementById("tip");
function showTip(e,html){ tip.innerHTML=html; tip.hidden=false; moveTip(e); }
function moveTip(e){ const pad=14; let x=(e.clientX??e.target.getBoundingClientRect().right)+pad, y=(e.clientY??e.target.getBoundingClientRect().top)+pad;
  const r=tip.getBoundingClientRect(); if(x+r.width>innerWidth-8) x=Math.max(8,x-r.width-2*pad); if(y+r.height>innerHeight-8) y=Math.max(8,y-r.height-2*pad); tip.style.left=x+"px"; tip.style.top=y+"px"; }
function hideTip(){ tip.hidden=true; }

/* ---------- tabs, modals, loading ---------- */
document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===tab)));
  ["people","progress","next"].forEach(k=>document.getElementById("pane-"+k).hidden=(k!==tab.dataset.tab));
}));
const modal=document.getElementById("modal");
function openModal(html){ document.getElementById("mBody").innerHTML=html; modal.hidden=false; document.getElementById("mClose").focus(); }
document.getElementById("mClose").onclick=()=>modal.hidden=true;
modal.addEventListener("click",e=>{ if(e.target===modal) modal.hidden=true; });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(!modal.hidden) modal.hidden=true; else closeDrawer(); } });
const gloss = (term, text) => `<dt>${th(term)}</dt><dd>${text}</dd>`;
document.getElementById("btnRead").onclick=()=>openModal(`
  <h2 id="mTitle">${th("map.help.title")}</h2>
  <p>${th("map.help.intro")}</p>
  <dl class="gloss">

    ${gloss("map.help.steps.term",th("map.help.steps.text",{key:esc(M.steps[0]?.key||"A.1")}))}
    ${gloss("map.help.outs.term",th("map.help.outs.text"))}
    ${gloss("map.help.green.term",th("map.help.green.text"))}

document.getElementById("btnBuilt").onclick=()=>openModal(`
  <h2 id="mTitle">${th("map.built.title")}</h2>
  <ol>
    <li><b>${th("map.built.talk")}</b> ${th("map.built.talk_text",{n:M.ivs.length})}</li>

    <li><b>${th("map.built.honest")}</b> ${th("map.built.honest_text")}</li>
  </ol>
  <p class="hint">${th("map.built.method")}</p>
  ${M.caveat?`<div class="err">${esc(M.caveat)}</div>`:""}
  <div class="cta"><span>${th("map.built.cta",{brand:BRAND, site:`<a href="${pwUrl("built-panel")}" target="_blank" rel="noopener">${SITE}</a>`})}</span></div>`);
const fileIn=document.getElementById("file");
document.getElementById("btnOpen").onclick=()=>fileIn.click();
fileIn.onchange=()=>{ if(fileIn.files[0]) readFile(fileIn.files[0]); fileIn.value=""; };
function readFile(f){ const r=new FileReader(); r.onload=()=>{ try{ const txt=String(r.result);
    if(!f.name.endsWith(".json") && typeof jsyaml==="undefined") throw new Error(t("map.file.no_yaml"));
    const data=f.name.endsWith(".json")?JSON.parse(txt):jsyaml.load(txt); load(data); }
  catch(err){ openModal(`<h2 id="mTitle">${th("map.file.error_title")}</h2><div class="err">${esc(err.message)}</div><p>${th("map.file.error_help",{path:"<b>.pw-kb/pw-kb.yaml</b>"})}</p>`); } }; r.readAsText(f); }
let dragDepth=0; const dropEl=document.getElementById("drop");
addEventListener("dragenter",e=>{ e.preventDefault(); dragDepth++; dropEl.hidden=false; });
addEventListener("dragleave",()=>{ dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) dropEl.hidden=true; });
addEventListener("dragover",e=>e.preventDefault());
addEventListener("drop",e=>{ e.preventDefault(); dragDepth=0; dropEl.hidden=true; const f=e.dataTransfer.files[0]; if(f) readFile(f); });

/* A KB dropped onto the map brings its own language; a file that does not load leaves the map as it was. */
function load(raw){
  if(!raw || typeof raw!=="object") throw new Error(t("map.file.empty"));
  const was={...UI}, wasCache=labelCache;
  setLanguage(raw);
  try{ M=build(raw); }catch(err){ Object.assign(UI, was); labelCache=wasCache; applyLabels(); throw err; }
  chooseJob(null); expanded=new Set(); selected=null; personHL=null; searchHL=null; solHL=null; showSols=false; closeDrawer();
  nextOpen=false; syncSolControls(); setView(M.hasOver?"over":"map", true); if(overMode) renderOverView();
  renderHeader(); renderJobs(); renderPeople(); renderProgress(); renderNext(); updatePill();
  render(); requestAnimationFrame(()=>fit(true));
}
addEventListener("resize",()=>{ clearTimeout(window._rt); window._rt=setTimeout(()=>{ fit(true); padSolView(); },150); });
load(SAMPLE);
