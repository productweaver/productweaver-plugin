<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Weaver</title>
<style>
/* Layout: a Mac app window. A title bar with the view switch in the middle, a floating sidebar (people and progress),
   a pan-and-zoom mind map on a dot grid, and an inspector that slides in on the right. Liquid Glass only on the
   controls that float over content; text and cards stay solid. Apple system colors: blue for actions, green for
   evidence, orange for "needs more conversations". */
:root{
  --bg:#f5f5f7;
  --surface:#ffffff;
  --ink:#1d1d1f;
  --muted:#6e6e73;
  --line:rgba(0,0,0,.1);
  --edge:rgba(0,0,0,.2);
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  /* blue: fills carry white text (AA), --link is blue text, --accent-ring outlines and focus */
  --accent:#0071e3; --accent-ring:#007aff; --link:#0066cc;
  --accent-soft:rgba(0,113,227,.1);
  /* status colors, only where something moves toward a goal: red (no one yet), orange (needs more), green (reached).
     The -ink shades are for text; the plain ones for bars and dots. */
  --ok:#34c759; --ok-ink:#1f7a37; --ok-soft:#e8f8ec;
  --amber:#a85700; --amber-dot:#ff9500; --amber-soft:#fff3e3;
  --bad:#ff3b30; --bad-ink:#d70015; --bad-soft:#ffecea;
  /* what people use today, by kind: systemPurple, systemTeal, systemIndigo, systemBrown, apart from the status colors */
  --sol-product:#af52de; --sol-tool:#30b0c7; --sol-people:#5856d6; --sol-own:#a2845e;
  /* map boxes: a step is a white card, a measure of success a card with a blue target */
  --step-line:rgba(0,0,0,.13); --out-fill:#f6f9fe; --out-line:#cfdff5; --out-ink:#0066cc;
  --quote:rgba(0,0,0,.035);
  --mono:linear-gradient(180deg,#a6a6ab,#86868b);
  --seg-on:#ffffff;
  --shadow:0 0 0 .5px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.1),0 18px 40px rgba(0,0,0,.06);
  --shadow-sm:0 0 0 .5px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.1);
  --glass:rgba(255,255,255,.64); --glass-strong:rgba(255,255,255,.84);
  --glass-edge:inset 0 1px 0 rgba(255,255,255,.75),inset 0 0 0 .5px rgba(255,255,255,.45);
  --font:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --font-read:ui-serif,"New York","Iowan Old Style","Source Serif 4",Georgia,serif;
  --ease:cubic-bezier(.32,.72,0,1);
  --soltop:24px;
  --pagew:1080px;
  --dw:min(400px,calc(100% - 16px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1c1e; --surface:#2c2c2e; --ink:#f5f5f7; --muted:#98989d; --line:rgba(255,255,255,.11); --edge:rgba(255,255,255,.22);
    --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.34);
    --accent-ring:#0a84ff; --link:#2997ff; --accent-soft:rgba(10,132,255,.2);
    --ok:#30d158; --ok-ink:#30d158; --ok-soft:rgba(48,209,88,.16);
    --amber:#ff9f0a; --amber-dot:#ff9f0a; --amber-soft:rgba(255,159,10,.14);
    --bad:#ff453a; --bad-ink:#ff6961; --bad-soft:rgba(255,69,58,.16);
    --sol-product:#bf5af2; --sol-tool:#40c8e0; --sol-people:#5e5ce6; --sol-own:#ac8e68;
    --step-line:rgba(255,255,255,.14); --out-fill:#2a3240; --out-line:#3b5378; --out-ink:#2997ff;
    --quote:rgba(255,255,255,.05); --mono:linear-gradient(180deg,#8e8e93,#636366); --seg-on:#636366;
    --shadow:0 0 0 .5px rgba(0,0,0,.6),0 8px 28px rgba(0,0,0,.45); --shadow-sm:0 0 0 .5px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
    --glass:rgba(50,50,54,.62); --glass-strong:rgba(44,44,46,.86);
    --glass-edge:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 .5px rgba(255,255,255,.12);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1c1e; --surface:#2c2c2e; --ink:#f5f5f7; --muted:#98989d; --line:rgba(255,255,255,.11); --edge:rgba(255,255,255,.22);
  --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.34);
  --accent-ring:#0a84ff; --link:#2997ff; --accent-soft:rgba(10,132,255,.2);
  --ok:#30d158; --ok-ink:#30d158; --ok-soft:rgba(48,209,88,.16);
  --amber:#ff9f0a; --amber-dot:#ff9f0a; --amber-soft:rgba(255,159,10,.14);
  --bad:#ff453a; --bad-ink:#ff6961; --bad-soft:rgba(255,69,58,.16);
  --sol-product:#bf5af2; --sol-tool:#40c8e0; --sol-people:#5e5ce6; --sol-own:#ac8e68;
  --step-line:rgba(255,255,255,.14); --out-fill:#2a3240; --out-line:#3b5378; --out-ink:#2997ff;
  --quote:rgba(255,255,255,.05); --mono:linear-gradient(180deg,#8e8e93,#636366); --seg-on:#636366;
  --shadow:0 0 0 .5px rgba(0,0,0,.6),0 8px 28px rgba(0,0,0,.45); --shadow-sm:0 0 0 .5px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --glass:rgba(50,50,54,.62); --glass-strong:rgba(44,44,46,.86);
  --glass-edge:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 .5px rgba(255,255,255,.12);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.47;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent-ring) 55%,transparent);outline-offset:1px}
.ap-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* our own glyphs, drawn in the SF Symbols manner */
svg.ap-ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;cursor:inherit}

/* Liquid Glass: the controls that float over content. Text and cards below them stay solid. */
aside.side,.search,.tgroup,.viewsw,.ap-cap,.legend,.madewith,.drawer,.tip,.lv-note{
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:var(--glass-edge),var(--shadow)}
.drawer,.tip,.lv-note{background:var(--glass-strong)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  aside.side,.search,.tgroup,.viewsw,.ap-cap,.legend,.madewith,.drawer,.tip,.lv-note{background:var(--surface)} }
@media (prefers-reduced-transparency: reduce){
  aside.side,.search,.tgroup,.viewsw,.ap-cap,.legend,.madewith,.drawer,.tip,.lv-note{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none} }
@media (prefers-contrast: more){
  :root{--line:rgba(0,0,0,.3);--muted:#515154}
  aside.side,.search,.tgroup,.viewsw,.ap-cap,.legend,.madewith,.drawer,.tip,.lv-note{background:var(--surface);outline:1px solid var(--muted)} }

/* title bar: the study on the left, the views in the middle, help on the right (like Calendar and Mail) */
header.ap-bar{padding:10px 16px;display:grid;grid-template-columns:minmax(0,1.5fr) auto minmax(0,1fr);gap:8px 16px;align-items:center;
  background:var(--bg);box-shadow:0 .5px 0 var(--line);position:relative;z-index:8}
.ap-lead{display:flex;gap:12px;align-items:center;min-width:0}
.brand{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:9px;color:#fff;text-decoration:none;
  background:linear-gradient(180deg,#2e8bff,#0064d6);box-shadow:inset 0 .5px 0 rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.18)}
.brand:hover{filter:brightness(1.06)}
.pwmark{width:20px;height:20px;flex:none}
.pwmark path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.titles{min-width:0;display:grid;gap:1px}
h1{margin:0;font-size:15px;line-height:1.3;font-weight:600;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
h1 .goal{color:inherit}
.sub{color:var(--muted);font-size:12px;line-height:1.35}
.sub .linkbtn{color:var(--link);text-decoration:none}
.sub .linkbtn:hover{text-decoration:underline}
.actions{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.ap-cap{display:flex;gap:2px;padding:3px;border-radius:999px}
.ap-ib{border:0;background:none;color:var(--ink);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;padding:0}
.ap-ib:hover{background:var(--fill)}
.ap-ib svg.ap-ic{width:18px;height:18px}
.btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:500}
.btn:hover{background:var(--fill2)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}

/* the view switch: a glass capsule, the chosen view a raised pill */
.viewsw{display:flex;gap:2px;padding:3px;border-radius:999px;justify-self:center;max-width:100%}
.viewsw button{border:0;background:none;color:var(--ink);padding:5px 14px;font-size:13px;font-weight:500;border-radius:999px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;transition:background-color .15s,box-shadow .15s}
.viewsw button:hover{background:var(--fill)}
.viewsw button[aria-selected="true"]{background:var(--seg-on);box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.14);font-weight:600}
.ap-dot{width:7px;height:7px;border-radius:50%;background:var(--amber-dot);flex:none}

/* the live map: when it was updated (title bar), what is going on, what changed (a notice), what is new (badges) */
.lv-stamp{border:0;background:none;color:var(--muted);font-size:12px;line-height:1.3;padding:5px 10px;border-radius:999px;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;min-width:0;max-width:min(40vw,440px);transition:background-color .2s,color .2s}
.lv-stamp[hidden]{display:none}
.lv-stamp span{overflow:hidden;text-overflow:ellipsis}
.lv-stamp:hover{background:var(--fill);color:var(--ink)}
.lv-stamp i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ok)}
.lv-stamp.lv-wait i,.lv-stamp.lv-dead i{display:none}
.lv-stamp.lv-busy{color:var(--link);background:var(--accent-soft)}
.lv-stamp.lv-busy i{background:var(--accent-ring);animation:lv-pulse 1.4s ease-in-out infinite}
.lv-stamp.lv-ready{color:#fff;background:var(--accent);font-weight:600}
.lv-stamp.lv-ready:hover{filter:brightness(1.08)}
.lv-stamp.lv-ready i{background:#fff}
.lv-stamp.lv-fresh{animation:lv-flash 2.6s var(--ease)}
@keyframes lv-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
@keyframes lv-flash{0%,35%{background:var(--ok-soft);color:var(--ok-ink)}100%{background:transparent}}
.lv-stamp[aria-expanded="true"]:not(.lv-busy):not(.lv-ready){background:var(--fill);color:var(--ink)}
/* the card opens under the stamp, its caret on it: where the reader just clicked, or where the stamp just flashed after
   an update. The script places it: inside the title bar it would sit below the drawer. */
.lv-note{position:absolute;top:0;left:0;z-index:35;width:max-content;max-width:min(340px,calc(100vw - 24px));box-sizing:border-box;
  display:flex;gap:10px;align-items:flex-start;padding:10px 8px 10px 12px;border-radius:14px;font-size:13px;line-height:1.4;color:var(--ink);
  transform-origin:var(--lv-caret,50%) 0;animation:lv-in .2s var(--ease)}
.lv-note::before{content:"";position:absolute;top:-6px;left:calc(var(--lv-caret,50%) - 6px);width:12px;height:12px;border-radius:2px 0 0 0;
  transform:rotate(45deg);clip-path:polygon(0 0,100% 0,0 100%);background:inherit;-webkit-backdrop-filter:inherit;backdrop-filter:inherit;
  box-shadow:inset .5px .5px 0 rgba(0,0,0,.12)}
.lv-note[hidden]{display:none}
.lv-note .lv-body{display:grid;gap:4px;min-width:0;padding-top:1px}
.lv-note p{margin:0}
.lv-note .lv-more{color:var(--muted);font-size:12px}
.lv-note > svg.ap-ic{width:20px;height:20px;padding:4px;border-radius:50%;background:var(--ok);color:#fff;stroke-width:2.4;box-sizing:border-box}
.lv-note.lv-info > svg.ap-ic{background:var(--accent)}
.lv-note button{flex:none;border:0;background:var(--fill);color:var(--muted);border-radius:50%;width:26px;height:26px;padding:0;display:grid;place-items:center;margin:-3px 0}
.lv-note button:hover{background:var(--fill2);color:var(--ink)}
.lv-note button svg.ap-ic{width:11px;height:11px;stroke-width:2.2}
@keyframes lv-in{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.lv-new{display:inline-block;margin-inline-start:6px;padding:0 7px;border-radius:999px;background:var(--accent);color:#fff;font:600 10.5px/17px var(--font);
  letter-spacing:.01em;vertical-align:1px;white-space:nowrap}
.node .t2 .lv-newt{fill:var(--link);font-weight:700}
@media (prefers-reduced-motion: reduce){.lv-stamp i,.lv-stamp.lv-fresh,.lv-note{animation:none!important}}
@media (max-width:620px){.lv-stamp{max-width:42vw}}
@media print{.lv-stamp,.lv-note{display:none!important}}
@media (max-width:1100px){
  header.ap-bar{grid-template-columns:minmax(0,1fr) auto}
  .viewsw{grid-column:1 / -1;grid-row:2}
}

/* several core jobs: a scope bar under the title bar, like Finder's search scopes */
.jobs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 16px;background:var(--bg);box-shadow:0 .5px 0 var(--line);position:relative;z-index:7}
.jobs[hidden]{display:none}
.jobs .lbl{font-size:12px;font-weight:600;color:var(--muted);margin-right:4px}
.jobbtn{display:flex;gap:8px;align-items:center;border:0;background:var(--fill);color:var(--ink);border-radius:999px;padding:4px 14px 4px 5px;font-size:13px;text-align:left;max-width:360px}
.jobbtn:hover{background:var(--fill2)}
.jobbtn[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-ring)}
.jobbtn span{line-height:1.25}
.jobbtn small{display:block;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.jl{display:inline-grid;place-items:center;flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:700}
.jl.also{background:transparent;color:var(--link);box-shadow:inset 0 0 0 1px var(--accent-ring)}
.jl.none{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--muted);font-weight:600}
.person .jobsline{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:11.5px;color:var(--muted)}

main{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0;position:relative;
  background:radial-gradient(circle,var(--edge) 1px,transparent 1.3px) 0 0/24px 24px,var(--bg)}
@media (max-width:860px){main{grid-template-columns:1fr;grid-template-rows:auto 70vh}}
/* on phones the page scrolls: the sidebar gets its own height instead of being squeezed out by the 70vh map */
@media (max-width:860px){html,body{height:auto} main{flex:none} aside.side{height:60vh;margin:8px !important}}
/* the panel views take the full width: the sidebar steps aside */
main.wide{grid-template-columns:minmax(0,1fr)}
main.wide aside.side{display:none}
@media (max-width:860px){main.wide{grid-template-rows:minmax(70vh,1fr)}}

/* sidebar: a floating panel, like Finder and Notes */
aside.side{margin:8px 0 8px 8px;border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative;z-index:6}
.tabs{display:flex;gap:2px;margin:10px 10px 6px;padding:2px;border-radius:999px;background:var(--fill)}
.tab{flex:1;border:0;background:none;padding:4px 6px;font-size:13px;font-weight:500;color:var(--ink);border-radius:999px;transition:background-color .15s}
.tab[aria-selected="true"]{background:var(--seg-on);box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.14);font-weight:600}
.pane{overflow:auto;padding:4px 8px 14px;display:grid;gap:2px;align-content:start;min-height:0;flex:1}
.hint{font-size:12px;color:var(--muted);line-height:1.4}
.pane > .hint:first-child{margin:2px 8px 8px}
.person{border:0;border-radius:10px;padding:7px 8px;background:none;text-align:left;display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:10px;row-gap:1px;color:var(--ink);transition:background-color .15s}
.person > :not(.ap-av){grid-column:2}
.person:hover{background:var(--fill)}
.person[aria-pressed="true"]{background:var(--accent-soft)}
.person[aria-pressed="true"] .nm{color:var(--link)}
.ap-av{grid-row:1 / span 3;align-self:start;width:28px;height:28px;border-radius:50%;background:var(--mono);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:600;font-style:normal;letter-spacing:-.02em}
.person .nm{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:8px;line-height:1.3}
.person .nm small{font-weight:500;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.person .role{font-size:12px;color:var(--muted);line-height:1.35}
.gap{border:0;border-radius:10px;padding:8px 10px 8px 26px;background:var(--fill);text-align:left;color:var(--ink);font-size:13px;display:grid;gap:2px;position:relative}
.gap::before{content:"";position:absolute;left:11px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--amber-dot)}
button.gap:hover{background:var(--fill2)}
.gap small{color:var(--muted)}
.sect{font-size:12px;font-weight:600;color:var(--muted);margin:6px 0 0}
.pane > .sect{margin:12px 8px 4px}
.callout{background:var(--fill);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px}
.callout b{color:var(--link)}

.stage{position:relative;overflow:hidden;min-height:0;touch-action:none}
.stage > svg{width:100%;height:100%;display:block;cursor:grab;user-select:none;direction:ltr}
.stage > svg.dragging{cursor:grabbing}
.toolbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none;z-index:6}
.toolbar > *{pointer-events:auto}
.search{display:flex;align-items:center;gap:6px;border-radius:999px;padding:0 14px 0 12px;height:36px;color:var(--muted)}
.search input{border:0;background:transparent;color:var(--ink);width:200px;outline:none;font-size:13px}
.search:focus-within{box-shadow:var(--glass-edge),var(--shadow),0 0 0 3px color-mix(in srgb,var(--accent-ring) 45%,transparent)}
.tgroup{display:flex;gap:2px;padding:3px;border-radius:999px;align-items:center;height:36px}
.tgroup button{border:0;background:none;color:var(--ink);height:30px;padding:0 12px;font-size:13px;font-weight:500;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.tgroup button:hover{background:var(--fill)}
.tgroup button[aria-pressed="true"]{background:var(--accent-soft);color:var(--link)}
.ap-zoom{position:absolute;right:12px;bottom:12px;z-index:6}
.ap-zoom button{min-width:30px;padding:0 8px}
.stage.solmode .toolbar,.stage.solmode .ap-zoom{display:none}
.stage.solmode > svg,.stage.solmode .legend,.stage.solmode .madewith{visibility:hidden}
.filterpill{background:var(--accent);color:#fff;border-radius:999px;height:36px;padding:0 4px 0 14px;font-size:13px;font-weight:500;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.filterpill button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:50%;width:26px;height:26px;padding:0;display:grid;place-items:center}
.filterpill button:hover{background:rgba(255,255,255,.34)}
.legend{position:absolute;left:12px;bottom:12px;border-radius:16px;padding:10px 14px;font-size:12px;color:var(--muted);display:grid;gap:6px;max-width:330px;z-index:5}
.legend .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{display:inline-block;width:14px;height:8px;border-radius:4px;vertical-align:0;margin-right:4px}

/* map nodes. Each kind has its own shape, so a reader can tell them apart before reading:
   a step is a white card with its number, a measure of success a green card with a target,
   a solution a capsule with an icon for its kind. The green bar on the left always means how many people said it. */
.node{cursor:pointer}
.node rect.box{fill:var(--surface);stroke:var(--line);stroke-width:1}
.node rect.ap-sh{fill:rgba(0,0,0,.05)}
.node.step rect.box{stroke:var(--step-line)}
.node.out rect.box{fill:var(--out-fill);stroke:var(--out-line)}
.node.sol rect.box{fill:color-mix(in srgb,var(--k,var(--muted)) 9%,var(--surface));stroke:color-mix(in srgb,var(--k,var(--muted)) 40%,var(--surface))}
.mk-k-product{--k:var(--sol-product)} .mk-k-everyday_tool{--k:var(--sol-tool)} .mk-k-people{--k:var(--sol-people)} .mk-k-own_method{--k:var(--sol-own)}
.node .mk-num{font-size:12px;font-weight:600;fill:var(--muted);font-variant-numeric:tabular-nums}
.node .mk-div{stroke:var(--line);stroke-width:1}
.node .mk-oico,.mk-cap.out use{color:var(--out-ink)}
.node .mk-disc{fill:var(--k,var(--muted))}
.node .mk-glyph{color:#fff}
.node.sol.gone .mk-disc{fill:var(--muted)}
.mk-cap text{font-family:var(--font);font-size:11.5px;font-weight:600;fill:var(--muted)}
.mk-cap.sol use{color:var(--muted)}
.node:hover rect.box{stroke:var(--accent-ring)}
.node.sel rect.box{stroke:var(--accent-ring);stroke-width:2.2}
.node.root rect.box{fill:var(--accent);stroke:transparent}
.node.root text{fill:#fff}
.node.root rect.ap-sh{fill:rgba(0,80,180,.18)}
.node.stage rect.box{fill:color-mix(in srgb,var(--accent) 10%,var(--surface));stroke:transparent}
.node.stage rect.ap-sh{fill:transparent}
.node text{fill:var(--ink);font-family:var(--font)}
.node .t1{font-size:13.5px;font-weight:600}
.node .t2{font-size:11px;fill:var(--muted)}
.node.root .t2{fill:rgba(255,255,255,.85)}
.node.stage .t1{font-size:14px;font-weight:600;fill:var(--link)}
.node.dim{opacity:.18}
.node.hit rect.box{stroke:var(--accent-ring);stroke-width:2.2}
.edge{fill:none;stroke:var(--edge);stroke-width:1.5}
.edge.mk-e-out{stroke:var(--out-line)}
.edge.dim{opacity:.2}
.tog circle{fill:var(--surface);stroke:var(--edge);stroke-width:1}
.tog:hover circle{stroke:var(--accent-ring)}
.tog text{fill:var(--link);font-size:13px;font-weight:600}
.thinflag{fill:var(--amber-dot)}
.node.sol .t1{font-size:13px}
.node.sol.gone rect.box{fill:var(--surface);stroke:var(--muted);stroke-dasharray:5 4}
.node.sol.gone:hover rect.box,.node.sol.gone.sel rect.box,.node.sol.gone.hit rect.box{stroke:var(--accent-ring)}
.sw.dash{background:transparent;border:1.5px dashed var(--muted)}
.legend.wide{max-width:min(400px,calc(100% - 24px))}
/* the key at the top of the legend draws each kind of box the way the map does */
.mk-key{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mk-key > span{position:relative;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;font-weight:600;color:var(--ink);white-space:nowrap}
.mk-key > .mk-kstep{background:var(--surface);border:1px solid var(--step-line);border-radius:7px;padding-left:0}
.mk-kstep b{color:var(--muted);font-size:11px;line-height:14px;padding:0 7px 0 13px;border-right:1px solid var(--line)}
.mk-key > .mk-kout{background:var(--out-fill);border:1px solid var(--out-line);border-radius:7px;padding-left:13px}
.mk-kstep::before,.mk-kout::before{content:"";position:absolute;left:3px;top:5px;bottom:5px;width:3px;border-radius:2px;background:var(--ok)}
.mk-key > .mk-ksol{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding-left:3px}
svg.mk-ic.mk-c-out{color:var(--out-ink)}
.mk-dot{width:17px;height:17px;border-radius:50%;background:var(--k,var(--muted));display:inline-grid;place-items:center;color:#fff;flex:none;vertical-align:-4px}
.legend .mk-dot{margin-right:4px}
svg.mk-ic{width:14px;height:14px;display:inline-block;flex:none;cursor:inherit;vertical-align:-2px}
.mk-dot svg.mk-ic{width:11px;height:11px;vertical-align:0}
.mk-numh{display:inline-block;border:1px solid var(--step-line);border-radius:5px;padding:0 5px;color:var(--muted);font-weight:700;letter-spacing:0;line-height:1.35;font-variant-numeric:tabular-nums}

/* the panel views (Overview, Solutions, Value themes, Next interviews) cover the stage */
.solview{position:absolute;inset:0;overflow:auto;z-index:5;background:var(--bg);padding:var(--soltop) 24px 40px}
.stage.solmode{background:var(--bg)}
@media (min-width:861px){.stage.has-drawer .solview{padding-right:calc(var(--dw) + 32px)}}
.solin{max-width:var(--pagew);margin:0 auto;display:grid;gap:16px}
.solin h2{margin:0;font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.solin h3{margin:14px 0 0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.solin > p{margin:0}
.solin > .olist{max-width:720px}
.twrap{background:var(--surface);border-radius:14px;overflow:hidden}
.soltable{width:100%;border-collapse:collapse;font-size:14px}
.soltable thead th:nth-child(1){width:24%}
.soltable thead th:nth-child(2){width:14%}
.soltable.now thead th:nth-child(3){width:12%}
.soltable.now thead th:nth-child(4){width:20%}
.soltable.gone thead th:nth-child(3){width:16%}
.soltable.gone thead th:nth-child(4){width:22%}
.soltable thead th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 14px;white-space:nowrap}
.soltable td,.soltable tbody th{padding:9px 14px;border-top:1px solid var(--line);vertical-align:top;text-align:left;font-weight:400}
.soltable tr[data-row]{cursor:pointer}
.soltable tr[data-row]:hover{background:var(--fill)}
.soltable tr.on{background:var(--accent-soft)}
.soltable tr.ghead th{padding:0}
.gbtn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;width:100%;border:0;background:var(--fill);color:var(--ink);text-align:left;padding:11px 14px;font-size:13px}
.gbtn .gname{font-weight:600;font-size:14px}
.gbtn .gnum{grid-column:2;grid-row:1;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.gbtn .gwhy{grid-column:1 / -1;color:var(--muted)}
.gbtn:hover .gname,.gbtn[aria-pressed="true"] .gname{color:var(--link)}
.gbtn[aria-pressed="true"]{background:var(--accent-soft)}
.solname{border:0;background:none;padding:0;color:var(--link);font-weight:500;text-align:left;font-size:14px}
.solname:hover{text-decoration:underline}
.sline{display:block}
.sline + .sline{margin-top:3px}
.mcell{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.mbar{display:inline-block;width:56px;height:5px;border-radius:3px;background:var(--fill);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent-ring);border-radius:3px}
.why{font-family:var(--font-read);font-size:15px}
.why small{display:block;font-family:var(--font);color:var(--muted);font-size:12px;margin-top:2px}
.ktag{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.ktag i{width:8px;height:8px;border-radius:50%;flex:none}
.oitem .meta{display:flex;gap:8px;align-items:center;flex:none;color:var(--muted);font-size:12px;white-space:nowrap}
.linkbtn{border:0;background:none;padding:0;color:inherit;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.linkbtn:hover{color:var(--link)}
/* Value themes view: one tile per theme */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:16px;align-items:start}
.tcard{background:var(--surface);border-radius:22px;padding:24px 26px;display:grid;gap:14px;min-width:0}
.solin .tcard h3{margin:0;font-size:19px;line-height:1.25;font-weight:600;letter-spacing:-.01em;text-wrap:balance;scroll-margin-top:calc(var(--soltop) + 28px)}
.tneed{margin:3px 0 0;font-family:var(--font-read);font-size:16px;line-height:1.45}
.tsig{display:grid;gap:5px;font-size:13px}
.tsig small{color:var(--muted);font-size:12px}
.twhy{margin:0;font-size:13px;color:var(--muted)}
.tcard .sect{margin:0}
.tcard .oitem{width:100%;flex-wrap:wrap}
.tcard .oitem > span:first-child{flex:1 1 10em;min-width:0}
.oitem small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.hlk{display:grid;gap:6px}
.hlk + .hlk{margin-top:8px}
.hlk .tag{justify-self:start;font-weight:600}
@media (max-width:860px){
  .solview{padding-left:12px;padding-right:12px}
  .soltable thead{display:none}
  .soltable,.soltable tbody,.soltable tr,.soltable td,.soltable tbody th{display:block}
  .soltable tr[data-row]{padding:10px 14px;border-top:1px solid var(--line)}
  .soltable tr[data-row] > *{border:0;padding:2px 0}
  .soltable td{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px}
  .soltable td::before{content:attr(data-l);font-size:12px;font-weight:600;color:var(--muted);padding-top:1px}
  .soltable tr.ghead th{border-top:1px solid var(--line)}
}

/* Overview view: the study as a short story, for someone new to the method, laid out like an apple.com page:
   one tile per step, a big answer per step, a rail that shows how the findings build on each other.
   Sans is our words; serif is the customers' words only. */
.ov-page{max-width:var(--pagew);margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:0 32px;align-items:start}
.ov-rail{position:sticky;top:0;padding-top:8px;font-size:13px}
.ov-rail p{margin:0 0 8px;padding:0 8px;color:var(--muted);font-size:12px;font-weight:600}
.ov-rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ov-rail li button{border:0;background:none;padding:7px 8px;width:100%;text-align:left;display:grid;grid-template-columns:22px 1fr;gap:10px;color:var(--muted);align-items:start;border-radius:10px;transition:background-color .15s}
.ov-rail li b{width:22px;height:22px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.ov-rail li span{display:grid;line-height:1.3;padding-top:2px;font-weight:600}
.ov-rail li small{font-weight:400;font-size:12px}
.ov-rail li button:hover{background:var(--fill);color:var(--ink)}
.ov-rail li button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.ov-rail li button.on b{background:var(--accent);color:#fff}
.ov-railnext{margin-top:14px;border:0;background:var(--accent-soft);color:var(--link);font-weight:600;font-size:13px;border-radius:999px;padding:8px 14px;width:100%;text-align:center}
.ov-railnext:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}

.ov-sheet{display:grid;gap:16px;min-width:0}
.ov-blk{padding:34px 40px;background:var(--surface);border-radius:22px}
.ov-sheet p,.ov-sheet h2,.ov-sheet h3{margin:0}
.ov-note{font-size:13px;color:var(--muted);max-width:66ch}
.ov-body{font-size:17px;line-height:1.47;letter-spacing:-.01em;max-width:62ch}
.ov-lk{border:0;background:none;padding:0;color:var(--link);font-size:14px;font-weight:500;text-align:left}
.ov-lk:hover{text-decoration:underline;text-underline-offset:3px}
.ov-todo{background:var(--fill);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted);max-width:66ch}
.ov-todo b{color:var(--ink)}
.ov-sheet blockquote{font-size:17px;line-height:1.5;padding:12px 16px;max-width:66ch}

.ov-lead{display:grid;gap:20px}
.ov-lead .ov-bl{font-size:40px;line-height:1.1;font-weight:600;letter-spacing:-.022em;text-wrap:balance;max-width:24em}
.ov-sure{display:grid;gap:8px;max-width:66ch}
.ov-gauge{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px;color:var(--muted)}
.ov-gauge li{line-height:1.25}
.ov-gauge li::before{content:"";display:block;height:6px;border-radius:3px;background:var(--fill2);margin-bottom:7px}
/* the filled part takes the color of the level reached: red for a first guess, orange for early signs, green from a clear pattern */
.ov-gauge li.done::before,.ov-gauge li.now::before{background:var(--ok)}
.ov-gauge.lv1 li.now::before{background:var(--bad)}
.ov-gauge.lv2 li.done::before,.ov-gauge.lv2 li.now::before{background:var(--amber-dot)}
.ov-gauge li.now{color:var(--ink);font-weight:600}
/* who the study is about: the first block, so every sentence below has a subject; the rail repeats it */
.ov-who{display:grid;gap:18px}
.ov-whohead{display:grid;grid-template-columns:72px minmax(0,1fr);gap:18px;align-items:center}
.ov-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),color-mix(in srgb,var(--accent) 18%,var(--surface)));color:var(--link);display:grid;place-items:center;flex:none}
.ov-avatar svg.ov-ric{width:38px;height:38px;display:block;cursor:inherit}
.ov-whotext{display:grid;gap:6px;min-width:0}
.ov-whoname{font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-.018em;text-wrap:balance}
.ov-whotext .ov-body{max-width:60ch}
.ov-whotext .ov-body span{color:var(--muted)}
.ov-whofoot{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;font-size:14px}
.ov-faces{display:flex;align-items:center;padding-left:6px}
.ov-faces button{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);background:var(--mono);color:#fff;font-size:11px;letter-spacing:-.02em;font-weight:600;margin-left:-6px;padding:0;display:grid;place-items:center;position:relative}
.ov-faces button:hover,.ov-faces button:focus-visible{z-index:1;filter:brightness(1.1)}
.ov-faces span{margin-left:6px;font-size:12px;color:var(--muted)}
.ov-railwho{border:0;border-bottom:1px solid var(--line);background:none;padding:0 8px 14px;margin:0 0 14px;width:100%;text-align:left;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;color:var(--ink)}
.ov-railwho .ov-avatar{width:40px;height:40px}
.ov-railwho .ov-avatar svg.ov-ric{width:22px;height:22px}
.ov-railwho > span:last-child{display:grid;line-height:1.25;font-size:13px}
.ov-railwho small{font-size:12px;color:var(--muted)}
.ov-railwho b{font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ov-railwho:hover b{color:var(--link)}
/* the numbers behind the study, like the figures on an apple.com page */
.ap-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:18px 20px;padding:20px 0 0;border-top:1px solid var(--line);margin:0;list-style:none}
.ap-num{display:grid;gap:3px;align-content:start;min-width:0;border:0;background:none;padding:0;color:var(--ink);text-align:left;font-size:inherit}
.ap-num > b{font-size:32px;line-height:1.05;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:center;min-height:34px}
.ap-num > span{font-size:12px;color:var(--muted);line-height:1.3}
button.ap-num:hover > span{color:var(--link)}
.ap-num.ok > b{color:var(--link)}
.ap-num.ok svg.ap-ic{width:30px;height:30px;stroke-width:2.2}
.pane .ap-nums{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px;padding:12px 8px 4px;margin-top:6px}
.pane .ap-num > b{font-size:22px;min-height:24px}
.pane .ap-num.ok svg.ap-ic{width:22px;height:22px}

.ov-blk.ov-next{padding:0}
.ov-nexttog{border:0;background:none;color:var(--ink);text-align:left;width:100%;padding:24px 40px;display:flex;gap:12px 24px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:22px}
.ov-ntitle{display:grid;gap:6px;min-width:0}
.ov-ntitle > b{font-size:22px;line-height:1.2;font-weight:600;letter-spacing:-.012em}
.ov-nsum{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.ov-nsum > span{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.ov-pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;color:var(--ink)}
.ov-pill.go{background:var(--ok-soft)} .ov-pill.try{background:var(--accent-soft);color:var(--link)} .ov-pill.wait{background:var(--amber-soft)}
.ov-ncta{display:inline-flex;gap:8px;align-items:center;background:var(--accent);color:#fff;font-weight:500;font-size:15px;border-radius:999px;padding:10px 20px;white-space:nowrap}
.ov-nexttog:hover .ov-ncta{filter:brightness(1.08)}
.ov-ncta svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
.ov-nexttog[aria-expanded="true"] .ov-ncta{background:var(--fill);color:var(--ink)}
.ov-nexttog[aria-expanded="true"] .ov-nsum{display:none}
.ov-nexttog[aria-expanded="true"] .ov-ncta svg{transform:rotate(180deg)}
.ov-nextbody{padding:0 40px 32px;display:grid;gap:16px}
.ov-tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ov-track{display:grid;gap:10px;align-content:start;padding:18px 20px;background:var(--bg);border-radius:16px}
.ov-tname{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ov-track h3{font-size:17px;line-height:1.3;font-weight:600}
.ov-track.ov-first{box-shadow:inset 0 0 0 2px var(--accent-ring)}
.ov-start{font-size:11.5px;font-weight:600;color:#fff;background:var(--accent);border-radius:999px;padding:2px 9px;white-space:nowrap}
.ov-track dl{margin:0;display:grid;gap:8px;font-size:14px}
.ov-track dt{font-size:12px;color:var(--muted)}
.ov-track dd{margin:0}
.ov-track q{font-family:var(--font-read);quotes:var(--pw-quotes,"“" "”")}
.ov-next > .ov-todo{margin:0 40px 28px}

.ov-step{display:grid;gap:16px;scroll-margin-top:var(--soltop)}
.ov-ask{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);font-weight:600}
.ov-ask b{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.ov-ans{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.016em;text-wrap:balance;max-width:28em}
.ov-step .ov-ask + .ov-ans{margin-top:-8px}
.ov-foot{display:flex;gap:6px 20px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}

.ov-people{display:flex;gap:6px;flex-wrap:wrap}
.ov-person{border:0;background:var(--fill);color:var(--ink);border-radius:999px;padding:3px 12px 3px 3px;font-size:13px;display:flex;gap:7px;align-items:center}
.ov-person:hover{background:var(--fill2)}
.ov-person i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--mono);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:600;letter-spacing:-.02em;flex:none}
.ov-person small{color:var(--muted);font-size:12px}

.ov-parts{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.ov-part{display:grid;gap:6px;font-size:13px;min-width:0}
.ov-part i{height:8px;border-radius:4px;background:var(--fill2)}
.ov-part.c3 i,.ov-part.c2 i,.ov-part.c1 i{background:var(--ok)} .ov-part.c0 i{background:var(--amber-dot)} .ov-part.cz i{background:var(--bad)}
.ov-part b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ov-part span{color:var(--muted);font-size:12px}
.ov-part.c0 span{color:var(--amber)} .ov-part.cz span{color:var(--bad-ink)}

.ov-tbl{width:100%;border-collapse:collapse;font-size:15px}
.ov-tbl th,.ov-tbl td{text-align:left;padding:11px 14px 11px 0;border-top:1px solid var(--line);vertical-align:top}
.ov-tbl thead th{border-top:0;font-size:12px;font-weight:500;color:var(--muted);padding-top:0;padding-bottom:6px}
.ov-tbl tbody th{font-weight:600}
.ov-tbl tbody th .ov-lk{font-size:inherit;color:var(--ink);font-weight:600}
.ov-tbl tbody th .ov-lk:hover{color:var(--link)}
.ov-tbl td:last-child,.ov-tbl th:last-child{padding-right:0}
.ov-tbl .sm{color:var(--muted);font-size:14px}
.ov-tbl .num{white-space:nowrap;font-variant-numeric:tabular-nums}
.ov-heard{display:flex;gap:8px;align-items:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.ov-heard i{display:block;width:72px;height:6px;border-radius:3px;background:var(--fill2);overflow:hidden;flex:none}
.ov-heard i::before{content:"";display:block;height:100%;width:var(--w);background:var(--accent-ring);border-radius:3px}

.ov-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;font-size:12px;color:var(--muted);padding-bottom:6px}

.ov-theme .tl{font-size:17px;font-weight:600;line-height:1.3}

.ov-saved{grid-column:2;margin:-26px 0 32px;font-size:12px;color:var(--muted);text-align:center;overflow-wrap:anywhere}

@media (max-width:860px){

  .ov-whoname{font-size:22px}

  .ap-nums{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px} .ap-num > b{font-size:26px}
  .ov-nexttog{padding:20px} .ov-ncta{width:100%;justify-content:center} .ov-nextbody{padding:0 20px 24px} .ov-next > .ov-todo{margin:0 20px 20px}
  .ov-tracks{grid-template-columns:minmax(0,1fr)}
  .ov-gauge{font-size:11px}
  .ov-parts{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 4px}
  .ov-fall{grid-template-columns:minmax(0,1fr)}
  .ov-cols{display:none}
  .ov-tbl thead{display:none}

  .ov-theme{grid-template-columns:minmax(0,1fr)}
  .ov-theme .ov-heard{grid-column:1;grid-row:auto}

}

/* tooltips: a small glass popover */
.tip{position:fixed;z-index:30;pointer-events:none;max-width:320px;color:var(--ink);border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.4}

.tip .tc{margin-top:5px;font-size:12px;color:var(--link);font-weight:500}

/* inspector: a floating panel on the right, like Pages and Keynote */
.drawer{position:absolute;top:8px;right:8px;bottom:8px;width:var(--dw);border-radius:18px;display:flex;flex-direction:column;z-index:20;overflow:hidden;
  transform:translateX(calc(100% + 24px));visibility:hidden;transition:transform .38s var(--ease),visibility 0s linear .38s}
.drawer.open{transform:none;visibility:visible;transition:transform .38s var(--ease),visibility 0s}
.stage.has-drawer .toolbar{right:calc(var(--dw) + 20px)}

.stage.has-drawer .madewith{display:none}
@media (prefers-reduced-motion: reduce){.drawer,.drawer.open{transition:none} .ov-ncta svg,.viewsw button,.tab,.person{transition:none}}
.dhead{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:grid;gap:6px;position:relative}
.dclose{position:absolute;top:12px;right:12px;border:0;background:var(--fill);color:var(--muted);border-radius:50%;width:28px;height:28px;padding:0;display:grid;place-items:center}
.dclose:hover{background:var(--fill2);color:var(--ink)}
.dclose svg.ap-ic{width:12px;height:12px;stroke-width:2.2}
.dkind{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
.dtitle{font-size:19px;font-weight:600;line-height:1.25;letter-spacing:-.01em;padding-right:34px;text-wrap:balance}
.dbody{overflow:auto;padding:16px 20px 26px;display:grid;gap:14px;align-content:start}
.explain{font-size:13px;color:var(--muted);background:var(--fill);border-radius:10px;padding:9px 11px}
.formal{font-size:12.5px;color:var(--muted)}

.meter{display:flex;gap:10px;align-items:center;font-size:13px}
.meter .bar{flex:1;height:6px;border-radius:3px;background:var(--fill2);overflow:hidden}

blockquote{margin:0;background:var(--quote);border-radius:12px;box-shadow:inset 3px 0 0 var(--accent-ring);padding:9px 12px 9px 14px;font-family:var(--font-read);font-size:15px;line-height:1.45}

/* sheets: a dimmed window and a large rounded panel, like a macOS sheet */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.24);display:grid;place-items:center;z-index:40;padding:16px}
.mbox{background:var(--surface);border-radius:22px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:28px 30px;box-shadow:var(--shadow);display:grid;gap:12px;position:relative;animation:ap-in .32s var(--ease)}

.nx-last{background:var(--bg);border-radius:14px;padding:12px 16px;font-size:15px;max-width:66ch}

.nx-last.nx-won{background:var(--ok-soft)}

.nx-last svg.ap-ic{width:18px;height:18px;stroke-width:2.2;color:var(--ok-ink);margin-right:6px;vertical-align:-4px}

button.nx-chip{cursor:pointer} button.nx-chip:hover{background:var(--fill)}
.nx-main{font-style:normal;font-size:11.5px;font-weight:600;color:var(--amber)}
.nx-qs{margin:0;padding-left:20px;display:grid;gap:10px}
.nx-qs q{font-family:var(--font-read);font-size:16px;line-height:1.45;quotes:var(--pw-quotes,"“" "”")}

.nx-btn.dc-copy{flex:none;font-size:13px;padding:6px 14px;background:var(--fill);color:var(--link)}

.pg-sure{border-radius:14px;padding:12px 14px;background:var(--amber-soft);display:grid;gap:6px;margin:0 2px}

/* The interview kit, which only Print in Next interviews shows: a plan for the round, then one sheet per call. Paper:
   ink and lines, no fills or shadows, so it prints with "Background graphics" off and stays light in dark mode. Four
   sizes (20, 13, 10.5, 8.5 pt); serif only for words said aloud. What can cross a page is a block or a float. */
#nxkit{display:none}
.kit{--k-ink:#1d1d1f;--k-muted:#55555b;--k-line:#c7c7cc;--k-rule:#d6d6db;--k-blue:#0066cc;--k-mark:#a85700;
  color:var(--k-ink);background:#fff;font-family:var(--font);font-size:10.5pt;line-height:1.38;color-scheme:light}
/* zero specificity, so the gaps the kit's own classes set (above the decisions line, the footer...) win */
:where(.kit) :where(p,h2,h3,ul,ol){margin:0}
.kit ul,.kit ol{padding-left:4.5mm}
.kit b{font-weight:600}
.kit h2{font-size:20pt;line-height:1.15;font-weight:600;letter-spacing:-.015em;text-wrap:balance;break-after:avoid}
.kit-rh{display:flex;justify-content:space-between;gap:6mm;font-size:8.5pt;color:var(--k-muted);border-bottom:.5pt solid var(--k-line);padding-bottom:2mm;margin-bottom:6mm}
.kit-rh b{color:var(--k-ink)}
.kit-small{font-size:8.5pt;color:var(--k-muted)}
.kit-kick{font-size:8.5pt;font-weight:600;color:var(--k-blue);margin-bottom:1.5mm}
.kit-stale{border:1pt solid #ff9500;border-radius:2mm;padding:2.5mm 3.5mm;margin-bottom:5mm;font-weight:600}
.kit-lead{margin-top:2mm}
.kit-sec{margin-top:5mm}
/* The plan page's last sections move to a new page as one block, never one line alone (owner, 2026-11-15).
   One block that cannot break: Chrome let break-before:avoid between them go and left the decisions line alone. */
.kit-plan-end{break-inside:avoid}
.kit-sec > h3{font-size:10.5pt;font-weight:600;padding-bottom:1.5mm;border-bottom:.5pt solid var(--k-line);margin-bottom:2.5mm;display:flex;justify-content:space-between;gap:4mm;break-after:avoid}
.kit-sec > h3 small{font-weight:400;font-size:8.5pt;color:var(--k-muted)}
.kit-bar{display:flex;gap:1.2mm;margin:1.5mm 0 1mm}
.kit-bar i{flex:1;border-top:1.6mm solid var(--k-rule)}
.kit-bar.lv1 i.on{border-top-color:#ff3b30} .kit-bar.lv2 i.on{border-top-color:#ff9500} .kit-bar i.on{border-top-color:#34c759}
.kit-levels{display:flex;justify-content:space-between;gap:2mm;font-size:8.5pt;color:var(--k-muted)}
.kit-levels b{color:var(--k-ink)}
/* how sure, and the main finding, side by side: a round of 5 calls still fits the plan on one Letter page */
.kit-top{display:flex;gap:7mm;align-items:flex-start;margin-top:5mm}
.kit-top > *{flex:1;min-width:0}
.kit-top > .kit-sec,.kit-top > .kit-finding{margin-top:0}
.kit-finding{border:.6pt solid var(--k-line);border-radius:2mm;padding:2.5mm 3.5mm;margin-top:4mm;break-inside:avoid}
table.kit-calls{width:100%;border-collapse:collapse;font-size:inherit}
.kit-calls th{font-size:8.5pt;font-weight:600;color:var(--k-muted);text-align:left;padding:0 2mm 1.5mm 0;border-bottom:.5pt solid var(--k-line);vertical-align:bottom}
.kit-calls td{padding:1.6mm 2mm 1.6mm 0;border-bottom:.5pt solid var(--k-rule);vertical-align:top}
.kit-calls tr{break-inside:avoid}
.kit-calls .c{text-align:center;padding-right:0;width:15mm}
.kit-num{font-weight:600;color:var(--k-blue);font-variant-numeric:tabular-nums;width:6mm}
.kit-box{display:inline-block;width:3.6mm;height:3.6mm;border:.8pt solid var(--k-ink);border-radius:.7mm;vertical-align:-.7mm}
.kit-say{font-family:var(--font-read)}
.kit-quote{border-left:.8pt solid var(--k-ink);padding-left:3mm}
.kit-rules li + li{margin-top:1mm}
.kit-decide{border:.6pt dashed var(--k-line);border-radius:2mm;padding:2.5mm 3.5mm;margin-top:4mm;font-size:8.5pt;break-inside:avoid}
.kit-fields{display:flex;gap:6mm;align-items:flex-end;margin-top:4mm}
.kit-field{display:flex;align-items:flex-end;gap:2mm;white-space:nowrap}
.kit-field:first-child{flex:2} .kit-field:nth-child(2){flex:1}
.kit-field i{flex:1;border-bottom:.6pt solid var(--k-ink);height:4.5mm;min-width:8mm}
.kit-check{display:inline-flex;gap:2mm;align-items:center;white-space:nowrap}
.kit-fit{margin-top:2.5mm;font-size:8.5pt;color:var(--k-muted)}
.kit-fit b{color:var(--k-ink)}
.kit-body{margin-top:2mm}
.kit-body::after{content:"";display:block;clear:both}
.kit-side{float:right;width:50mm;margin-top:4.5mm;border-left:.5pt solid var(--k-line);padding-left:5mm;font-size:8.5pt;line-height:1.4}
.kit-side > div{break-inside:avoid}
.kit-side > div + div{margin-top:5mm}
.kit-side h3{font-size:8.5pt;font-weight:600;margin-bottom:1mm}
.kit-side .kit-say{font-size:10.5pt;line-height:1.35}
.kit-side li + li{margin-top:.8mm}
.kit-mark{font-weight:600;color:var(--k-mark);white-space:nowrap}
.kit-main{margin-right:57mm}
.kit-step{margin-top:4.5mm;padding-left:7mm;position:relative}
.kit-step > h3{font-size:8.5pt;font-weight:600;color:var(--k-muted);break-after:avoid}
.kit-step > h3 b{position:absolute;left:0;color:var(--k-blue)}
.kit-q{margin-top:3mm;break-inside:avoid}
.kit-ask{font-family:var(--font-read);font-size:13pt;line-height:1.32}
.kit-write{margin-top:1.2mm}
.kit-why{font-size:8.5pt;color:var(--k-muted)}
.kit-lines i{display:block;height:6.6mm;border-bottom:.5pt solid var(--k-rule)}
.kit-step:last-child{break-inside:avoid;break-before:avoid}
.kit-then{font-size:8.5pt;margin-top:1.5mm}
.kit-record{margin-top:1.5mm}
.kit-foot{clear:both;break-before:avoid;border-top:.5pt solid var(--k-line);padding-top:2mm;margin-top:6mm;font-size:8.5pt;color:var(--k-muted);break-inside:avoid}
.kit-foot b{color:var(--k-ink)}
.kit-foot .kit-say{font-size:10.5pt;color:var(--k-ink)}
.kit-call{break-before:page}
/* The margins live in the kit, not in @page: the print window's "Margins: None" (which Chrome remembers) drops
   @page margins. The kit's own pages (@page kit) have none, so the two never add up, and other views print as
   before. clone repeats the margins on a call's second page. */
.kit-plan,.kit-call{padding:12mm 14mm;-webkit-box-decoration-break:clone;box-decoration-break:clone}
/* Print in Next interviews (and Command-P there) prints the interview kit and nothing else. */
@media print{
  @page kit{margin:0}
  html:has(body.nx-print), body.nx-print{height:auto!important;overflow:visible!important;background:#fff!important}
  body.nx-print{display:block!important;position:static!important;padding:0!important;margin:0!important}
  body.nx-print > :not(#nxkit){display:none!important}
  body.nx-print #nxkit{display:block;page:kit} }
</style>

<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle"><button class="dclose" id="mClose" type="button" data-t-aria="map.modal.close"><svg class="ap-ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#ap-x"/></svg></button><div id="mBody"></div></div></div>
<div class="drop" id="drop" data-t="map.file.drop" hidden></div>

<script src="labels-en.js"></script>
<script>
/* @kb-schema:4 */ /* @live:1 */ /* draws KBs of schema 4 and 3 (and 2, the same data in YAML), with one or more core jobs, and still reads schema 1 */
/* @kb-data:start */
const SAMPLE = {"meta":{"project":"Open a study file to begin"}};
/* @kb-data:end */

/* ---------- labels ---------- */
/* Every word the map shows comes from a label: English from labels-en.js, or the study's own text, which kb_tool map
   puts in the data as `labels` for a study in another language (meta.language). A label the study lacks, or holds in
   a form that does not fit, shows in English; a key with no English text shows as itself. Keys are always written out
   in full, never built, so a test can find every key in use. A label holds no markup: th() escapes it, then puts in
   the values as they are given, so the caller escapes them. */
if(typeof PW_LABELS_EN!=="object" || !PW_LABELS_EN || typeof PW_LABELS_EN.labels!=="object"){
  document.body.innerHTML = '<div class="err" style="margin:24px">This map cannot show its text: labels-en.js is missing. Keep it next to discovery-map-template.html, as the skill ships them, or open the map that kb_tool made.</div>';
  throw new Error("labels-en.js is missing");
}
const EN = PW_LABELS_EN.labels, BRAND = "Product Weaver", SITE = "productweaver.com";
const RTL = ["ar","he","fa","ur","ps","sd","ug","yi","dv","ckb"];
const PLURALS = ["zero","one","two","few","many","other"];
const UI = {lang:"en", dir:"ltr", en:true, own:{}};
const hasKey = (o,k) => !!o && Object.prototype.hasOwnProperty.call(o,k);
const PLACE = /\{([a-z_]+)\}/g;
const places = s => [...s.matchAll(PLACE)].map(m=>m[1]).sort().join();
// the study's text fits when it is text with the same {name} places as the English, one text per plural form
const fitsText = (v, en) => typeof v==="string" && (v.trim()!=="" || !/\w/.test(en)) && places(v)===places(en);
function fits(own, en){
  if(own==null || en==null) return false;
  if(typeof en==="string") return fitsText(own, en);
  return typeof own==="object" && !Array.isArray(own) && hasKey(own,"other")
    && Object.entries(own).every(([f,v])=>PLURALS.includes(f) && fitsText(v, String(en.other)));
}
let labelCache = new Map();
const pluralRules = new Map();
function labelOf(key){
  let p = labelCache.get(key);
  if(!p){ const en = hasKey(EN,key) ? EN[key] : null, own = hasKey(UI.own,key) ? UI.own[key] : null;
    p = fits(own, en) ? {v:own, lang:UI.lang} : en!=null ? {v:en, lang:"en"} : {v:key, lang:"en"}; labelCache.set(key,p); }
  return p;
}
// a plural label has one text per plural form of its language; English text follows English rules
function pluralForm(p, n){
  if(typeof p.v==="string") return p.v;
  let rules = pluralRules.get(p.lang);
  if(!rules){ try{ rules = new Intl.PluralRules(p.lang); }catch(_){ rules = new Intl.PluralRules("en"); } pluralRules.set(p.lang, rules); }
  const f = typeof n==="number" ? rules.select(n) : "other";
  return String(typeof p.v[f]==="string" ? p.v[f] : p.v.other ?? "");
}
const fillIn = (s, vars) => s.replace(PLACE, (m,k) => hasKey(vars,k) ? String(vars[k]) : m);
/* t: plain text, for textContent and attributes. th: HTML, with \n as a line break and the values put in as given. */
const t = (key, vars) => fillIn(pluralForm(labelOf(key), vars && vars.n), vars);
const th = (key, vars) => fillIn(esc(pluralForm(labelOf(key), vars && vars.n)).replace(/\n/g,"<br>"), vars);
// the words beside a big number: the label holds the number as {n}, the number is drawn apart
const chipWords = (key, n) => fillIn(esc(pluralForm(labelOf(key), n)).replace(/\n/g,"<br>"), {n:""}).trim();
const sentences = (...parts) => parts.filter(Boolean).join(t("map.text.sentence_sep"));
const joinList = items => items.join(t("map.text.list_sep"));
const quoted = q => t("map.text.quote", {q});
const locale = () => UI.lang==="en" ? undefined : UI.lang;
/* The study's language: meta.language, a BCP 47 code; English when it is missing. Right-to-left languages turn the
   page around, but the map's drawing keeps its left-to-right layout (CSS: .stage svg). */
function setLanguage(raw){
  const meta = raw && typeof raw==="object" && raw.meta && typeof raw.meta==="object" ? raw.meta : {};
  let lang = "en";
  try{ if(typeof meta.language==="string" && meta.language.trim()) lang = Intl.getCanonicalLocales(meta.language.trim().replace(/_/g,"-"))[0]; }catch(_){ lang = "en"; }
  const base = lang.split("-")[0].toLowerCase();
  UI.lang = lang; UI.en = base==="en"; UI.dir = RTL.includes(base) ? "rtl" : "ltr";
  UI.own = !UI.en && raw.labels && typeof raw.labels==="object" && !Array.isArray(raw.labels) ? raw.labels : {};
  labelCache = new Map();
  applyLabels();
}
function applyLabels(){
  const root = document.documentElement;
  root.lang = UI.lang;
  if(UI.dir==="rtl") root.dir = "rtl"; else root.removeAttribute("dir");
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-t-title]").forEach(el=>{ el.title = t(el.dataset.tTitle); });
  document.querySelectorAll("[data-t-aria]").forEach(el=>{ el.setAttribute("aria-label", t(el.dataset.tAria)); });
  document.querySelectorAll("[data-t-ph]").forEach(el=>{ el.placeholder = t(el.dataset.tPh); });
  document.getElementById("madeWith").innerHTML = th("map.made.badge", {brand:`<b>${BRAND}</b>`, site:SITE});
  // the quote marks of <q>, from the same label as every other quote
  const marks = t("map.text.quote").split("{q}");
  if(marks.length===2) root.style.setProperty("--pw-quotes", JSON.stringify(marks[0])+" "+JSON.stringify(marks[1]));
}

/* ---------- plain language ---------- */
const STAGES = [
  ["define","map.stage.define.name","map.stage.define.desc"],
  ["locate","map.stage.locate.name","map.stage.locate.desc"],
  ["prepare","map.stage.prepare.name","map.stage.prepare.desc"],
  ["confirm","map.stage.confirm.name","map.stage.confirm.desc"],
  ["execute","map.stage.execute.name","map.stage.execute.desc"],
  ["monitor","map.stage.monitor.name","map.stage.monitor.desc"],
  ["modify","map.stage.modify.name","map.stage.modify.desc"],
  ["conclude","map.stage.conclude.name","map.stage.conclude.desc"]
];
const SRC = {
  transcript:"map.src.transcript",
  quoted_in_notes:"map.src.quoted_in_notes",
  interviewer_notes:"map.src.interviewer_notes"
};
const srcLabel = s => hasKey(SRC,s) ? t(SRC[s]) : "";
/* what people use today to get a step done: [label key, color token] */
const KINDS = {
  product:["map.kind.product","--sol-product"],
  everyday_tool:["map.kind.everyday_tool","--sol-tool"],
  people:["map.kind.people","--sol-people"],
  own_method:["map.kind.own_method","--sol-own"]
};
const kindOf = k => KINDS[k] || ["map.kind.other","--muted"];
const kindLabel = k => t(kindOf(k)[0]);
/* English only: an outcome's formal start, said in plain words. Other languages show the statement as written. */
function plainOutcome(s){
  if(!UI.en) return s;
  const r = [
    [/^Minimize the time (it takes )?to /i,"Less time to "],
    [/^Minimize the likelihood (of|that) /i,(m,w)=>w.toLowerCase()==="that"?"Less risk that ":"Less risk of "],
    [/^Minimize the number of /i,"Fewer "],
    [/^Minimize the amount of /i,"Less "],
    [/^Minimize (the )?/i,"Less "],
    [/^(Maximize|Increase) (the )?/i,"More "],
    [/^Reduce (the )?/i,"Less "]
  ];
  for(const [re,rep] of r){ if(re.test(s)) return s.replace(re,rep); }
  return s;
}
const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
/* Links to productweaver.com carry fixed tags, so the site can count visits from maps opened on people's computers.
   The tags name only the link's place in the map, never anything from the study. On productweaver.com itself (the
   example study) the links stay untagged. */
const PW_SITE = "https://www.productweaver.com/";
const pwUrl = where => /(^|\.)productweaver\.com$/.test(location.hostname) ? PW_SITE
  : `${PW_SITE}?utm_source=productweaver-plugin&utm_medium=discovery-map&utm_campaign=pw-discovery&utm_content=${encodeURIComponent(where)}`;
document.querySelectorAll("a[data-pw]").forEach(a=>{ a.href=pwUrl(a.dataset.pw); });
const short = (s,n) => { s=String(s||""); if(s.length<=n) return s; const cut=s.slice(0,n-1); return cut.slice(0,Math.max(cut.lastIndexOf(" "),n-20)).replace(/[\s,;:.]+$/,"")+"…"; };
const ivName = id => M.ivById[id]?.name || t("map.common.person_fallback", {id});
const names = ids => joinList(ids.map(ivName)); // plain text: wrap in esc()
/* which conversation with the person a quote comes from: 1, or the number of a later one (schema 4) */
const ixNum = e => Number.isInteger(e && e.interaction) && e.interaction>1 ? e.interaction : 1;
/* a conversation's kind as the study stores it; one with none is a transcript, as the merge writes it */
const ixFormat = x => x && x.format ? String(x.format) : "Transcript";
/* a person's later conversations, in their order, after the first one that the record itself holds */
const ixLater = list => (Array.isArray(list) ? list : []).filter(x=>x && typeof x==="object" && Number.isInteger(x.n) && x.n>1)
  .map(x=>({n:x.n, format:ixFormat(x), date:x.date?String(x.date):"", changed:x.changed?String(x.changed):""}))
  .sort((a,b)=>a.n-b.n);
/* when a person last talked to you: the latest date when every conversation of theirs has a YYYY-MM-DD date (iv.sorts),
   else the date of the highest-numbered one as it is written. kb_tool dates the guide's follow-up sheet the same way. */
const ixLast = iv => !iv ? "" : iv.sorts ? iv.ix.map(x=>x.date).sort().pop() : iv.ix[iv.ix.length-1].date;
/* after the source of a quote from a later conversation: its kind and date */
function ixTag(e){
  const n=ixNum(e); if(n<2) return "";
  const x=(M.ivById[String(e.interview)]?.ix||[]).find(c=>c.n===n);
  return x ? `<span class="ixtag">${esc(x.date ? t("map.quote.when", {format:x.format, date:fmtDate(x.date)}) : x.format)}</span>` : "";
}
/* the same sentence from the same person counts once */
function uniqEv(list){ const seen=new Set(); return list.filter(e=>{ const k=e.interview+"\u0000"+(e.quote||""); if(seen.has(k)) return false; seen.add(k); return true; }); }
/* Solutions seen from one core job (or from all when job is null). Current users are people on a
   current use; people who stopped count only if they use it nowhere else in the same scope. */
function solScope(sols, groups, job){
  const uniq = a => [...new Set(a)];
  const items = sols.map(sol=>{
    const at = sol.at.filter(a=>!job || a.step.job===job); if(!at.length) return null;
    const cur = uniq(at.flatMap(a=>a.cur)), stop = uniq(at.flatMap(a=>a.stop)).filter(x=>!cur.includes(x));
    const curEv = uniqEv(at.flatMap(a=>a.curEv)), stopEv = uniqEv(at.flatMap(a=>a.stopEv));
    return {sol, at, cur, stop, curEv, stopEv, ment:curEv.length};
  }).filter(Boolean);
  const byUse = (a,b) => b.cur.length-a.cur.length || b.ment-a.ment || a.sol.name.localeCompare(b.sol.name);
  const gs = groups.map(g=>{
    const its = items.filter(x=>x.sol.group===g.id && x.cur.length).sort(byUse);
    return {g, items:its, ment:its.reduce((n,x)=>n+x.ment,0), people:uniq(its.flatMap(x=>x.cur))};
  }).filter(x=>x.items.length).sort((a,b)=>b.ment-a.ment || b.people.length-a.people.length);
  const gone = items.filter(x=>x.stop.length).sort((a,b)=>b.stop.length-a.stop.length || a.sol.name.localeCompare(b.sol.name));
  return {items, groups:gs, gone, inUse:items.filter(x=>x.cur.length).length, onlyStopped:items.filter(x=>!x.cur.length).length};
}

/* ---------- model ---------- */
let M = null;
function build(raw){
  if(!raw || typeof raw!=="object") throw new Error(t("map.file.not_kb"));
  const jm = raw.job_map||{};
  // schema 1 files had one market_core_job and IDs without a job letter: read them as core job A
  const v1 = !Array.isArray(raw.core_jobs), mcj = raw.market_core_job||{};
  const jobsRaw = !v1 ? raw.core_jobs : ((mcj.statement||jm.core_job||(jm.steps||[]).length) ?
    [{id:"A", statement:mcj.statement||jm.core_job||"", status:mcj.status||jm.status||"", job_executor:mcj.job_executor||""}] : []);
  const stepKey = s => v1 ? "A."+(+s.n) : `${s.job}.${+s.n}`;
  const outKey = o => v1 && /^\d+\.\d+$/.test(String(o.id)) ? "A."+o.id : String(o.id);
  const outStep = o => v1 ? "A."+(+o.step) : String(o.step);
  const ivs = (raw.interviews||[]).map(i=>{
    const cj = i.core_functional_job||{}, main = v1 ? (jobsRaw.length?"A":null) : (cj.job||null);
    const date = i.date?String(i.date):"", format = i.format||"";
    const ix = [{n:1, format:ixFormat(i), date}, ...ixLater(i.interactions)]; // every conversation; the record is the first
    return {
      id:String(i.id), name:i.name||t("map.common.person_fallback",{id:i.id}), date, format,
      ix, sorts:ix.every(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.date)), // dates decide which is the latest only when all sort
      tags:i.tags||[], file:i.file||"", note:i.analyst_note||"",
      who:(i.job_executor||{}).statement||"", whoEv:(i.job_executor||{}).evidence||[],
      goal:cj.statement||"", goalEv:cj.evidence||[], main, whyNone:main?"":(cj.unlinked_reason||""),
      also:[...new Set((i.related_jobs||[]).map(j=>j&&j.job).filter(j=>j && j!==main))],
      related:i.related_jobs||[], emotional:i.emotional_jobs||[], social:i.social_jobs||[]
    };
  });
  const ivById = Object.fromEntries(ivs.map(i=>[i.id,i]));
  const steps = (jm.steps||[]).map(s=>{ const key=stepKey(s); return {id:"s"+key, key, job:key.split(".")[0], n:+s.n,
    stage:String(s.stage||"").toLowerCase(), text:s.statement||"", covers:s.covers||"",
    ev:(s.evidence||[]).map(e=>({...e, interview:String(e.interview)}))}; });
  const outs = ((raw.desired_outcomes||{}).outcomes||[]).filter(o=>!o.merged_into).map(o=>({id:"o"+outKey(o), oid:outKey(o), step:outStep(o),
    text:o.statement||"", plain:plainOutcome(o.statement||""), ev:(o.evidence||[]).map(e=>({...e, interview:String(e.interview)})), added:o.added||""}));
  const people = arr => [...new Set(arr.map(e=>e.interview))];
  outs.forEach(o=>{ o.people=people(o.ev); o.job=o.step.split(".")[0]; });
  steps.forEach(s=>{ s.people=people(s.ev); s.outs=outs.filter(o=>o.step===s.key); s.allPeople=[...new Set([...s.people,...s.outs.flatMap(o=>o.people)])]; });
  // what people use today to get a step done (schema 2 only), grouped by the work the solutions compete for
  const stepByKey = Object.fromEntries(steps.map(s=>[s.key,s]));
  const cs = !v1 && raw.current_solutions && typeof raw.current_solutions==="object" ? raw.current_solutions : {};
  const normStep = x => { const m=String(x??"").match(/^([A-Za-z]+)\.0*(\d+)$/); return m ? `${m[1]}.${+m[2]}` : String(x??""); };
  const groups = Object.entries(cs.groups && typeof cs.groups==="object" ? cs.groups : {}).map(([id,g])=>({
    id:String(id), name:(g&&g.name)||String(id), why:(g&&g.why)||"", list:((g&&g.solutions)||[]).map(String)}));
  const sols = (Array.isArray(cs.solutions)?cs.solutions:[]).filter(s=>s && s.id!=null && !s.merged_into).map(s=>{
    const id=String(s.id), listed=groups.find(g=>g.list.includes(id));
    const uses=(s.uses||[]).filter(Boolean).map(u=>({step:normStep(u.step), status:u.status==="stopped"?"stopped":"current",
      ev:(u.evidence||[]).map(e=>({...e, interview:String(e.interview)}))})).filter(u=>stepByKey[u.step]);
    uses.forEach(u=>{ u.job=u.step.split(".")[0]; });
    return {id, name:s.name||id, kind:s.kind||"", group:s.group!=null?String(s.group):(listed?listed.id:""), added:s.added||"",
      uses, jobs:[...new Set(uses.map(u=>u.job))], at:[]};
  }).filter(s=>s.uses.length);
  sols.forEach(s=>{ if(!groups.some(g=>g.id===s.group)) s.group=""; });
  if(sols.some(s=>s.group==="")) groups.push({id:"", name:t("map.group.none"), why:"", list:[]});
  steps.forEach(s=>{ s.sols=[]; });
  // At a step, each person's latest conversation about the solution says whether they use it now or stopped: the
  // latest by date, then by number, and "uses" wins within one conversation. Dates count only when every conversation
  // of that person has a YYYY-MM-DD date; otherwise the number alone decides. kb_tool counts its users the same way.
  const whenSaid = e => { const iv=ivById[e.interview], n=ixNum(e), x=iv && iv.sorts ? iv.ix.find(c=>c.n===n) : null;
    return [x?x.date:"", n]; };
  const isLater = (a,b) => a[0]!==b[0] ? a[0]>b[0] : a[1]!==b[1] ? a[1]>b[1] : a[2] && !b[2];
  sols.forEach(sol=>{ [...new Set(sol.uses.map(u=>u.step))].forEach(k=>{
    const at=sol.uses.filter(u=>u.step===k), st=stepByKey[k];
    const curEv=uniqEv(at.filter(u=>u.status!=="stopped").flatMap(u=>u.ev)), stopEv=uniqEv(at.filter(u=>u.status==="stopped").flatMap(u=>u.ev));
    const last=new Map();
    [[curEv,true],[stopEv,false]].forEach(([list,now])=>list.forEach(e=>{ const m=[...whenSaid(e), now];
      if(!last.has(e.interview) || isLater(m, last.get(e.interview))) last.set(e.interview, m); }));
    const cur=people(curEv).filter(x=>last.get(x)[2]), entry={sol, step:st, cur, stop:people(stopEv).filter(x=>!last.get(x)[2]), curEv, stopEv, ev:uniqEv([...curEv,...stopEv])};
    st.sols.push(entry); sol.at.push(entry);
  }); });
  steps.forEach(s=>{
    s.sols.sort((a,b)=>b.cur.length-a.cur.length||b.stop.length-a.stop.length||a.sol.name.localeCompare(b.sol.name));
    s.solPeople=people(s.sols.flatMap(x=>x.ev));
    s.solText=s.sols.map(x=>x.sol.name+" "+x.ev.map(e=>e.quote).join(" ")).join(" ");
  });
  const jobs = jobsRaw.map(j=>{ const id=String(j.id); return {id, statement:j.statement||"", status:j.status||"", executor:j.job_executor||"",
    main:ivs.filter(i=>i.main===id).map(i=>i.id), also:ivs.filter(i=>i.main!==id && i.also.includes(id)).map(i=>i.id),
    steps:steps.filter(s=>s.job===id), outs:outs.filter(o=>o.job===id)}; });
  jobs.forEach(j=>{ j.sols=solScope(sols, groups, j.id);
    j.people=[...new Set([...j.main, ...j.also, ...j.steps.flatMap(s=>[...s.allPeople, ...s.solPeople])])]; });
  // value themes: a few needs that group the measures of success of one core job, across its steps
  const vt = !v1 && raw.value_themes && typeof raw.value_themes==="object" ? raw.value_themes : {};
  const outByKey = Object.fromEntries(outs.map(o=>[o.oid,o]));
  const themes = (Array.isArray(vt.themes)?vt.themes:[]).filter(tm=>tm && /^[A-Z]{1,2}\.T\d+$/.test(String(tm.id||""))).map(tm=>{
    const os = [...new Set((Array.isArray(tm.outcomes)?tm.outcomes:[]).map(String))].map(k=>outByKey[k]).filter(Boolean);
    const at = [...new Set(os.map(o=>stepByKey[o.step]).filter(Boolean))].flatMap(st=>st.sols);
    const using = [...new Set(at.map(a=>a.sol))].map(sol=>{ const mine=at.filter(a=>a.sol===sol), cur=[...new Set(mine.flatMap(a=>a.cur))];
      return {sol, cur, stop:[...new Set(mine.flatMap(a=>a.stop))].filter(x=>!cur.includes(x))}; })
      .sort((a,b)=>b.cur.length-a.cur.length||b.stop.length-a.stop.length||a.sol.name.localeCompare(b.sol.name));
    return {id:String(tm.id), job:String(tm.job||String(tm.id).split(".")[0]), label:tm.label||String(tm.id), need:tm.need||"", why:tm.why||"",
      outs:os.slice().sort((a,b)=>b.people.length-a.people.length), people:people(os.flatMap(o=>o.ev)),
      quotes:os.reduce((a,o)=>a+o.ev.length,0), using, dropped:[...new Set(using.flatMap(u=>u.stop))],
      hl:(Array.isArray(tm.highlights)?tm.highlights:[]).filter(h=>h && h.quote).map(h=>({...h, interview:String(h.interview)}))};
  });
  themes.sort((a,b)=>b.people.length-a.people.length||b.outs.length-a.outs.length||a.id.localeCompare(b.id,undefined,{numeric:true}));
  outs.forEach(o=>{ o.themes=themes.filter(tm=>tm.outs.includes(o)); });
  jobs.forEach(j=>{ j.themes=themes.filter(tm=>tm.job===j.id); j.loose=j.themes.length?j.outs.filter(o=>!o.themes.length):[]; });
  // the overview: the sentences the assistant wrote for each core job; the view computes the rest
  const ovr = !v1 && raw.overview && typeof raw.overview==="object" ? raw.overview : {};
  const overs = Object.fromEntries((Array.isArray(ovr.jobs)?ovr.jobs:[]).filter(o=>o && o.job && o.bottom_line).map(o=>[String(o.job),o]));
  jobs.forEach(j=>{ j.over=overs[j.id]||null; });
  const quotes = steps.reduce((a,s)=>a+s.ev.length,0)+outs.reduce((a,o)=>a+o.ev.length,0)
    + sols.reduce((a,s)=>a+s.uses.reduce((b,u)=>b+u.ev.length,0),0)
    + ivs.reduce((a,i)=>a+i.whoEv.length+i.goalEv.length+[...i.related,...i.emotional,...i.social].reduce((b,j)=>b+(j.evidence||[]).length,0),0);
  // per-person contribution, across every core job
  ivs.forEach(i=>{
    const said = e => e.interview===i.id;

   language's words end, or between any two characters; in English such a word stays whole, as it always has. */
const WIDE = /[\u1100-\u115f\u2e80-\u303e\u3041-\u33ff\u3400-\u4dbf\u4e00-\u9fff\ua000-\ua4cf\uac00-\ud7a3\uf900-\ufaff\ufe30-\ufe4f\uff00-\uff60\uffe0-\uffe6]|[\u{20000}-\u{3fffd}]/u;

  const lines=[]; let cur="";
  for(const part of parts) for(const piece of textWidth(part)>chars ? [...part] : [part]){
    if(cur && textWidth(cur+piece)>chars){ lines.push(cur.trimEnd()); cur=piece.trimStart(); } else cur+=piece; }
  if(cur) lines.push(cur); return lines;
}

    if(breaks(cur)){ const parts=breakWord(cur, chars); cur=parts.pop()||""; lines.push(...parts); } }

function setView(want, keepMap){
  // "over", "map", "sol" or "themes"; true and false are the older calls for the Solutions view and the map
  let v = want===true ? "sol" : (want || "map");
  if((v==="sol" && !(M && M.hasSols)) || (v==="themes" && !(M && M.hasThemes)) || (v==="over" && !(M && M.hasOver)) || (v==="next" && !(M && M.hasNext))) v = "map";
  const panel = v==="sol" ? solview : v==="themes" ? themeview : v==="over" ? overview : v==="next" ? nextview : null;
  if(v===viewNow() && (!panel || !panel.hidden)) return;
  solMode = v==="sol"; themeMode = v==="themes"; overMode = v==="over"; nextMode = v==="next"; hideTip();
  const over = !!panel;
  stageEl.classList.toggle("solmode", over); document.querySelector("main").classList.toggle("wide", over);
  solview.hidden = !solMode; themeview.hidden = !themeMode; overview.hidden = !overMode; nextview.hidden = !nextMode; svg.toggleAttribute("inert", over);
  VIEWS.forEach(([name,id])=>{ const b=document.getElementById(id); b.setAttribute("aria-selected", String(name===v)); b.tabIndex = name===v?0:-1; });
  if(solMode) renderSolView();
  if(themeMode) renderThemeView();
  if(overMode) renderOverView();
  if(nextMode) renderNxView();
  if(panel){ panel.scrollTop=0; }
  else if(!keepMap) requestAnimationFrame(()=>{ if(Date.now()>LV.keep) fit(true); }); // not while a reload restores the place
  try{ history.replaceState(null, "", "#"+v); }catch(e){} // a reload after a rebuild keeps this view
}

const lowerFirst = s => { s=String(s||""); return UI.en && /^[A-Z][a-z]/.test(s) ? s[0].toLowerCase()+s.slice(1) : s; };
const fullStop = s => { s=String(s||"").trim(); return s && !/[.!?。！？।؟]$/.test(s) ? s+t("map.text.full_stop") : s; };

/* How sure: fewer than 3 conversations is a hunch; a clear pattern needs 8 or more, with the last 2 adding at most 2 new needs. */
function overSure(scope){
  const order=[...scope].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||a.id.localeCompare(b.id,undefined,{numeric:true}));
  const n=order.length, last=new Set(order.slice(-2).map(i=>i.id)), early=new Set(order.slice(0,-2).map(i=>i.id));
  const fresh=M.outs.filter(o=>o.people.some(p=>last.has(p)) && !o.people.some(p=>early.has(p))).length;
  const level = n<3 ? 1 : (n>=8 && fresh<=2) ? 3 : 2, added = fresh ? t("map.ov.sure.new_needs",{n:fresh}) : t("map.ov.sure.no_new");
  const text = level===1 ? t("map.ov.sure.text_guess",{n})
    : level===2 ? sentences(t("map.ov.sure.text_early",{n, added}), fresh>2 ? t("map.ov.sure.not_all") : "", t("map.ov.sure.trust"))
    : t("map.ov.sure.text_clear",{n, added});
  return {level, text};
}
/* Key unmet needs: the needs most people raised, ahead where today's solutions at that step are weak
   (someone gave one up, or nobody uses a product for it). */
function overNeeds(){
  const uniq = a => [...new Set(a)];
  return M.outs.map(o=>{
    const st=M.steps.find(s=>s.key===o.step), at=st?st.sols:[], cur=at.filter(x=>x.cur.length), kinds=new Set(cur.map(x=>x.sol.kind));
    const stopped=uniq(at.flatMap(x=>x.stop)), product=cur.find(x=>x.sol.kind==="product"), hand=cur.length>0 && !product;
    const why=[];
    if(product) why.push(t("map.ov.needs.use", {name:product.sol.name}));
    else if(hand) why.push(kinds.has("own_method")||kinds.has("everyday_tool") ? t("map.ov.needs.by_hand") : t("map.ov.needs.ask_others"));
    else if(!stopped.length) why.push(t("map.ov.needs.nobody"));
    if(stopped.length) why.push(t("map.ov.needs.gave_up", {n:stopped.length}));
    return {o, why:sentences(...why), weak:(stopped.length?2:0)+(hand?1:0)};
  }).sort((a,b)=>b.o.people.length-a.o.people.length || b.weak-a.weak || b.o.ev.length-a.o.ev.length).slice(0,5);
}

/* Decisions for you: what the assistant needs the reader to confirm, with the same words in the Overview, Next
   interviews and Progress. Each one is a plain question, why, how many people back it, and two replies shown in
   full, each with its own Copy button: the reader sees what they will say, and no code. The assistant asks the
   same question in the chat after a first batch, and finds the decision from the reply's words. */
function decideBacked(x){
  if(x.type==="confirm_core_job"){ const j=M.jobById[String(x.target)]; return j ? j.main.length : 0; }
  return new Set((Array.isArray(x.evidence)?x.evidence:[]).map(e=>String(e && e.interview))).size;
}
/* [what to copy, what to show after it]: a reply that the reader finishes shows "…" but copies without it. */
function decideReplies(x, goal){
  const brand=BRAND, change=x.proposal||"";
  return goal!=null
    ? [[t("map.decide.reply_yes_goal",{brand, goal}), ""], [t("map.decide.reply_change_goal",{brand})+" ", "…"]]
    : [[t("map.decide.reply_yes",{brand, change}), ""], [t("map.decide.reply_no",{brand, change}), ""]];
}
function decideItem(x){
  const n=decideBacked(x), job=x.type==="confirm_core_job" && n ? M.jobById[String(x.target)] : null;
  const goal=x.type==="confirm_core_job" ? String((job && job.statement)||x.proposal||"") : null;
  const ask=job ? th("map.decide.goal",{n, goal:`<b>${esc(goal)}</b>`}) : th("map.decide.change",{change:`<b>${esc(x.proposal)}</b>`});
  const why=goal!=null ? `<p class="dc-why">${th("map.decide.why_goal")}</p>`
    : x.rationale ? `<p class="dc-why"><span>${th("map.ov.field.why")}</span> ${esc(x.rationale)}</p>` : "";
  const replies=decideReplies(x, goal).map(([say, more])=>`<div class="dc-reply"><q class="dc-say">${esc(say.trim())}${more?" "+more:""}</q>
      <button type="button" class="nx-btn nx-ghost dc-copy" data-reply="${esc(say)}">${th("map.decide.copy")}</button></div>`).join("");
  return `<li class="dc-item"><p class="dc-ask">${ask}</p>${why}
    ${n && !job?`<div class="dc-foot"><span>${th("map.decide.backed",{n})}</span></div>`:""}
    <div class="dc-replies">${replies}</div></li>`;
}

function ovMade(){

/* Where this file is, so the reader can find it again: read from its own address, never stored in the file. */
function ovSaved(){
  if(location.protocol!=="file:") return "";
  let parts;
  try{ parts=decodeURIComponent(location.pathname).split("/").filter(Boolean); }catch(e){ return ""; }
  parts.pop();
  if(!parts.length) return "";
  const full=(/^[A-Za-z]:$/.test(parts[0])?"":"/")+parts.join("/");
  return `<p class="ov-saved" title="${esc(full)}">${th("map.made.saved",{folder:esc(parts.slice(-2).join(" › "))})}</p>`;
