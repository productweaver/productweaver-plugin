<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery Map · Product Weaver</title>
<style>
/* Layout: header with a trust strip, then a three-pane workspace: a people and progress sidebar, a pan-and-zoom mind map, and a detail drawer. Ink-blue neutrals with a field-notes green for evidence and amber for "needs more conversations". */
:root{
  --bg:#f4f5f7;
  --surface:#ffffff;
  --ink:#1c2230;
  --muted:#5c6577;
  --line:#dde1e8;
  --accent:#2f5bd3;
  --accent-soft:#e7edfc;
  --ev1:#d6eedf; --ev2:#9fd3b4; --ev3:#4fa97a; --ev4:#1f7a4f;
  --amber:#a86400; --amber-soft:#fdf1dc;
  --quote:#f7f8fa;
  --shadow:0 6px 24px rgba(20,30,60,.12);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-read:"Source Serif 4",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141b; --surface:#1a1f2a; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2b3242;
    --accent:#7da0ff; --accent-soft:#1f2a47;
    --ev1:#1d3a2b; --ev2:#2b6447; --ev3:#3f9a6c; --ev4:#78d3a3;
    --amber:#f0b45a; --amber-soft:#3a2c17; --quote:#151a23; --shadow:0 6px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#1a1f2a; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2b3242;
  --accent:#7da0ff; --accent-soft:#1f2a47;
  --ev1:#1d3a2b; --ev2:#2b6447; --ev3:#3f9a6c; --ev4:#78d3a3;
  --amber:#f0b45a; --amber-soft:#3a2c17; --quote:#151a23; --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{padding:14px 20px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line);background:var(--surface)}
.top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.titles{flex:1;min-width:260px;display:grid;gap:2px}
.kicker{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}
h1{margin:0;font-size:1.35rem;line-height:1.25;font-weight:700;text-wrap:balance}
h1 .goal{color:var(--accent)}
.sub{color:var(--muted);font-size:.86rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:.85rem;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}

.strip{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.chip{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:help}
.chip b{font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1}
.chip span{font-size:.8rem;color:var(--muted);line-height:1.2}
.flow{align-self:center;color:var(--muted);font-size:1.1rem}
.chip.check{border-color:transparent;background:var(--ev1)}
.chip.check span{color:var(--ink)}

main{flex:1;display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0;position:relative}
@media (max-width:860px){main{grid-template-columns:1fr;grid-template-rows:auto 70vh}}

aside.side{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:none;padding:10px 6px;font-size:.84rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.pane{overflow:auto;padding:12px;display:grid;gap:10px;align-content:start;min-height:0;flex:1}
.hint{font-size:.82rem;color:var(--muted)}
.person{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface);text-align:left;display:grid;gap:2px;color:var(--ink)}
.person:hover{border-color:var(--accent)}
.person[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.person .nm{font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;gap:8px}
.person .nm small{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.person .role{font-size:.8rem;color:var(--muted);line-height:1.35}
.gap{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;padding:8px 10px;background:var(--surface);text-align:left;color:var(--ink);font-size:.86rem;display:grid;gap:2px}
.gap:hover{border-color:var(--amber)}
.gap small{color:var(--muted)}
.sect{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin-top:6px}
.callout{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.86rem}
.callout b{color:var(--accent)}

.stage{position:relative;overflow:hidden;background:
  radial-gradient(circle, var(--line) 1px, transparent 1.2px) 0 0/22px 22px, var(--bg);min-height:0;touch-action:none}
.stage svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.stage svg.dragging{cursor:grabbing}
.toolbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.toolbar > *{pointer-events:auto}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px;box-shadow:var(--shadow)}
.search input{border:0;background:transparent;color:var(--ink);width:210px;outline:none;font-size:.88rem}
.tgroup{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.tgroup button{border:0;background:none;color:var(--ink);padding:6px 11px;font-size:.82rem;font-weight:600;border-right:1px solid var(--line)}
.tgroup button:last-child{border-right:0}
.tgroup button:hover{background:var(--accent-soft);color:var(--accent)}
.filterpill{background:var(--accent);color:#fff;border-radius:10px;padding:6px 12px;font-size:.82rem;font-weight:600;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.filterpill button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:0 6px}
.legend{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);font-size:.76rem;color:var(--muted);display:grid;gap:5px;max-width:330px}
.legend .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}

/* map nodes */
.node{cursor:pointer}
.node rect.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.node:hover rect.box{stroke:var(--accent)}
.node.sel rect.box{stroke:var(--accent);stroke-width:2.4}
.node.root rect.box{fill:var(--accent);stroke:var(--accent)}
.node.root text{fill:#fff}
.node.stage rect.box{fill:var(--accent-soft);stroke:transparent}
.node text{fill:var(--ink);font-family:var(--font)}
.node .t1{font-size:13.5px;font-weight:600}
.node .t2{font-size:11px;fill:var(--muted)}
.node.root .t2{fill:#dfe6ff}
.node.stage .t1{font-size:14px;font-weight:700;fill:var(--accent)}
.node.dim{opacity:.18}
.node.hit rect.box{stroke:var(--accent);stroke-width:2.4}
.edge{fill:none;stroke:var(--line);stroke-width:1.6}
.edge.dim{opacity:.2}
.tog circle{fill:var(--surface);stroke:var(--accent);stroke-width:1.4}
.tog text{fill:var(--accent);font-size:11px;font-weight:700}
.thinflag{fill:var(--amber)}

.tip{position:fixed;z-index:30;pointer-events:none;max-width:320px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:9px 11px;font-size:.82rem;line-height:1.4}
.tip .tk{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.tip .tt{font-weight:700;margin:2px 0 4px}
.tip .tm{color:var(--muted)}
.tip .tc{margin-top:5px;font-size:.76rem;color:var(--accent);font-weight:600}

/* drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:20;transform:translateX(100%);transition:transform .22s ease}
.drawer.open{transform:none}
.stage.has-drawer .toolbar{right:calc(min(420px,100%) + 12px)}
@media (prefers-reduced-motion: reduce){.drawer{transition:none}}
.dhead{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px;position:relative}
.dclose{position:absolute;top:10px;right:10px;border:0;background:var(--bg);color:var(--ink);border-radius:8px;width:30px;height:30px;font-size:1.1rem;line-height:1}
.dkind{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}
.dtitle{font-size:1.15rem;font-weight:700;line-height:1.3;padding-right:34px;text-wrap:balance}
.dbody{overflow:auto;padding:14px 18px 24px;display:grid;gap:14px;align-content:start}
.explain{font-size:.88rem;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}
.formal{font-size:.82rem;color:var(--muted)}
.formal b{color:var(--ink);font-weight:600}
.meter{display:flex;gap:10px;align-items:center;font-size:.86rem}
.meter .bar{flex:1;height:8px;border-radius:4px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.meter .bar i{display:block;height:100%;background:var(--ev3)}
.flag{background:var(--amber-soft);color:var(--ink);border-left:4px solid var(--amber);border-radius:0 8px 8px 0;padding:8px 10px;font-size:.85rem}
.qgroup{display:grid;gap:6px}
.qwho{display:grid;gap:0;font-size:.82rem;font-weight:700}
.qwho button{border:0;background:none;color:var(--accent);font-weight:700;padding:0;font-size:.82rem;text-align:left}
.qwho small{font-weight:600;color:var(--muted)}
blockquote{margin:0;background:var(--quote);border-left:3px solid var(--ev3);border-radius:0 8px 8px 0;padding:8px 11px;font-family:var(--font-read);font-size:.95rem;line-height:1.45}
blockquote.para{border-left-color:var(--amber)}
.src{display:block;font-family:var(--font);font-size:.7rem;color:var(--muted);margin-top:4px;font-weight:600}
.olist{display:grid;gap:6px}
.oitem{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);color:var(--ink);text-align:left;display:flex;gap:10px;justify-content:space-between;align-items:center;font-size:.86rem}
.oitem:hover{border-color:var(--accent)}
.dots{display:inline-flex;gap:2px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ev3)}
.feel{display:grid;gap:4px;font-size:.88rem}
.feel div{background:var(--bg);border-radius:8px;padding:6px 9px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:.74rem;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,30,.45);display:grid;place-items:center;z-index:40;padding:16px}
.mbox{background:var(--surface);border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px;box-shadow:var(--shadow);display:grid;gap:12px;position:relative}
.mbox h2{margin:0;font-size:1.25rem}
.mbox ol,.mbox ul{margin:0;padding-left:20px;display:grid;gap:8px}
.gloss{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.88rem}
.gloss dt{font-weight:700}
.gloss dd{margin:0;color:var(--muted)}
.drop{position:fixed;inset:0;background:rgba(47,91,211,.15);border:3px dashed var(--accent);z-index:50;display:grid;place-items:center;font-size:1.3rem;font-weight:700;color:var(--accent);pointer-events:none}
.brand{display:inline-flex;align-items:center;gap:5px;color:var(--accent);text-decoration:none;font-weight:800;letter-spacing:.06em}
.brand:hover{text-decoration:underline}
.pwmark{width:16px;height:16px;flex:none}
.pwmark path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.madewith{position:absolute;right:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.76rem;color:var(--muted);text-decoration:none;box-shadow:var(--shadow)}
.madewith b{color:var(--accent)}
.madewith:hover{border-color:var(--accent);color:var(--ink)}
.cta{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:.9rem}
.cta a{color:var(--accent);font-weight:700}
.err{background:var(--amber-soft);border-left:4px solid var(--amber);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.88rem}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="titles">
      <span class="kicker"><a class="brand" href="https://productweaver.com" target="_blank" rel="noopener"><svg class="pwmark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8c4 0 6 8 9 8s5-8 9-8" /><path d="M3 16c4 0 6-8 9-8s5 8 9 8" /></svg>Product Weaver</a> · Customer discovery map</span>
      <h1 id="title">Loading…</h1>
      <span class="sub" id="subtitle"></span>
    </div>
    <div class="actions">
      <button class="btn" id="btnRead" type="button">How to read this map</button>
      <button class="btn" id="btnBuilt" type="button">How it was built</button>
      <button class="btn primary" id="btnOpen" type="button">Open a KB file</button>
      <input type="file" id="file" accept=".yaml,.yml,.json" hidden>
    </div>
  </div>
  <div class="strip" id="strip" aria-label="From conversations to insights"></div>
</header>

<main>
  <aside class="side" aria-label="People and progress">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="people" type="button">People</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="progress" type="button">Progress</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="next" type="button">Ask next</button>
    </div>
    <div class="pane" id="pane-people" role="tabpanel"></div>
    <div class="pane" id="pane-progress" role="tabpanel" hidden></div>
    <div class="pane" id="pane-next" role="tabpanel" hidden></div>
  </aside>

  <section class="stage" id="stage" aria-label="Map of the customer's job">
    <svg id="svg" role="img" aria-label="Mind map: main goal, stages, steps and success measures"><g id="vp"><g id="edges"></g><g id="nodes"></g></g></svg>
    <div class="toolbar">
      <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search the map and the quotes" aria-label="Search"></label>
      <div class="tgroup" role="group" aria-label="Map controls">
        <button type="button" id="bExpand" title="Show every success measure">Open all</button>
        <button type="button" id="bCollapse" title="Show steps only">Close all</button>
        <button type="button" id="bFit" title="Fit the map to the screen">Fit</button>
        <button type="button" id="bIn" aria-label="Zoom in">+</button>
        <button type="button" id="bOut" aria-label="Zoom out">−</button>
      </div>
      <div class="filterpill" id="pill" hidden><span id="pillText"></span><button type="button" id="pillX" aria-label="Clear highlight">×</button></div>
    </div>
    <div class="legend" id="legend"></div>
    <a class="madewith" href="https://productweaver.com" target="_blank" rel="noopener">Made with <b>Product Weaver</b> · productweaver.com</a>
    <aside class="drawer" id="drawer" aria-label="Details">
      <div class="dhead"><span class="dkind" id="dKind"></span><div class="dtitle" id="dTitle"></div><button class="dclose" id="dClose" type="button" aria-label="Close details">×</button></div>
      <div class="dbody" id="dBody"></div>
    </aside>
  </section>
</main>

<div class="tip" id="tip" hidden></div>
<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle"><button class="dclose" id="mClose" type="button" aria-label="Close">×</button><div id="mBody"></div></div></div>
<div class="drop" id="drop" hidden>Drop the KB file to load it</div>

<script>
/* @kb-data:start */
const SAMPLE = {"meta":{"project":"Open a KB file to begin"}};
/* @kb-data:end */

/* ---------- plain language ---------- */
const STAGES = [
  ["define","Plan","Decide what is needed before starting."],
  ["locate","Gather","Find the inputs and information the job needs."],
  ["prepare","Set up","Organize the inputs and get ready."],
  ["confirm","Check","Make sure everything is right before committing."],
  ["execute","Do it","Carry out the main action."],
  ["monitor","Watch","Keep track while it happens."],
  ["modify","Adjust","Fix things when they go off plan."],
  ["conclude","Wrap up","Finish and learn for next time."]
];
const SRC = {
  transcript:["Their own words","transcript"],
  quoted_in_notes:["Their own words, quoted in notes","notes"],
  interviewer_notes:["Interviewer's summary, not their exact words","paraphrase"]
};
function plainOutcome(s){
  const r = [
    [/^Minimize the time (it takes )?to /i,"Less time to "],
    [/^Minimize the likelihood (of|that) /i,(m,w)=>w.toLowerCase()==="that"?"Less risk that ":"Less risk of "],
    [/^Minimize the number of /i,"Fewer "],
    [/^Minimize the amount of /i,"Less "],
    [/^Minimize (the )?/i,"Less "],
    [/^(Maximize|Increase) (the )?/i,"More "],
    [/^Reduce (the )?/i,"Less "]
  ];
  for(const [re,rep] of r){ if(re.test(s)) return s.replace(re,rep); }
  return s;
}
const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const plural = (n,w,p) => `${n} ${n===1?w:(p||w+"s")}`;

/* ---------- model ---------- */
let M = null;
function build(raw){
  if(!raw || typeof raw!=="object") throw new Error("The file is empty or not YAML.");
  const ivs = (raw.interviews||[]).map(i=>({
    id:String(i.id), name:i.name||("Interview "+i.id), date:i.date?String(i.date):"", format:i.format||"",
    tags:i.tags||[], file:i.file||"", note:i.analyst_note||"",
    who:(i.job_executor||{}).statement||"", whoEv:(i.job_executor||{}).evidence||[],
    goal:(i.core_functional_job||{}).statement||"", goalEv:(i.core_functional_job||{}).evidence||[],
    related:i.related_jobs||[], emotional:i.emotional_jobs||[], social:i.social_jobs||[]
  }));
  const ivById = Object.fromEntries(ivs.map(i=>[i.id,i]));
  const jm = raw.job_map||{};
  const steps = (jm.steps||[]).map(s=>({id:"s"+s.n, n:+s.n, stage:String(s.stage||"").toLowerCase(), text:s.statement||"", covers:s.covers||"",
    ev:(s.evidence||[]).map(e=>({...e, interview:String(e.interview)}))}));
  const outs = ((raw.desired_outcomes||{}).outcomes||[]).filter(o=>!o.merged_into).map(o=>({id:"o"+o.id, oid:String(o.id), step:+o.step,
    text:o.statement||"", plain:plainOutcome(o.statement||""), ev:(o.evidence||[]).map(e=>({...e, interview:String(e.interview)})), added:o.added||""}));
  const people = arr => [...new Set(arr.map(e=>e.interview))];
  steps.forEach(s=>{ s.people=people(s.ev); s.outs=outs.filter(o=>o.step===s.n); s.allPeople=[...new Set([...s.people,...s.outs.flatMap(o=>people(o.ev))])]; });
  outs.forEach(o=>{ o.people=people(o.ev); });
  const mcj = raw.market_core_job||{};
  const quotes = steps.reduce((a,s)=>a+s.ev.length,0)+outs.reduce((a,o)=>a+o.ev.length,0)
    + ivs.reduce((a,i)=>a+i.whoEv.length+i.goalEv.length+[...i.related,...i.emotional,...i.social].reduce((b,j)=>b+(j.evidence||[]).length,0),0);
  // per-person contribution
  ivs.forEach(i=>{
    i.steps = steps.filter(s=>s.people.includes(i.id)).map(s=>s.id);
    i.outs = outs.filter(o=>o.people.includes(i.id)).map(o=>o.id);

/* ---------- map ---------- */
const COL = {root:0, stage:310, step:520, out:880};
const WID = {root:260, stage:150, step:300, out:320};

let view = {x:40,y:40,k:1};
function wrap(text, chars){

function makeTree(){
  const root={id:"root",type:"root",kids:[]};

    const ss=M.steps.filter(s=>s.stage===k).sort((a,b)=>a.n-b.n); if(!ss.length) return;
    const st={id:"g-"+k,type:"stage",key:k,name,desc,kids:[]};
    ss.forEach(s=>{ const sn={id:s.id,type:"step",ref:s,kids:[]}; if(expanded.has(s.id)) s.outs.forEach(o=>sn.kids.push({id:o.id,type:"out",ref:o,kids:[]})); st.kids.push(sn); });

  if(other.length){ const st={id:"g-other",type:"stage",key:"other",name:"Other",desc:"Steps without a stage.",kids:[]}; other.forEach(s=>{const sn={id:s.id,type:"step",ref:s,kids:[]}; if(expanded.has(s.id)) s.outs.forEach(o=>sn.kids.push({id:o.id,type:"out",ref:o,kids:[]})); st.kids.push(sn);}); root.kids.push(st); }
  return root;
}
function measure(n){
  const w=WID[n.type]; n.w=w; const chars=Math.floor((w-36)/7.1);
  if(n.type==="root"){ n.lines=wrap(M.goal||"Main goal not set yet",Math.floor((w-28)/7.6)); n.meta=`The main goal · ${plural(M.ivs.length,"conversation")}`; }
  else if(n.type==="stage"){ n.lines=[n.name]; n.meta=`${plural(n.kids.length,"step")}`; }
  else if(n.type==="step"){ const s=n.ref; n.lines=wrap(s.text,chars); n.meta=`${plural(s.allPeople.length,"person","people")} · ${plural(s.outs.length,"measure")}`; }
  else { const o=n.ref; n.lines=wrap(o.plain,chars); n.meta=`${plural(o.people.length,"person","people")} · ${plural(o.ev.length,"quote")}`; }

}
function place(n, depth, y0){
  n.x = n.type==="root"?COL.root:n.type==="stage"?COL.stage:n.type==="step"?COL.step:COL.out;
  const gap = n.type==="stage"?22:n.type==="step"?10:8;
  if(!n.kids.length){ n.y=y0; return n.h; }
  let y=y0; n.kids.forEach((c,i)=>{ const h=place(c,depth+1,y); y+=h+(i<n.kids.length-1?gap:0); });
  const total=y-y0; const f=n.kids[0], l=n.kids[n.kids.length-1];
  n.y = (f.y + l.y + l.h)/2 - n.h/2;
  if(n.h>total){ const shift=(n.h-total)/2; shiftKids(n,shift); n.y=y0; return n.h; }
  if(n.y<y0){ shiftKids(n,y0-n.y); n.y=y0; }

}
function shiftKids(n,d){ n.kids.forEach(c=>{ c.y+=d; shiftKids(c,d); }); }
let flat=[], tree=null;
function layout(){
  tree=makeTree(); measure(tree); place(tree,0,0);

}
function nodeMatches(n){
  const hits=[];

  if(searchHL){ const q=searchHL; let t="";
    if(n.type==="step") t=n.ref.text+" "+n.ref.ev.map(e=>e.quote).join(" ")+" "+n.ref.outs.map(o=>o.text+" "+o.ev.map(e=>e.quote).join(" ")).join(" ");
    else if(n.type==="out") t=n.ref.text+" "+n.ref.ev.map(e=>e.quote+" "+(e.name||"")).join(" ");
    else t=""; hits.push(n.type==="step"||n.type==="out"? t.toLowerCase().includes(q):null); }

}
function render(keepId){
  let anchor=null; if(keepId){ const n=flat.find(f=>f.id===keepId); if(n) anchor={sx:n.x*view.k+view.x, sy:n.y*view.k+view.y}; }
  layout();

  const E=[], N=[];

    const m = anyHL?nodeMatches(n):null;

    if(n.parent){ const p=n.parent; const x1=p.x+p.w, y1=p.y+p.h/2, x2=n.x, y2=n.y+n.h/2, mx=(x1+x2)/2;

    if(n.type==="step" && n.ref.allPeople.length<3){ g+=`<circle class="thinflag" cx="${n.w-12}" cy="12" r="5"><title>Needs more conversations</title></circle>`; }

      g+=`<g class="tog" transform="translate(${n.w},${n.h/2})"><circle r="11"/><text text-anchor="middle" y="4">${open?"−":"+"}</text></g>`; }
    g+=`</g>`; N.push(g);

  document.getElementById("nodes").innerHTML=N.join("");

function fitHits(){

const svg=document.getElementById("svg"), vp=document.getElementById("vp");

  const minX=Math.min(...flat.map(n=>n.x)), maxX=Math.max(...flat.map(n=>n.x+n.w))+20, minY=Math.min(...flat.map(n=>n.y)), maxY=Math.max(...flat.map(n=>n.y+n.h));
  const kAll=Math.min(1.1, (r.width-60)/(maxX-minX), (r.height-140)/(maxY-minY)); const k=readable?Math.max(.72,Math.min(1,kAll)):kAll; view.k=Math.max(.25,k);
  view.x=Math.max(20,(r.width-(maxX-minX)*view.k)/2)-minX*view.k;
  const ch=(maxY-minY)*view.k; view.y=(ch<=r.height-110? 70+((r.height-110)-ch)/2 : 70)-minY*view.k; applyView();
}
function zoomAt(f,cx,cy){ const k2=Math.min(2.5,Math.max(.2,view.k*f)); view.x=cx-(cx-view.x)*(k2/view.k); view.y=cy-(cy-view.y)*(k2/view.k); view.k=k2; applyView(); }
let drag=null;
svg.addEventListener("pointerdown",e=>{ if(e.target.closest(".node")) return; drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false}; svg.setPointerCapture(e.pointerId); svg.classList.add("dragging"); });
svg.addEventListener("pointermove",e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true; view.x=drag.vx+dx; view.y=drag.vy+dy; applyView(); });
svg.addEventListener("pointerup",e=>{ if(drag && !drag.moved){ closeDrawer(); } drag=null; svg.classList.remove("dragging"); });
svg.addEventListener("wheel",e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top); },{passive:false});
document.getElementById("bIn").onclick=()=>{ const r=svg.getBoundingClientRect(); zoomAt(1.2,r.width/2,r.height/2); };
document.getElementById("bOut").onclick=()=>{ const r=svg.getBoundingClientRect(); zoomAt(1/1.2,r.width/2,r.height/2); };
document.getElementById("bFit").onclick=()=>fit(false);
document.getElementById("bExpand").onclick=()=>{ M.steps.forEach(s=>{ if(s.outs.length) expanded.add(s.id); }); render(); fit(true); };
document.getElementById("bCollapse").onclick=()=>{ expanded.clear(); render(); fit(true); };
function focusNode(id){
  if(id.startsWith("o")){ const o=M.outs.find(x=>x.id===id); if(o) expanded.add("s"+o.step); }
  selected=id; render(); const n=flat.find(f=>f.id===id); if(!n) return;
  const r=svg.getBoundingClientRect(); if(view.k<.8) view.k=.9;
  view.x=r.width/2-(n.x+n.w/2)*view.k; view.y=r.height/2-(n.y+n.h/2)*view.k; applyView();
  openDetails(n); ensureVisible(id);
}

/* ---------- highlights ---------- */
function setPerson(id){
  personHL=id;
  document.querySelectorAll(".person").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.iv===id)));
  if(id){ const iv=M.ivById[id]; M.steps.forEach(s=>{ if(s.outs.some(o=>o.people.includes(id))) expanded.add(s.id); }); }
  updatePill(); render(); if(id) fitHits();
}
let qTimer=null;
document.getElementById("q").addEventListener("input",e=>{
  clearTimeout(qTimer); qTimer=setTimeout(()=>{ const v=e.target.value.trim().toLowerCase(); searchHL=v.length>=2?v:null;
    if(searchHL) M.steps.forEach(s=>{ if(s.outs.some(o=>(o.text+" "+o.ev.map(x=>x.quote).join(" ")).toLowerCase().includes(searchHL))) expanded.add(s.id); });
    updatePill(); render(); },180);
});
function updatePill(){
  const parts=[]; if(personHL) parts.push(`What ${M.ivById[personHL]?.name} added`); if(searchHL) parts.push(`Matches for “${searchHL}”`);
  document.getElementById("pill").hidden=!parts.length; document.getElementById("pillText").textContent=parts.join(" · ");
}
document.getElementById("pillX").onclick=()=>{ personHL=null; searchHL=null; document.getElementById("q").value=""; document.querySelectorAll(".person").forEach(b=>b.setAttribute("aria-pressed","false")); updatePill(); render(); };

/* ---------- details drawer ---------- */
const drawer=document.getElementById("drawer");
function closeDrawer(){ drawer.classList.remove("open"); document.getElementById("stage").classList.remove("has-drawer"); selected=null; document.querySelectorAll(".node.sel").forEach(n=>n.classList.remove("sel")); }
document.getElementById("dClose").onclick=closeDrawer;
function setDrawer(kind,title,body){ document.getElementById("dKind").textContent=kind; document.getElementById("dTitle").textContent=title; document.getElementById("dBody").innerHTML=body; drawer.classList.add("open"); document.getElementById("stage").classList.add("has-drawer");
  document.getElementById("dBody").querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>focusNode(b.dataset.go)));
  document.getElementById("dBody").querySelectorAll("[data-person]").forEach(b=>b.addEventListener("click",()=>{ setPerson(b.dataset.person); openPerson(b.dataset.person); fitHits(); }));
}
function meter(n){ const t=Math.max(1,M.ivs.length); return `<div class="meter"><span><b>${plural(n,"person","people")}</b> of ${t}</span><span class="bar"><i style="width:${Math.round(100*n/t)}%"></i></span></div>`; }
function quotesHTML(ev){
  if(!ev.length) return `<p class="hint">No quotes yet.</p>`;
  const by={}; ev.forEach(e=>{ (by[e.interview]=by[e.interview]||[]).push(e); });
  return Object.entries(by).map(([id,es])=>{ const iv=M.ivById[id]; return `<div class="qgroup"><div class="qwho"><button type="button" data-person="${esc(id)}">${esc(iv?.name||("Interview "+id))}</button><small>${esc(iv?.who||"")}</small></div>`+
    es.map(e=>{ const s=SRC[e.source]||["Source not stated",""]; return `<blockquote class="${e.source==="interviewer_notes"?"para":""}">“${esc(e.quote)}”<span class="src">${esc(s[0])}</span></blockquote>`; }).join("")+`</div>`; }).join("");
}
function dots(n){ let h=""; for(let i=0;i<5;i++) h+=`<i class="${i<Math.min(5,n)?"on":""}"></i>`; return `<span class="dots" aria-label="${plural(n,"person","people")}">${h}</span>`; }
function openDetails(n){
  if(n.type==="root"){
    setDrawer("The main goal",M.goal||"Not set yet",`
      <div class="explain">This is what the customers are trying to get done, written in plain words and without naming any product. Every step and measure on the map serves this goal.</div>
      ${M.executor?`<div><div class="sect">Who does it</div><p>${esc(M.executor)}</p></div>`:""}
      ${M.goalStatus==="proposed"?`<div class="flag">This goal is still a proposal. The team should confirm it reads true for the people interviewed.</div>`:""}
      <div><div class="sect">How each person describes their own goal</div><div class="feel">${M.ivs.map(i=>`<div><b>${esc(i.name)}:</b> ${esc(i.goal)}</div>`).join("")}</div></div>`);
    return;
  }
  if(n.type==="stage"){
    setDrawer("Stage",n.name,`<div class="explain">${esc(n.desc)} Method term: <b>${esc(n.key)}</b>.</div>
      <div class="olist">${n.kids.map(k=>`<button class="oitem" type="button" data-go="${k.id}"><span>${esc(k.ref.text)}</span>${dots(k.ref.allPeople.length)}</button>`).join("")}</div>`);
    return;
  }
  if(n.type==="step"){ const s=n.ref;
    setDrawer("A step in their job",s.text,`
      ${meter(s.allPeople.length)}
      ${s.allPeople.length<3?`<div class="flag">Only ${plural(s.allPeople.length,"person","people")} talked about this step so far. One or two more conversations would show if it holds up.</div>`:""}
      ${s.covers?`<div class="explain">${esc(s.covers)}</div>`:""}
      <div><div class="sect">How they judge this step (${s.outs.length})</div><div class="olist">${s.outs.slice().sort((a,b)=>b.people.length-a.people.length).map(o=>`<button class="oitem" type="button" data-go="${o.id}"><span>${esc(o.plain)}</span>${dots(o.people.length)}</button>`).join("")||`<p class="hint">None yet.</p>`}</div></div>
      <div><div class="sect">What people said while describing it</div>${quotesHTML(s.ev)}</div>`);
    return;
  }
  const o=n.ref, step=M.steps.find(s=>s.n===o.step);
  setDrawer("A measure of success",o.plain,`
    ${meter(o.people.length)}
    <div class="explain">Customers use this to judge whether <b>${esc(step?.text||"this step")}</b> went well. The fewer problems here, the better the step goes for them.</div>
    <div class="formal"><b>Formal statement:</b> ${esc(o.text)} <span style="opacity:.7">(#${esc(o.oid)})</span></div>
    ${o.people.length===1?`<div class="flag">Heard from one person so far. Worth testing in the next conversation.</div>`:""}
    <div><div class="sect">In their own words (${plural(o.ev.length,"quote")})</div>${quotesHTML(o.ev)}</div>`);
}
function openPerson(id){
  const i=M.ivById[id]; if(!i) return;
  const list=(arr,label)=>arr.length?`<div><div class="sect">${label}</div><div class="feel">${arr.map(j=>`<div>${esc(j.statement)}</div>`).join("")}</div></div>`:"";
  setDrawer("A conversation",i.name,`
    <div class="tags">${i.date?`<span class="tag">${esc(fmtDate(i.date))}</span>`:""}${i.format?`<span class="tag">${esc(i.format)}</span>`:""}${i.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
    <div><div class="sect">Who they are</div><p style="margin:0">${esc(i.who)}</p></div>
    <div><div class="sect">What they are trying to get done</div><p style="margin:0"><b>${esc(i.goal)}</b></p>${i.goalEv[0]?`<blockquote style="margin-top:6px">“${esc(i.goalEv[0].quote)}”<span class="src">${esc((SRC[i.goalEv[0].source]||[""])[0])}</span></blockquote>`:""}</div>
    ${i.note?`<div class="flag">${esc(i.note)}</div>`:""}
    ${list(i.emotional,"How they want to feel")}
    ${list(i.social,"How they want to be seen")}
    ${list(i.related,"Other jobs they juggle")}
    <div class="callout">This conversation added <b>${plural(i.quoteCount,"quote")}</b> to <b>${plural(i.steps.length,"step")}</b> and <b>${plural(i.outs.length,"measure")}</b> of success. They are lit up on the map.</div>`);
}

/* ---------- tooltip ---------- */
const tip=document.getElementById("tip");
function showTip(e,html){ tip.innerHTML=html; tip.hidden=false; moveTip(e); }
function moveTip(e){ const pad=14; let x=(e.clientX??e.target.getBoundingClientRect().right)+pad, y=(e.clientY??e.target.getBoundingClientRect().top)+pad;
  const r=tip.getBoundingClientRect(); if(x+r.width>innerWidth-8) x=Math.max(8,x-r.width-2*pad); if(y+r.height>innerHeight-8) y=Math.max(8,y-r.height-2*pad); tip.style.left=x+"px"; tip.style.top=y+"px"; }
function hideTip(){ tip.hidden=true; }

/* ---------- tabs, modals, loading ---------- */
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
  ["people","progress","next"].forEach(k=>document.getElementById("pane-"+k).hidden=(k!==t.dataset.tab));
}));
const modal=document.getElementById("modal");
function openModal(html){ document.getElementById("mBody").innerHTML=html; modal.hidden=false; document.getElementById("mClose").focus(); }
document.getElementById("mClose").onclick=()=>modal.hidden=true;
modal.addEventListener("click",e=>{ if(e.target===modal) modal.hidden=true; });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(!modal.hidden) modal.hidden=true; else closeDrawer(); } });
document.getElementById("btnRead").onclick=()=>openModal(`
  <h2 id="mTitle">How to read this map</h2>
  <p>The map shows what customers are trying to get done and how they judge whether it went well. It reads left to right.</p>
  <dl class="gloss">
    <dt>The main goal</dt><dd>The blue box. What these customers are trying to get done, with no product named.</dd>
    <dt>Stages</dt><dd>The light blue labels: Plan, Gather, Set up, Check, Do it, Watch, Adjust, Wrap up. Almost any job moves through these.</dd>
    <dt>Steps</dt><dd>What customers actually do inside each stage.</dd>
    <dt>Measures of success</dt><dd>Open a step with + to see them. Each one is a way customers judge that step, such as "less time to find a load". They are written so a survey can later ask how much each one matters.</dd>
    <dt>Colored edge</dt><dd>How many people said it. Darker green means more people.</dd>
    <dt>Amber dot</dt><dd>Fewer than 3 people talked about this step. It needs more conversations.</dd>
  </dl>
  <p>Click any box to read the exact quotes behind it. Pick a person on the left to see what their conversation added.</p>`);
document.getElementById("btnBuilt").onclick=()=>openModal(`
  <h2 id="mTitle">How this map was built</h2>
  <ol>
    <li><b>Talk to customers.</b> ${plural(M.ivs.length,"conversation")}, each kept as a transcript or as notes.</li>
    <li><b>Pull out exact quotes.</b> Every claim on the map rests on sentences copied word for word. A script checks each quote against its transcript and refuses anything that doesn't match.</li>
    <li><b>Write each insight in a standard form.</b> Steps describe what people do. Measures of success describe how they judge it. Neither names a product, so the map stays true no matter what we build.</li>
    <li><b>Count the voices.</b> The map shows how many people said each thing. That shows how well supported it is, not how much it matters. A survey of a larger group answers that next.</li>
    <li><b>Keep it honest.</b> Summaries written by the interviewer are labeled as such and shown with an amber edge. Thin spots are flagged, not hidden.</li>
  </ol>
  <p class="hint">Method: Outcome-Driven Innovation, a jobs-to-be-done approach. You don't need to know it to read the map.</p>
  ${M.caveat?`<div class="err">${esc(M.caveat)}</div>`:""}
  <div class="cta"><span>This map was made with the free Product Weaver skill for AI assistants. The full Product Weaver experience is at <a href="https://productweaver.com" target="_blank" rel="noopener">productweaver.com</a>.</span></div>`);
const fileIn=document.getElementById("file");
document.getElementById("btnOpen").onclick=()=>fileIn.click();
fileIn.onchange=()=>{ if(fileIn.files[0]) readFile(fileIn.files[0]); fileIn.value=""; };
function readFile(f){ const r=new FileReader(); r.onload=()=>{ try{ const txt=String(r.result); const data=f.name.endsWith(".json")?JSON.parse(txt):jsyaml.load(txt); load(data); }catch(err){ openModal(`<h2 id="mTitle">That file didn't load</h2><div class="err">${esc(err.message)}</div><p>Open the knowledge base YAML file, usually <b>KB/odi-kb.yaml</b>.</p>`); } }; r.readAsText(f); }
let dragDepth=0; const dropEl=document.getElementById("drop");
addEventListener("dragenter",e=>{ e.preventDefault(); dragDepth++; dropEl.hidden=false; });
addEventListener("dragleave",()=>{ dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) dropEl.hidden=true; });
addEventListener("dragover",e=>e.preventDefault());
addEventListener("drop",e=>{ e.preventDefault(); dragDepth=0; dropEl.hidden=true; const f=e.dataTransfer.files[0]; if(f) readFile(f); });

function load(raw){
  M=build(raw); expanded=new Set(); selected=null; personHL=null; searchHL=null; closeDrawer();
  renderHeader(); renderPeople(); renderProgress(); renderNext(); updatePill();
  render(); requestAnimationFrame(()=>fit(true));
}
addEventListener("resize",()=>{ clearTimeout(window._rt); window._rt=setTimeout(()=>fit(true),150); });
load(SAMPLE);
</script>
